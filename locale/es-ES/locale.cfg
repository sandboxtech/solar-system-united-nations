scenario-name=Naciones Unidas del Sol
description=\n[font=default-large-bold]Naciones Unidas del Sol[/font]\n\nCinco facciones desarrollan planetas públicos que periódicamente saltan a un mundo nuevo.\n\nProduce paquetes científicos, conviértelos en experiencia personal y construye propiedades temporales para conservar tu industria.\n\n[img=virtual-signal/signal-map-marker] Ve a tu planeta natal  →  [img=item/linked-chest] Convierte ciencia en experiencia con brazos insertadores  →  [img=item/construction-robot] Construye o compra tu primera propiedad\n\nNo necesitas leer todas las reglas antes de empezar.\n\nConstruye una fábrica normal, vigila la cuenta atrás del salto y guarda lo importante en tu campamento o propiedad.\n\nProyecto: https://github.com/sandboxtech/solar-system-united-nations\nGrupo QQ: 293280221

