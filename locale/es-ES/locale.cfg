credit-insufficient=No tienes suficientes monedas.
coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=Su cofre personal vinculado está activo (__1__/__2__). No se puede abrir con la mano; utilizar insertadores.
dropoff-refund-spilled=Su cofre vinculado devuelto se cayó al suelo porque su inventario estaba lleno.
dropoff-replaced=Su cofre personal vinculado más antiguo fue eliminado y devuelto como un cofre vinculado.
dropoff-space-forbidden=Los cofres personales vinculados no se pueden colocar en plataformas espaciales. El artículo fue devuelto.
dropoff-placement-forbidden=Los cofres personales vinculados no se pueden colocar aquí. El artículo fue devuelto.
dropoff-limit-disabled=El límite personal de cofres vinculados es actualmente 0. El artículo fue devuelto.
science-converted-notification=Ciencia convertida: __1__ de experiencia
roboport-limit-ports=[img=entity/roboport] Construcción rechazada: la red logística conectada contendría robopuertos __1__, por encima del límite de __2__. Se eliminó el roboport recién colocado.
roboport-limit-robots=[img=entity/logistic-robot] Construcción rechazada: la red logística conectada contiene robots logísticos __1__, por encima del límite de __2__. Se eliminó el roboport recién colocado.
roboport-limit-both=[img=entity/roboport] Construcción rechazada: la red logística conectada contendría robopuertos __1__ (límite __2__) y robots logísticos __3__ (límite __4__). Se eliminó el roboport recién colocado.
