faction-aquilo-neutral=[img=space-location/aquilo] La Academia Tecnocrática Aquilo es permanentemente neutral.\n\nISiempre es amigable con todos los demás países y no participa en cambios diplomáticos.
faction-switch=Desertar y unirse
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Desertar gratis a __1__
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Suicidate y únete a __1__.\n\nNo cuesta resistencia ni monedas.\n\nTu personaje muere en el lugar, dejando atrás su cadáver y sus objetos, luego reaparece en el campamento de refugiados de Nauvis después __2__ segundos.\n\nTu antigua facción confisca tus propiedades y destruye cofres personales vinculados; Los barcos siguen siendo tuyos.
faction-already-current=Ya perteneces a esta facción.
faction-online-required=Debes tener __1__ total de horas en línea antes de unirte a otra facción.\n\nAcerca de __2__ permanece.
faction-target-location-required=Tu personaje debe llegar al mundo público de __1__ antes de unirse a esa facción.
faction-switch-cooldown=Debes esperar __1__ antes de desertar nuevamente.
faction-switch-broadcast=__2__ [img=entity/character] __1__ se unió a la facción.
player-joined-foreign=__2__ [img=entity/character] __1__ se conectó.
