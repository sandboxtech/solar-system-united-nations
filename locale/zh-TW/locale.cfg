credit-insufficient=金幣不足。
coin-tooltip=金幣是五個陣營通用的貨幣。\n\n領取低保、接受轉賬、出售貨物或成交房產都能獲得金幣。\n\n購買貨物與房產、轉賬手續費、犯罪和叛國會消耗金幣。
