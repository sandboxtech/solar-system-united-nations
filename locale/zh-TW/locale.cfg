property-auto-trade-balance-tooltip=左側鐵箱裡的貨物數量代表目標庫存。\n\n右側鋼箱多於目標的貨物會賣出，少於目標的貨物會買入；兩邊數量相同時不會交易。\n\n測試賣出時，可以把左側鐵箱留空，只把貨物放進右側鋼箱。\n\n系統只處理本國市場可交易的普通品質貨物。\n\n屋主線上時，每 __1__ 分鐘嘗試調整一次。\n\n成交使用屋主的金幣，並受市場庫存、市場資金和鋼箱空間限制。
