help-shift-card-travel=[img=utility/time_editor_icon] [font=default-bold]公共星球與躍遷[/font]
help-shift-travel-summary=你的出生點是地球人民共和國的難民營。\n\n從難民營門口前往本國公共星球。\n\n倒計時結束後，公共星球會躍遷成一張新地圖。
help-shift-travel-detail=五顆公共星球分別計算躍遷倒計時。\n\n傳送門連線各國的難民營、公共星球和地下室。\n\n躍遷時，本國居民撤回難民營。\n\n外國角色會在躍遷前 __1__ 分鐘和 __2__ 分鐘收到清除警報並死亡；\n\n某項設為 0 時跳過該次清除。\n\n抵達的新星球會重新生成地形、資源和星球特色。
help-shift-card-logistics=[img=item/linked-chest] [font=default-bold]關聯物流[/font]
help-shift-logistics-summary=國家關聯箱可在公共星球與難民營之間轉運物資。\n\n親手合成木箱會得到個人關聯箱。
help-shift-logistics-detail=玩家親手合成 [img=item/wooden-chest] 木箱時，成品會變為 [img=item/linked-chest] 個人關聯箱。\n\n玩家或機器人直接放置普通木箱時，它仍是普通木箱。\n\n個人關聯箱必須由玩家親手放置，不能在太空平臺使用。\n\n它不能手動開啟，需要使用機械臂。\n\n每名玩家當前最多放置 __1__ 個；\n\n拆除或替換時返還的仍是關聯箱。\n\n具體可放置區域由管理員設定。\n\n國家物流箱不屬於個人；各地點中相互對應的箱子共用同一份庫存。
help-shift-card-advice=[img=virtual-signal/signal-info] [font=default-bold]先做什麼[/font]
help-shift-advice-summary=像普通遊戲一樣開始建設。\n\n留意左上角倒計時，把礦物送回難民營加工。
help-shift-advice-detail=每次躍遷都會換一張地圖。\n\n資源和環境也可能改變。\n\n不要把重要物資的轉運拖到最後一分鐘。
help-factory-card-experience=[img=item/automation-science-pack] [font=default-bold]科技瓶與經驗[/font]
help-factory-experience-summary=個人關聯箱會把科技瓶換成經驗。\n\n各種科技瓶的經驗共同組成總等級。
help-factory-card-building=[img=item/construction-robot] [font=default-bold]建造獨立廠房[/font]
help-factory-building-summary=在建造頁選擇科技瓶和建造等級。\n\n不同科技瓶會生成不同形狀、壽命和功能的廠房。
help-factory-card-logistics=[img=item/linked-chest] [font=default-bold]廠房物流[/font]
help-factory-logistics-summary=廠房入口的關聯箱與屋主個人庫存相連。\n\n使用機械臂和裝卸機跨地圖搬運物資。
help-factory-card-robots=[img=entity/roboport] [font=default-bold]機器人網路[/font]
help-factory-robots-summary=廠房可以建設機器人網路。\n\n單個物流網路設有規模上限。
help-market-card-manual=[img=item/coin] [font=default-bold]本國市場[/font]
help-market-manual-summary=站在本國區域時，可以直接用揹包買賣貨物。\n\n五國市場的庫存、資金和價格彼此獨立。
help-market-card-automatic=[img=item/logistic-science-pack] [font=default-bold]市場小屋[/font]
help-market-automatic-summary=市場小屋會比較目標鐵箱與庫存鋼箱。\n\n屋主線上時，它會自動買賣並接近目標數量。
help-market-card-prices=[img=virtual-signal/signal-anything] [font=default-bold]價格如何變化[/font]
help-market-prices-summary=賣出會增加庫存並壓低價格。\n\n買入會減少庫存並推高價格。
help-market-prices-detail=每個國家市場分別計算價格。\n\n賣出一種貨物時，該貨物因庫存增加而降價；\n\n市場資金減少，也會讓其他貨物小幅降價。\n\n買入時變化方向相反。\n\n大額交易按整段價格曲線結算，不是當前單價乘數量。\n\n庫存為 0 時不能買入；\n\n市場資金不足時不能繼續向玩家收購。
help-property-card-ownership=[img=item/stone-brick] [font=default-bold]本國房產[/font]
help-property-ownership-summary=只能購買和管理本國房產。\n\n進入房產前，角色必須站在本國難民營。
help-property-ownership-detail=房產頁可以檢視五國地產。\n\n外國房產只讀，不能正常購買或進入。\n\n公開房產和雙向好友只改變本國訪客許可權；\n\n訪客仍需從本國難民營進入。
help-property-card-trading=[img=item/coin] [font=default-bold]買賣與加價[/font]
help-property-trading-summary=購買後，成交款扣稅交給原屋主，下一次報價隨即提高。\n\n屋主也可以給自己的房產加價。
help-property-card-lifecycle=[img=utility/time_editor_icon] [font=default-bold]壽命與維護[/font]
help-property-lifecycle-summary=玩家廠房有獨立壽命。\n\n屋主站在房內時，可以續期、擴建或回收。
help-property-card-access=[img=entity/character] [font=default-bold]進入與開放[/font]
help-property-access-summary=房產可以只向屋主和雙向好友開放，也可以向本國全體居民開放。\n\n外國玩家不能正常進入。
help-property-access-detail=房產的開放設定會同時應用於屋主名下全部房產。\n\n私人狀態允許屋主與雙向好友訪問；\n\n公開狀態允許本國居民訪問。\n\n正常進入仍必須從本國難民營發起。\n\n犯罪成功進入屬於例外。
help-card-story=[img=space-location/solar-system-edge] [font=default-bold]太陽系聯合國[/font]
help-card-factions=[img=entity/character] [font=default-bold]選擇陣營[/font]
help-card-foreign-expedition=[img=item/rocket-silo] [font=default-bold]遠征他國星球[/font]
help-card-diplomacy=[img=space-location/solar-system-edge] [font=default-bold]外交關係[/font]
help-card-faction-switch=[img=utility/danger_icon] [font=default-bold]切換陣營[/font]
help-story-background=太陽系聯合國已經分裂成五個國家。\n\n共同貨幣與聯合國難民營仍被保留下來。
help-story-background-detail=五顆星球曾經由太陽系聯合國統一管理。\n\n一次次星球災變和不斷擴大的利益分歧，最終令聯合國分裂。\n\n五顆星球各自建立了新的國家。\n\n它們繼續共同使用金幣，並保留聯合國難民營。\n\n各國既可能合作建設，也可能彼此封鎖甚至開戰。
help-story-factions=陣營決定你的本國星球、科技進度和資產歸屬。\n\n本國難民營和房產，是星球躍遷時最可靠的撤運據點。
help-story-factions-detail=新玩家從 [img=space-location/nauvis] 地球人民共和國開始。\n\n各國分別研究科技。\n\n建築、房產和太空平臺也分別歸各國所有。\n\n你只能正常建造、購買和進入本國房產。\n\n其他國家的房產市場僅供檢視。\n\n本國居民可以在躍遷前把物資轉入本國難民營和房產。\n\n外國玩家不能使用這些據點撤運當地物資。
help-story-foreign=他國特產值得遠征，但當地公共星球同樣會躍遷。\n\n儘快建設 [img=item/rocket-silo] 火箭發射井，把礦物和產品發往軌道平臺，再運回本國。
help-story-foreign-detail=他國基地是有期限的前哨站。\n\n你不能使用當地難民營或房產撤運物資。\n\n撤離警報響起後，請儘快透過火箭和軌道平臺運走物資。\n\n死亡後會在本國難民營復活。\n\n屍體和隨身物品留在原處。
help-story-diplomacy=普通地圖預設向五國開放；管理員可以分別對本國或外國陣營隱藏。\n\n友好國家共享已經探索的視野並停火。\n\n敵對國家不共享探索視野，防禦塔也可能向外國玩家開火。
help-story-diplomacy-detail=建築始終歸各國所有。\n\n友好關係不會自動向盟友開放建築控制權。\n\n無論關係如何，你都不能用紅圖拆除其他國家的建築。\n\n普通國家研究 [img=technology/space-platform-thruster] 太空平臺推進器後，外交關係可能在星球躍遷時發生變化。\n\n[img=space-location/aquilo] 冰星技術官僚學院永久中立。\n\n它與其他國家始終友好。
help-story-faction-switch=加入外國陣營前，先親自抵達對方的公共星球。\n\n房產會被充公，飛船保留。
help-story-faction-switch-detail=加入火星、草星、雷星或冰星陣營時，角色必須站在目標公共星球。\n\n轉籍消耗體力和金幣，角色不會死亡。\n\n加入地球陣營仍會讓角色在原地死亡，隨後在地球難民營復活。\n\n無論加入哪國，原陣營房產都會變為無主，個人關聯箱會被摧毀。\n\n飛船保留；普通建築仍歸原陣營所有。
help-detail-linked-chest=玩家親手合成木箱時，會得到個人關聯箱。\n\n普通木箱被玩家或機器人放到地上時，仍是普通木箱。\n\n個人關聯箱必須由玩家親手放置，不能在太空平臺使用，也不能手動開啟。\n\n當前每名玩家最多放置 __1__ 個。\n\n達到上限後再次放置，會回收最早的舊箱並退還關聯箱。\n\n拆除個人關聯箱時，返還的仍是關聯箱。\n\n房產入口自帶的四個關聯箱不佔個人上限，並與屋主的個人關聯庫存共享物品。\n\n本國公共星球與難民營各有四個國家物流箱；\n\n它們從左到右分別相連，四路庫存彼此獨立。
help-detail-science=玩家線上時，個人關聯箱大約每 __1__ 分鐘轉換一次科技瓶。\n\n離線不滿 __3__ 小時仍會轉換，但大約每 __2__ 分鐘檢查一次。\n\n每瓶增加 1 點對應的個人經驗；\n\n所有種類和品質都可以轉換。
help-detail-logistics-limits=[img=entity/roboport] 單個物流網路最多連線 __1__ 座機器人指令平臺。\n\n[img=entity/logistic-robot] 單個物流網路最多容納 __2__ 個物流機器人。\n\n放置機器人指令平臺後超過任一上限時，剛放置的平臺會被移除，並通知本陣營玩家。
help-detail-experience-effects=設總等級為 L。\n\n建房會永久消耗對應科技瓶經驗，可能降低 L。\n\n新飛船寬度 = __1__+L×__2__。\n\n新飛船壽命 = __3__+L 小時。\n\n作為房產賣方時，實際交易稅率 = 當前基礎稅率 __4__%/(L/100+1)。\n\n飛船屬性只在建造時確定，以後等級變化不會追溯修改。
help-detail-property-basic=購買後，房產入口四個關聯箱會連線到新屋主的個人關聯箱庫存。\n\n每種房型都固定有四個關聯箱；\n\n不同科技瓶會建成尺寸、壽命、地貌或安全性不同的房產。\n\n屋主站在自己的限時房產內，可以續期、擴建或回收。\n\n續期把剩餘壽命補回建造時的完整壽命；經驗費按缺少的壽命和當前面積計算。\n\n擴建會把房產提升一級，並按目標等級更新尺寸、建築壽命和降價週期。\n\n回收會立即撤離所有人、銷燬房內物資並刪除這張地圖。\n\n永久公共房產不能續期、擴建或回收。\n\n房產名稱只能在建造時設定，建成後不可修改；\n\n留空則使用屋主和房產序號組成的預設名稱。
help-detail-property-build=建造等級可以在 0 到當前總等級之間選擇。\n\n等級越高，通常需要越多經驗，也會按房型改變尺寸、壽命、降價速度或初始價格。\n\n不同科技瓶會建成不同房型。\n\n部分房型還會改變入室犯罪的成功率，具體結果可在犯罪頁面檢視。\n\n建造頁會顯示本次建造的實際成本和全部屬性。\n\n房產建成後，這些屬性不再隨玩家等級變化。
help-detail-property-build-formula=設選擇的建造等級為 L。\n\n消耗的對應科技瓶經驗 = (__1__+__2__×L)×__6__，並另消耗 __3__ 體力。\n\n初始房價 = 消耗的對應科技瓶經驗 × 該科技瓶的市場基礎價，最高不超過 __5__ 金幣。\n\n每顆星球最多保留 __4__ 套房產。
help-detail-property-price=每套房產都有自己的降價時間 T。\n\nP 是上一筆實際成交價，D 是價格降回 P 的時刻。\n\n當前價 = min(__1__, max(1, 向上取整(P × a^((D−當前時刻)/T))))。\n\n當前房價倍率 a=__2__。\n\n房產沒有保護期，任何時候都可以再次購買。
help-detail-property-trade=每次成交後，P 改為本次成交價，D=當前時刻+T，因此剛成交後的新報價約為 aP。\n\n當前基礎稅率為 __1__%。\n\n設賣方總等級為 L，實際交易稅率 = 基礎稅率 × 1/(L/100+1)。\n\n房主給自己的房產加價也算正常交易，並更新 P 與 D；其稅率再乘以 __3__。\n\n回收經驗 = 向下取整(建造經驗 × __2__% × 剩餘壽命/建造建築壽命 × 當前面積/初始面積)。\n\n續期體力 = 1000 + 向上取整(建房體力 × 缺失壽命/建造建築壽命 × 當前面積/初始面積)。
help-detail-world-randomization=每輪資源以頻率 __1__、礦區大小 __2__、丰度 __3__ 為標準，各自乘 2^U(-__4__,__4__)。\n\n水域和自然地形引數各乘 2^U(-__5__,__5__)。\n\n懸崖間距與連續程度各乘 2^U(-__6__,__6__)。\n\n敵巢頻率、大小和出生點安全區各乘 2^U(-__7__,__7__)。\n\n溼度和輔助地形引數在 ±0.5 內變化，溫度在 ±20 內變化。\n\n白晝佔 20%～80%。\n\n夜間最低亮度為 0～0.2。\n\n當前全服科技價格倍率為 __8__。\n\n腐敗時間倍率為 __9__。\n\n小行星生成倍率為 __10__。
help-detail-tech-leak=每個陣營每 __1__ 小時分別進行一次科技失傳判定。\n\n免疫名單內的科技、觸發科技，以及當前研究直接依賴的科技不會失傳。\n\n其他開局贈送科技及其前置科技仍然可能失傳。\n\n無限科技被抽中時只降低一級。
help-detail-reset-schedule=下一次躍遷會隨機安排在 __1__～__2__ 小時後。\n\n新星球會改變資源、地形、敵巢、氣候和晝夜。\n\n各星球還會抽取 0～5 個特色詞條。\n\n和平生態、永晝雷原和沉寂沙蟲領地等特殊規則，也會作為詞條出現。
help-detail-tech-leak-formula=每輪科技失傳會隨機得到一個 0～__1__ 的強度 x。\n\n某項已研究科技的失傳機率為 x%×該科技使用的科技瓶種類數。\n\n普通科技會被撤銷。\n\n無限科技只降低一級。\n\n每個陣營每輪最多影響 __2__ 項科技。\n\n隨後再乘所屬陣營的倍率。\n\n[img=space-location/aquilo] 當前為×__3__。\n\n其他陣營均為×1。
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]許可權與防濫用[/font]
help-admin-security=購買、進入、建造、犯罪、傳送和切換陣營時，程式碼都會重新核對玩家、陣營、角色位置、金幣、體力、所有權以及目標地圖是否仍然存在。\n\n遠端檢視不會改變角色的實際位置。\n\n太空中不能犯罪。\n\n犯罪會跳過犯罪者自己的房產和已對外開放的房產。\n\n轉籍扣費失敗時不會改變陣營；地球轉籍死亡失敗時會退還費用。
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]容量與清理[/font]
help-admin-limits=每顆星球當前最多有 __1__ 套房產。\n\n調低上限不會刪除已有房產，只會阻止繼續建造，避免誤刪玩家財產。\n\n個人關聯箱的數量和允許表面可在管理頁調整；\n\n房產自帶的箱子不計入。\n\n降低數量上限會從最早建立的箱子開始回收。\n\n連續離線 __2__ 小時的非管理員玩家，每小時最多清理一名。\n\n玩家記錄、揹包、個人藍圖、賬戶和名下資產都會刪除，只按玩家名保留科技瓶經驗。\n\n公共星球躍遷會先禁止進入並撤離角色，再離開舊星球。
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]新玩家起始資源[/font]
help-admin-starter-resources=用一條 /sc 命令替換起始資源表：\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\n修改立即生效，隻影響之後首次建立的玩家，不會補發或收回已有資源。\n\n每項使用物品原型名和數量。\n\n不存在的物品與非正數數量會被跳過；\n\n揹包放不下的物品掉在角色腳下。\n\n設為 {} 可停止發放表內資源。\n\n新玩家仍會獲得一套與個人頁面相同的初始裝備。\n\n恢復 config.lua 預設值：\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]管理設定的影響範圍[/font]
help-admin-controls=管理頁只對管理員顯示。\n\n常用的經濟、房產、星球、外交、科技失傳和全服倍率都可以在遊戲中調整。\n\n回收比例會立即影響尚未回收的玩家房產。\n\n各房型的尺寸、T、壽命、地貌和風險由場景配置決定。\n\n星球躍遷的最短時間、最長時間和隨機偏向只用於安排下一輪，不會改動已經開始的倒計時。\n\n外交轉換機率從下一次躍遷判定起生效。\n\n手動觸發星球躍遷：/un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>。\n\n這條命令使用與自動躍遷相同的撤離和生成流程；\n\n已有星球正在躍遷時會拒絕執行。\n\n[font=default-bold]科技失傳免疫[/font]\n\n免疫名單直接儲存在 storage.tech_leak_immune_technologies。\n\n管理員用一條 /sc 覆蓋完整名單即可，下一次失傳判定立即使用新名單。\n\n預設示例：/sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“管理員進入本國任意房產”預設關閉。\n\n開啟後只繞過本國房產的訪客許可權；\n\n管理員仍需站在本國聯合國難民營內。\n\n調整引數不會補發、追扣或重新計算已經完成的交易、房產或飛船。
