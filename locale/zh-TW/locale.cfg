property-expand-tooltip=只有屋主親自站在房產內才能擴建。\n\n本次從建造等級 __7__ 提升到 __8__；地圖尺寸變為 __1__×__2__，建築壽命和降價週期也按新等級更新。\n\n經驗費按相鄰兩級的建房經驗差額計算。\n\n本次消耗 __3__ __4__ __5__ 點經驗和 __6__ 體力。
property-expand-rule-tooltip=只有屋主親自站在房產內才能擴建。\n\n每次提升一級；玩家總等級必須達到目標等級。\n\n地圖尺寸、建築壽命和降價週期會按新等級更新。\n\n經驗費為相鄰兩級建房經驗差額的 __1__ 倍，另消耗 __2__ 點體力。\n\n永久公共房產和不支援擴建的房型不能擴建。
