dropoff-replaced=最早的個人關聯箱已拆除，關聯箱已經退還。
dropoff-space-forbidden=太空平臺不能放置個人關聯箱，物品已經退還。
dropoff-placement-forbidden=當前位置不能放置個人關聯箱，物品已經退還。
dropoff-limit-disabled=管理員已將個人關聯箱上限設為 0，物品已經退還。
