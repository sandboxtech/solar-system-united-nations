property-access-tooltip=此開關同時控制你擁有的全部房產。\n\n關閉時，只有屋主與本國的雙向好友可以進入。\n\n開啟時，本國所有玩家都可以進入。\n\n訪客仍需從本國聯合國難民營出發。\n\n外國玩家仍然不能進入。
property-page-tooltip=不同科技瓶會建成尺寸、壽命、地貌或安全性不同的房產。\n\n建造時選擇的房型和等級會永久記錄。\n\n每套房產入口都有四個關聯箱和四個可旋轉的超速裝卸機。\n\n房產名稱建成後不可修改。
property-faction-survival-tooltip=只有當前陣營對應的公共星球是你的本國星球。\n\n其餘公共星球都是外星。\n\n你可以檢視外星房產市場，但不能正常購買或進入外星房產。\n\n當前外國角色清除時間為躍遷前 __1__ 分鐘和 __2__ 分鐘。\n\n非零時間點會發出躍遷警報，並殺死滯留的外國角色。\n\n角色隨後會在本國難民營復活。\n\n留在舊星球的屍體和物資不會抵達新星球。
