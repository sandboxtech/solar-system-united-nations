faction-switch-confirm-free=[img=utility/confirm_slot] 確認叛國並免費加入 __1__
faction-switch-tooltip=必須親自抵達 __1__ 公共星球才能叛國加入。\n\n消耗 __2__ 體力和 [img=item/coin] __3__。\n\n轉籍后角色留在原地；再次轉籍需等待 __4__ 小時。\n\n原陣營房產會被充公，個人關聯箱會被摧毀；飛船保留。
faction-switch-tooltip-free=自殺並加入 __1__。\n\n不消耗體力或金幣。\n\n角色在原地死亡，屍體和物品留下；__2__ 秒後在地球難民營復活。\n\n原陣營房產會被充公，個人關聯箱會被摧毀；飛船保留。
faction-already-current=你已經屬於這個陣營。
faction-online-required=累計線上滿 __1__ 小時後才能加入其他陣營。\n\n還需線上約 __2__。
faction-target-location-required=必須讓角色親自抵達 __1__ 公共星球才能加入該陣營。
faction-switch-cooldown=距離再次叛國還需等待 __1__。
