roboport-limit-robots=[img=entity/logistic-robot] 建造失敗：連線後的物流網路已有 __1__ 個物流機器人，超過上限 __2__。 剛放置的機器人指令平臺已移除。
roboport-limit-both=[img=entity/roboport] 建造失敗：連線後的物流網路將有 __1__ 座機器人指令平臺（上限 __2__）和 __3__ 個物流機器人（上限 __4__）。 剛放置的平臺已移除。
