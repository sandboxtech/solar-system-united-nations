faction-switch-tooltip=叛國並加入 __1__。\n\n消耗 __2__ 體力。\n\n原陣營的房產將被充公；飛船和個人關聯箱會被摧毀。\n\n角色在原地死亡，屍體和物品留下；固定等待 __3__ 秒後復活，不額外收取復活體力。
faction-switch-tooltip-free=叛國並加入 __1__。\n\n加入 [img=space-location/nauvis] 地球人民共和國不消耗體力。\n\n原陣營的房產將被充公；飛船和個人關聯箱會被摧毀。\n\n角色在原地死亡，屍體和物品留下；固定等待 __2__ 秒後復活，不額外收取復活體力。
