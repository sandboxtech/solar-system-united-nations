help-layer-brief=[img=virtual-signal/signal-info] [font=default-bold]On your first visit, follow the steps below in order.[/font]\n\nEstablish income first, then prepare property that survives public-planet resets.
help-layer-advanced=[img=item/automation-science-pack] [font=default-bold]This page only explains how systems connect.[/font]\n\nIt does not repeat opening steps or exact formulas.
