scenario-name=太陽系聯合國
description=\n[font=default-large-bold]太陽系聯合國[/font]\n\n五個陣營開發會週期重置的公共星球。把科技瓶轉換為個人經驗，建造限時房產，並在下一輪災變前把產業轉移到安全據點。\n\n[img=item/wooden-chest] 在本國星球放置木箱  →  [img=item/linked-chest] 用機械臂投入科技瓶  →  [img=item/construction-robot] 建造第一套房產\n\n本國難民營提供避災保障，前往外星需要自行承擔風險。完整規則請查看遊戲內玩法說明。\n\n專案：https://github.com/sandboxtech/solar-system-united-nations\nQQ 群：293280221

