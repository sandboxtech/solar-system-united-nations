faction-page-tooltip=Countries have only two relations: friendly and hostile.\n\nFriendly countries share vision and observe a ceasefire, but do not gain control of one another's buildings.\n\nHostile countries do not share vision, and their defences may fire on foreign players.\n\nAfter a country researches [img=technology/space-platform-thruster] Space platform thruster, each completed shift of its public planet rolls for a diplomatic change.\n\nWhile friendly, it has a __3__% chance to become hostile.\n\nWhile hostile, it has a __4__% chance to become friendly.\n\nOtherwise the relation stays unchanged.\n\nThe [img=space-location/aquilo] Aquilo Technocratic Academy is permanently neutral and does not participate in diplomatic shifts.\n\nSwitching factions kills the character in place. Joining the [img=space-location/nauvis] faction is free; joining another faction costs __1__ stamina.\n\nOld-faction property becomes unowned; the ship and personal linked chests are destroyed.\n\nThis respawn always takes __2__ seconds, and none of these losses are compensated.
