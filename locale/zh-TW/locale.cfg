faction-page-tooltip=普通地圖是否隱藏由管理員設定。\n\n目前對外國陣營隱藏：__3__。\n\n目前對本國陣營隱藏：__4__。\n\n太空平台是否可見仍由船主決定。\n\n友好國家額外共享已探索的視野並停火。\n\n敵對國家不共享探索視野，防禦塔可能向外國玩家開火。\n\n國家研究 [img=technology/space-platform-thruster] 太空平台推進器後，外交關係可能隨本國星球躍遷而改變。\n\n友好轉為敵對的機率為 __1__%。\n\n敵對轉為友好的機率為 __2__%。\n\n[img=space-location/aquilo] 冰星技術官僚學院永久中立。
