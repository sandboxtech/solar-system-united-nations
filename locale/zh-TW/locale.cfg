property-salvage-tooltip=角色必須親自站在自己的房產裡。\n\n回收會立即銷燬房產，並按剩餘壽命和當前面積返還 __1__% 的建造經驗。\n\n當前返還 __2__ __3__ 點經驗。
property-salvage-rule-tooltip=只有屋主親自站在房產內才能回收。\n\n返還經驗按剩餘壽命和當前面積計算，返還比例為 __1__%。\n\n永久公共房產不能回收。
property-salvage-confirm-tooltip=再次點選將立即撤離所有人、銷燬房內全部物資並刪除這張房產地圖。\n\n確認返還 __1__ __2__ 點經驗。
