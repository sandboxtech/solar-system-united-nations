scenario-name=太陽系聯合國
description=\n[font=default-large-bold]太陽系聯合國[/font]\n\n五個陣營在不斷躍遷的公共星球上發展。\n\n把科技瓶轉換為個人經驗，建造限時房產，把產業延續到下一顆新星球。\n\n[img=virtual-signal/signal-map-marker] 先認識傳送與本國難民營  →  [img=item/linked-chest] 用機械臂投入科技瓶  →  [img=item/construction-robot] 建造或購買第一套房產\n\n躍遷前把重要機器和物資撤入安全據點。\n\n完整規則請查看遊戲內玩法說明。\n\n專案：https://github.com/sandboxtech/solar-system-united-nations\nQQ 群：293280221

