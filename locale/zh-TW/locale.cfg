scenario-name=太陽系聯合國
description=\n[font=default-large-bold]太陽系聯合國[/font]\n\n五個陣營在不斷躍遷的公共星球上重新開拓。\n\n生產科技瓶、積累個人經驗，再建立能夠延續產業的限時房產。\n\n[img=virtual-signal/signal-map-marker] 前往本國星球  →  [img=item/linked-chest] 用機械臂把科技瓶換成經驗  →  [img=item/construction-robot] 建造或購買第一套房產\n\n留意躍遷倒計時，並把礦物物資送入房產加工。\n\n專案：https://github.com/sandboxtech/solar-system-united-nations\nQQ 群：293280221

