property-renew-tooltip=只有屋主親自站在房產內才能續期。\n\n續期會把剩餘壽命補回建造時的完整壽命（__5__ 小時），不會額外疊加一整期。\n\n經驗和體力根據缺少的壽命與當前面積計算；體力另收 1000 點固定費用。\n\n本次消耗 __1__ __2__ __3__ 點經驗和 __4__ 體力。
property-renew-rule-tooltip=只有屋主親自站在房產內才能續期。\n\n續期會把剩餘壽命補回建造時的完整壽命，不會額外疊加一整期。\n\n經驗和體力根據缺少的壽命與當前面積計算；體力另收 1000 點固定費用。\n\n永久公共房產不能續期。
