help-foreign-survival=[font=default-bold]本國與外星[/font]\n\n你所屬陣營對應的公共星球是本國星球，其他公共星球都是外星。\n\n本國星球躍遷時，居民可以撤入本國聯合國難民營。躍遷前仍滯留在外星的角色會死亡，隨後在本國難民營復活。外星房產只能查看，不能正常購買或進入。
help-story-background=五顆星球曾經由太陽系聯合國統一管理，並共同使用金幣。\n\n一次次星球災變和不斷擴大的利益分歧最終令聯合國分裂，五顆星球各自建立了新的國家。\n\n聯合國難民營和通用貨幣仍被保留下來。各國既可能開放邊界、合作建設，也可能彼此封鎖甚至開戰。
help-story-factions=選擇陣營，也就選擇了所屬國家和本國星球。新玩家從 [img=space-location/nauvis] 地球人民共和國開始。\n\n各國分別研究科技，並擁有自己的建築、房產和太空平台。你只能正常建造、購買和進入本國房產；其他國家的市場僅供查看。\n\n本國居民可以利用本國難民營和房產，在星球躍遷前轉移物資。外國玩家無法使用這套低成本撤離方式。
help-story-diplomacy=友好國家互相開放邊界並共享視野，可以操作彼此的建築，防禦塔也不會主動攻擊。\n\n敵對國家不共享視野和建築控制權，防禦塔可能向外國玩家開火。無論關係如何，你都不能用拆除規劃器拆除其他國家的建築。\n\n普通國家研究 [img=technology/space-platform-thruster] 太空平台推進器後，外交關係可能在星球躍遷時發生變化。[img=space-location/aquilo] 冰星技術官僚學院永久中立，與其他國家始終友好。
help-story-faction-switch=切換陣營會讓角色在原地死亡，屍體和攜帶物品留在原處。\n\n原陣營的房產會變為無主，飛船和個人關聯箱會被摧毀；普通建築仍歸原陣營所有。\n\n這是代價很高的選擇。請先轉移重要物資，並查看陣營頁面按鈕的說明。
help-advanced-travel-summary=公共星球會週期躍遷。本國難民營和房產是穩定的落腳點；左上角兩個傳送按鈕分別負責往返公共星球和前往自有房產。
help-advanced-linked-summary=個人關聯箱會把科技瓶轉換成經驗。房產自帶的四個關聯箱與屋主共享同一庫存，可用機械臂跨地圖轉移物資。
help-advanced-property-summary=房型由科技瓶決定，建造等級會影響本次成本和屬性。房產可以買賣、再次購買或回收，也會在壽命結束時消失。
help-advanced-world-summary=每次躍遷都會生成新的地形、資源和星球特色。進入太空階段後，已研究科技也可能失傳。
help-brief-start=親手放置 [img=item/wooden-chest] 木箱，建立個人關聯箱。它不能直接開啟，需要用機械臂投入科技瓶；每瓶都會變成對應的個人經驗。
help-brief-property=有經驗後，在「建造」頁消耗經驗和體力建房。也可以先領取低保金幣，在「房產」頁購買本國現成房產。先選一套負擔得起的小屋即可。
help-brief-storage=房產中央的四個關聯箱與屋主的個人關聯箱共享物品。用機械臂存取，就能把想保留的物資送進房產。
help-brief-advice=前期先做一條小規模科技瓶產線，不必一次建完大型工廠。\n\n留意左上角的躍遷倒數，提前搬走最重要的物資。\n\n房產被別人買走時，你會收到扣稅後的成交款，可以再建或再買，不會因此無法繼續。
help-brief-travel=點擊左上角 [img=virtual-signal/signal-map-marker]「傳送」，前往本國公共星球。先採礦、供電、研究，按照普通異星工廠的方式開始生產即可。
help-brief-project=[img=virtual-signal/signal-info] QQ group: 293280221\n\n[img=virtual-signal/signal-info] GitHub: https://github.com/sandboxtech/solar-system-united-nations
help-brief-features=[img=utility/time_editor_icon] 每次星球躍遷都會帶來新的地圖、資源和特色。\n\n[img=space-location/solar-system-edge] 五個陣營擁有各自的科技、領土和市場，關係也會變化。\n\n你可以專心建設，也可以貿易、合作、外交、入侵或交戰。
help-brief-deconstruction=累計在線滿 __1__ 小時並完成下一次傳送後，開放 [img=item/deconstruction-planner] 拆除規劃器。
help-section-beginner=[img=item/linked-chest] [font=default-bold]關聯箱與個人經驗[/font]
help-detail-linked-chest=在管理員允許的公共星球、難民營或房產中，親手放置木箱可建立個人關聯箱；太空平台上的木箱始終保持普通木箱。\n\n個人關聯箱不能手動開啟，需要機械臂存取。目前每名玩家最多 __1__ 個；達到上限後再次放置，會回收最早的舊箱並退還木箱。\n\n房產自帶的四個關聯箱不占個人上限。
help-detail-science=玩家在線時，個人關聯箱大約每 __1__ 分鐘轉換一次科技瓶。\n\n每瓶增加 1 點對應的個人經驗；所有種類和品質都可以轉換。
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]Property guide[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]Experience effect formulas[/font]
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-full-growth-summary=Total level improves new ships and lowers property-sale tax. Building property spends experience.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory. Every type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nOwners may also buy their own property.\n\nThe full asking price is recorded, after-tax proceeds return to them, and their net cost is the tax.\n\nWhile physically inside their own player-built property, the owner may salvage it from the top of Properties. Confirmation immediately evacuates everyone, destroys all contents, and deletes the surface. Permanent public property cannot be salvaged.\n\nA property name can only be chosen during construction and cannot be changed afterward. Leaving it blank uses a default made from the planet, owner, and property number.
help-detail-property-build=建造等級可以在 0 到目前總等級之間選擇。等級越高，通常需要越多經驗，也會按房型改變尺寸、壽命、降價速度或初始價格。\n\n不同科技瓶會建成不同房型。安全小屋更難遭到入室犯罪；冰原小屋壽命很長，但更容易被闖入。\n\n建造頁會顯示本次建造的實際成本和全部屬性。房產建成後，這些屬性不再隨玩家等級變化。
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]Public planets[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]房產建造與交易公式[/font]
help-detail-property-build-formula=設選擇的建造等級為 L。\n\n消耗的對應科技瓶經驗 = __1__+__2__×L，並另消耗 __3__ 體力。\n\n初始房價 = min(__6__, 向上取整(經驗成本 × 目前建造價格倍率 __4__ × 房型倍率))。\n\n每顆星球最多保留 __5__ 套房產。
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe administrator sets the base tax rate, currently __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nAn owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.\n\nSalvage coins = max(1, floor(initial construction price × __2__% × remaining life/total life)). Transactions never change the salvage basis.
help-full-property-summary=Building costs experience and stamina. Buying raises the next asking price by about ×__1__; the previous owner receives the after-tax proceeds. Hover for formulas.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases. Temperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%. Minimum brightness is 0–0.2. Peaceful mode has __8__% probability.\n\nThe current technology price multiplier is __9__.\n\nSpoil-time and asteroid-spawning multipliers are __10__ and __11__.
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]Travel, respawn, and planetary shifts[/font]
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe top-level Travel button switches between your home public planet and its camp; from local property, it returns to the public planet.\n\nThe Property button enters only property you own. It cycles in property-number order when you own several and is disabled when you own none.\n\nBefore leaving a public planet, your coordinates and its current shift cycle are recorded. If it is still the same world, returning places you near that position when possible.\n\nAfter a shift, or when no nearby landing point exists, you arrive at a random point in the 256×256 area around spawn. Positions nearer spawn are more likely.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns you after __2__ seconds; otherwise no stamina is spent, and respawn takes __3__ seconds.\n\nOrdinary deaths respawn at your faction's camp.\n\nSwitching factions kills your character in place and leaves the corpse and items behind. You respawn at the target faction's camp after __3__ seconds without an additional respawn charge.
help-detail-resets=The five public planets count down independently.\n\nServer-wide warnings are issued 5 minutes and 1 minute before a shift. At both times, foreign characters still on that planet are killed; citizens evacuate to their own United Nations Refugee Camp when the shift begins.\n\nEach new world rolls 0–5 mutually compatible traits shown on the Planets page. High-impact resource traits are more common than environmental flavor.\n\nPlanetary shifts do not directly affect technology. That planet's production statistics begin anew, and an invalidated personal linked chest may be placed again.
help-detail-tech-leak=Once a faction has researched [img=technology/space-platform-thruster] Space platform thruster, its technology receives a separate leak check every __1__ hour(s).\n\nA faction that has not reached this milestone cannot lose technology. Losing the thruster technology later does not lock this mechanism again.\n\nTechnologies on the administrator-managed immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak. Infinite research loses only one level when hit.
help-detail-reset-schedule=Each public planet independently rolls its next shift period. With lower bound __1__ hours, upper bound __2__ hours, and exponent a=__3__:\nperiod = lower+(upper−lower)×random(0,1)^a.\n\na>1 biases shorter periods, a=1 is uniform, and 0<a<1 biases longer periods.\n\nEach new world changes the seed, resources, terrain, enemies, climate, daylight, and has a small chance of peaceful mode.\n\n[planet=nauvis] and [planet=gleba] independently set evolution to random(0,1)^2; each planet's native terrain and resources also vary through original controls.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses. Normal technology is revoked; infinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round. Setting this limit to 0 prevents all losses.\n\n隨後再乘所屬陣營的倍率。[planet=aquilo] 目前為×__3__，其他陣營均為×1。
help-full-world-summary=Every shift creates a newly randomized public world. Hover for exact ranges, timing, and technology-loss probabilities.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks. An asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space. Its target faction comes from the character's current public planet, United Nations Refugee Camp, or property. Properties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record. A failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet. Lowering it never deletes existing property; it only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest; central property chests are excluded. Property and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass. The player record, inventory, personal blueprints, account and owned assets are removed; only science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe new-property initial-price multiplier affects only properties built afterward; the salvage rate immediately affects player-built property not yet salvaged. Each property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown. Diplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>. It reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies. Replace the whole list with one /sc command; the next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default. When enabled, it bypasses visitor permissions for local property only; it does not bypass the space or foreign-world travel restriction.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
