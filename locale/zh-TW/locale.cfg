help-foreign-survival=[font=default-bold]本國與外星[/font]\n\n你所屬陣營對應的公共星球是本國星球，其他公共星球都是外星。\n\n本國星球躍遷時，居民可以撤入本國聯合國難民營。\n\n躍遷前仍滯留在外星的角色會死亡，隨後在本國難民營復活。\n\n外星房產只能查看，不能正常購買或進入。
help-story-background=五顆星球曾經由太陽系聯合國統一管理，並共同使用金幣。\n\n一次次星球災變和不斷擴大的利益分歧最終令聯合國分裂，五顆星球各自建立了新的國家。\n\n聯合國難民營和通用貨幣仍被保留下來。\n\n各國既可能開放邊界、合作建設，也可能彼此封鎖甚至開戰。
help-story-factions=陣營決定你的本國星球、科技進度和資產歸屬。\n\n本國難民營和房產，是星球躍遷時最可靠的撤運據點。
help-story-factions-detail=新玩家從 [img=space-location/nauvis] 地球人民共和國開始。\n\n各國分別研究科技，並擁有自己的建築、房產和太空平台。\n\n你只能正常建造、購買和進入本國房產；\n\n其他國家的房產市場僅供查看。\n\n本國居民可以在躍遷前把物資轉入本國難民營和房產，外國玩家不能使用這些據點撤運當地物資。
help-story-foreign=外國特產值得遠征，但當地公共星球同樣會躍遷。\n\n盡快建造 [img=item/rocket-silo] 火箭發射井，把礦物和產品發往軌道平台，再運回本國。
help-story-foreign-detail=他國基地是有期限的前哨站。\n\n你不能使用當地難民營或房產撤運物資。\n\n撤離警報響起後，請盡快透過火箭和軌道平台運走物資。\n\n死亡後會在本國難民營復活。\n\n屍體和隨身物品留在原處。
help-story-diplomacy=普通地圖預設向五國開放；管理員可以分別對本國或外國陣營隱藏。\n\n友好國家共享已探索的視野並停火。\n\n敵對國家不共享探索視野，防禦塔也可能開火。
help-story-diplomacy-detail=建築始終歸各國所有，友好關係不會自動向盟友開放建築控制權。\n\n無論關係如何，你都不能用拆除規劃器拆除其他國家的建築。\n\n普通國家研究 [img=technology/space-platform-thruster] 太空平台推進器後，外交關係可能在星球躍遷時發生變化。\n\n[img=space-location/aquilo] 冰星技術官僚學院永久中立，與其他國家始終友好。
help-story-faction-switch=切換陣營會失去原陣營的房產、飛船和個人關聯箱。\n\n請提前安排遺產。
help-story-faction-switch-detail=切換陣營會讓角色在原地死亡。\n\n屍體和攜帶物品留在原處。\n\n原陣營的房產會變為無主。\n\n飛船和個人關聯箱會被摧毀。\n\n普通建築仍歸原陣營所有。
help-advanced-travel-summary=公共星球會週期躍遷。\n\n本國難民營和房產是穩定的落腳點；\n\n左上角兩個傳送按鈕分別負責往返公共星球和前往自有房產。
help-advanced-linked-summary=個人關聯箱會把科技瓶轉換成經驗。\n\n房產自帶的四個關聯箱與屋主共享同一庫存，可用機械臂跨地圖轉移物資。
help-advanced-property-summary=房型由科技瓶決定，建造等級會影響本次成本和屬性。\n\n房產可以買賣、再次購買或回收，也會在壽命結束時消失。
help-advanced-world-summary=每次躍遷都會生成新的地形、資源和星球特色。\n\n已研究科技也可能失傳。
help-brief-start=親手放置 [img=item/wooden-chest] 木箱，建立個人關聯箱。\n\n關聯箱不能直接開啟。\n\n用機械臂投入科技瓶。\n\n每瓶都會變成對應的個人經驗。
help-brief-property=有經驗後，可以在「建造」頁消耗經驗和體力建房。\n\n也可以先領取低保金幣。\n\n然後在「房產」頁購買本國現成房產。\n\n第一套選擇負擔得起的小屋即可。
help-brief-storage=房產中央的四個關聯箱，與屋主的個人關聯箱共享物品。\n\n使用機械臂存取。\n\n這樣就能把想保留的物資送進房產。
help-brief-advice=前期先做一條小規模科技瓶產線，不必一次建完大型工廠。\n\n留意左上角的躍遷倒數，提前搬走最重要的物資。\n\n房產被別人買走時，你會收到扣稅後的成交款，可以再建或再買，不會因此無法繼續。
help-brief-travel=點擊左上角 [img=virtual-signal/signal-map-marker]「傳送」。\n\n前往本國公共星球。\n\n先採礦、供電和研究。\n\n按照普通異星工廠的方式開始生產即可。
help-brief-project=[img=virtual-signal/signal-info] QQ group: 293280221\n\n[img=virtual-signal/signal-info] GitHub: https://github.com/sandboxtech/solar-system-united-nations
help-brief-features=[img=utility/time_editor_icon] 每次星球躍遷都會帶來新的地圖、資源和特色。\n\n[img=space-location/solar-system-edge] 五個陣營擁有各自的科技、領土和市場，關係也會變化。\n\n你可以專心建設，也可以貿易、合作、外交、入侵或交戰。
help-brief-deconstruction=累計在線滿 __1__ 小時並完成下一次傳送後，開放 [img=item/deconstruction-planner] 拆除規劃器。
help-section-beginner=[img=item/linked-chest] [font=default-bold]關聯箱與個人經驗[/font]
help-detail-linked-chest=在允許的公共星球、難民營或房產中，親手放置木箱可建立個人關聯箱。\n\n個人關聯箱不能手動開啟，需要機械臂存取。\n\n目前每名玩家最多 __1__ 個。\n\n達到上限後再次放置，會回收最早的舊箱並退還木箱。\n\n房產自帶的四個關聯箱不占個人上限。
help-detail-science=玩家在線時，個人關聯箱大約每 __1__ 分鐘轉換一次科技瓶。\n\n離線不滿 __3__ 小時仍會轉換，但大約每 __2__ 分鐘檢查一次。\n\n每瓶增加 1 點對應的個人經驗；\n\n所有種類和品質都可以轉換。
help-detail-logistics-limits=[img=entity/roboport] 單個物流網路最多連接 __1__ 座機器人司令塔。\n\n[img=entity/logistic-robot] 單個物流網路最多容納 __2__ 個物流機器人。\n\n放置機器人司令塔後超過任一上限時，剛放置的司令塔會被移除，並通知本陣營玩家。
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]Property guide[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]Experience effect formulas[/font]
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-full-growth-summary=Total level improves new ships and lowers property-sale tax.\n\nBuilding property spends experience.
help-detail-property-basic=購買後，房產中央四個關聯箱會連接到新屋主的個人關聯箱庫存。\n\n每種房型都有四個關聯箱；不同科技瓶會建成尺寸、壽命、地貌或安全性不同的房產。\n\n屋主站在自己的限時房產內，可以續期、升級或回收。\n\n續期把剩餘壽命補回建造時的完整壽命；經驗費按缺少的壽命和目前面積計算。\n\n升級會把房產提升一級，並按目標等級更新尺寸、總壽命和降價週期。\n\n回收會立即撤離所有人、銷毀房內物資並刪除這張地圖。\n\n永久公共房產不能續期、升級或回收。\n\n房產名稱只能在建造時設定；留空則使用星球、屋主和房產序號組成的預設名稱。
help-detail-property-build=建造等級可以在 0 到目前總等級之間選擇。\n\n等級越高，通常需要越多經驗，也會按房型改變尺寸、壽命、降價速度或初始價格。\n\n不同科技瓶會建成不同房型。\n\n安全小屋更難遭到入室犯罪；\n\n冰原小屋壽命很長，但更容易被闖入。\n\n建造頁會顯示本次建造的實際成本和全部屬性。\n\n房產建成後，這些屬性不再隨玩家等級變化。
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]Public planets[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]房產建造與交易公式[/font]
help-detail-property-build-formula=設選擇的建造等級為 L。\n\n消耗的對應科技瓶經驗 = __1__+__2__×L，並另消耗 __3__ 體力。\n\n初始房價 = min(__6__, 向上取整(經驗成本 × 目前建造價格倍率 __4__ × 房型倍率))。\n\n每顆星球最多保留 __5__ 套房產。
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T))));\n\nthe current price factor is a=__2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe current base tax rate is __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nRaising the price of your own property is a normal transaction and updates P and D; its tax rate is multiplied by __3__.\n\nExperience refund = floor(build experience × __2__% × remaining life/original life × current area/original area).\n\nRenewal stamina = 1000 + ceil(build stamina × missing life/original life × current area/original area).
help-full-property-summary=Building costs experience and stamina.\n\nBuying raises the next asking price by about ×__1__;\n\nthe previous owner receives the after-tax proceeds.\n\nHover for formulas.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases.\n\nTemperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%.\n\nMinimum brightness is 0–0.2.\n\nPeaceful mode has __8__% probability.\n\nThe current technology price multiplier is __9__.\n\nSpoil-time and asteroid-spawning multipliers are __10__ and __11__.
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]Travel, respawn, and planetary shifts[/font]
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe top-level Travel button switches between your home public planet and its camp;\n\nfrom local property, it returns to the public planet.\n\nThe Property button enters only property you own.\n\nIt cycles in property-number order when you own several and is disabled when you own none.\n\nBefore leaving a public planet, your coordinates and its current shift cycle are recorded.\n\nYour position is also recorded when leaving a refugee camp.\n\nIf it is still the same world, returning places you near the recorded position when possible.\n\nChanging factions clears both records.\n\nAfter a shift, or when no nearby landing point exists, you arrive at a random point in the 256×256 area around spawn.\n\nPositions nearer spawn are more likely.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns you after __2__ seconds;\n\notherwise no stamina is spent, and respawn takes __3__ seconds.\n\nOrdinary deaths respawn at your faction's camp.\n\nSwitching factions kills your character in place and leaves the corpse and items behind.\n\nYou respawn at the target faction's camp after __3__ seconds without an additional respawn charge.
help-detail-resets=五顆公共星球分別計算躍遷倒數。\n\n外國角色會在躍遷前收到撤離警報。\n\n本國居民會在躍遷時撤往本國聯合國難民營。\n\n新星球會生成不同的地圖、資源和星球特色。
help-detail-tech-leak=Each faction receives a separate technology-leak check every __1__ hour(s).\n\nTechnologies on the immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak.\n\nInfinite research loses only one level when hit.
help-detail-reset-schedule=下一次躍遷會隨機安排在 __1__～__2__ 小時後。\n\n新星球會改變資源、地形、敵巢、氣候和晝夜。\n\n各星球特有的地形與資源也會變化。\n\n新星球有少量機會進入和平模式。
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses.\n\nNormal technology is revoked;\n\ninfinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round.\n\n隨後再乘所屬陣營的倍率。\n\n[img=space-location/aquilo] 目前為×__3__，其他陣營均為×1。
help-full-world-summary=Every shift creates a newly randomized public world.\n\nHover for exact ranges, timing, and technology-loss probabilities.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks.\n\nAn asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space.\n\nIts target faction comes from the character's current public planet, United Nations Refugee Camp, or property.\n\nProperties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record.\n\nA failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet.\n\nLowering it never deletes existing property;\n\nit only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest;\n\ncentral property chests are excluded.\n\nProperty and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass.\n\nThe player record, inventory, personal blueprints, account and owned assets are removed;\n\nonly science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]新玩家起始資源[/font]
help-admin-starter-resources=用一條 /sc 指令替換起始資源表：\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\n修改立即生效，只影響之後首次建立的玩家，不會補發或收回已有資源。\n\n每項使用物品原型名稱和數量。\n\n不存在的物品與非正數數量會被跳過；\n\n背包放不下的物品掉在角色腳下。\n\n設為 {} 可停止發放起始資源。\n\n恢復 config.lua 預設值：\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe new-property initial-price multiplier affects only properties built afterward;\n\nthe salvage rate immediately affects player-built property not yet salvaged.\n\nEach property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nDiplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>.\n\nIt reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies.\n\nReplace the whole list with one /sc command;\n\nthe next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default.\n\nWhen enabled, it bypasses visitor permissions for local property only;\n\nit does not bypass the space or foreign-world travel restriction.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
