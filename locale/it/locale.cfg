help-shift-card-travel=[img=utility/time_editor_icon] [font=default-bold]Pianeti pubblici e spostamenti[/font]
help-shift-travel-summary=Usa l'ingresso del campo per raggiungere il tuo pianeta pubblico.\n\nQuando il conto alla rovescia termina, quel pianeta si trasforma in un mondo appena generato.
help-shift-travel-detail=I cinque pianeti pubblici hanno conti alla rovescia separati.\n\nI portali collegano il campo profughi, il pianeta pubblico e il seminterrato di ogni paese.\n\nDurante uno spostamento, i cittadini vengono evacuati nel proprio campo.\n\nI personaggi stranieri vengono avvisati e uccisi __1__ e __2__ minuti prima;\n\nun valore pari a 0 disattiva la relativa evacuazione forzata.\n\nIl nuovo mondo genera terreni, risorse e caratteristiche planetarie differenti.
help-shift-card-logistics=[img=item/linked-chest] [font=default-bold]Logistica collegata[/font]
help-shift-logistics-summary=I bauli nazionali collegati spostano le scorte tra il tuo pianeta pubblico e il campo profughi.\n\nLa lavorazione manuale di un baule di legno produce un baule personale collegato.
help-shift-logistics-detail=Quando un giocatore crea manualmente un baule di legno [img=item/wooden-chest], il risultato diventa un baule personale [img=item/linked-chest] collegato.\n\nI bauli di legno posizionati direttamente dai giocatori o dai robot rimangono normali bauli di legno.\n\nUn baule di legno collegato personalmente. il baule deve essere posizionato a mano e non può essere utilizzato su una piattaforma spaziale.\n\nNon può essere aperto direttamente; utilizzare gli inseritori.\n\nOgni giocatore può attualmente posizionare __1__;\n\nestrazione o sostituzione restituisce il forziere collegato stesso.\n\nGli amministratori controllano l'ordinario consentito superfici.\n\nLe casse logistiche nazionali non sono personali. I forzieri corrispondenti in ciascuna destinazione condividono un inventario.
help-shift-card-advice=[img=virtual-signal/signal-info] [font=default-bold]Cosa fare prima[/font]
help-shift-advice-summary=Inizia costruendo come in un gioco normale.\n\nGuarda il conto alla rovescia in alto a sinistra e rispedisci al campo le provviste che apprezzi di più.
help-shift-advice-detail=Ogni turno porta con sé una mappa diversa.\n\nAnche le risorse e le condizioni ambientali possono cambiare.\n\nNon lasciare i trasporti importanti fino all'ultimo minuto.
help-factory-card-experience=[img=item/automation-science-pack] [font=default-bold]Scienza ed esperienza[/font]
help-factory-experience-summary=I bauli personali collegati trasformano i pacchetti scientifici in esperienza.\n\nL'esperienza in ogni categoria scientifica contribuisce al livello totale.
help-factory-card-building=[img=item/construction-robot] [font=default-bold]Costruisci l'interno di una fabbrica[/font]
help-factory-building-summary=Scegli un pacchetto scientifico e un livello di costruzione nella pagina Costruisci.\n\nOgni pacchetto crea un layout, una durata e una funzione diversi.
help-factory-card-logistics=[img=item/linked-chest] [font=default-bold]Logistica interna[/font]
help-factory-logistics-summary=I bauli d'ingresso si collegano all'inventario personale collegato del proprietario.\n\nUtilizza inseritori e caricatori per spostare le scorte tra le superfici.
help-factory-card-robots=[img=entity/roboport] [font=default-bold]Reti di robot[/font]
help-factory-robots-summary=Gli interni della fabbrica possono contenere reti di robot.\n\nOgni rete logistica ha un limite di dimensioni.
help-market-card-manual=[img=item/coin] [font=default-bold]Mercato locale[/font]
help-market-manual-summary=Mentre sei nel territorio nazionale, scambia le merci direttamente dal tuo inventario principale.\n\nOgni paese ha azioni, fondi e prezzi indipendenti.
help-market-card-automatic=[img=item/logistic-science-pack] [font=default-bold]Officina mercato[/font]
help-market-automatic-summary=Un'officina del mercato confronta il suo baule di ferro con il suo baule di acciaio.\n\nMentre il proprietario è online, commercia verso le quantità target.
help-market-card-prices=[img=virtual-signal/signal-anything] [font=default-bold]Come si muovono i prezzi[/font]
help-market-prices-summary=La vendita aggiunge inventario e abbassa i prezzi.\n\nL'acquisto rimuove l'inventario e fa salire i prezzi.
help-market-prices-detail=Ogni mercato nazionale calcola i prezzi separatamente.\n\nLa vendita di un articolo aumenta le scorte e riduce il prezzo dell'articolo;\n\nla perdita di fondi di mercato riduce leggermente anche altri articoli.\n\nL'acquisto inverte entrambi effetti.\n\nLe grandi operazioni integrano l'intera curva dei prezzi anziché moltiplicare la quantità per il prezzo unitario corrente.\n\nGli articoli esauriti non possono essere acquistati;\n\nUn mercato sottofinanziato non può continuare ad acquistare dai giocatori.
help-property-card-ownership=[img=item/stone-brick] [font=default-bold]Proprietà locale[/font]
help-property-ownership-summary=Puoi acquistare e gestire proprietà solo nel tuo paese.\n\nIl tuo personaggio deve trovarsi nell'accampamento di origine prima di entrare nella proprietà.
help-property-ownership-detail=La pagina Proprietà mostra gli immobili in tutti e cinque i paesi.\n\nLe proprietà straniere sono di sola lettura e normalmente non possono essere acquistate o inserite.\n\nL'accesso pubblico e l'amicizia reciproca concedono il permesso ai visitatori locali solo;\n\ni visitatori devono comunque entrare dal campo di appartenenza.
help-property-card-trading=[img=item/coin] [font=default-bold]Acquisti e ricarichi[/font]
help-property-trading-summary=Dopo un acquisto, il precedente proprietario riceve il ricavato al netto delle tasse e il successivo aumento del prezzo richiesto.\n\nI proprietari possono anche contrassegnare la propria proprietà.
help-property-card-lifecycle=[img=utility/time_editor_icon] [font=default-bold]Durata e manutenzione[/font]
help-property-lifecycle-summary=Gli interni costruiti dai giocatori hanno una vita propria.\n\nUn proprietario che si trova all'interno può rinnovarne, espandere o recuperarne uno.
help-property-card-access=[img=entity/character] [font=default-bold]Ingresso e accesso del pubblico[/font]
help-property-access-summary=La proprietà può essere limitata al proprietario e agli amici comuni o aperta a tutti i cittadini.\n\nI giocatori stranieri non possono entrare normalmente.
help-property-access-detail=L'impostazione di accesso del proprietario si applica a ogni immobile di sua proprietà.\n\nL'accesso privato ammette il proprietario e gli amici comuni;\n\nL'accesso pubblico ammette tutti i cittadini locali.\n\nL'ingresso ordinario deve comunque iniziare da il campo di casa.\n\nUn furto con scasso riuscito è un'eccezione.
help-card-story=[img=space-location/solar-system-edge] [font=default-bold]Nazioni Unite del Sol[/font]
help-card-factions=[img=entity/character] [font=default-bold]Scegliere una fazione[/font]
help-card-foreign-expedition=[img=item/rocket-silo] [font=default-bold]Spedizioni su pianeti stranieri[/font]
help-card-diplomacy=[img=space-location/solar-system-edge] [font=default-bold]Rapporti diplomatici[/font]
help-card-faction-switch=[img=utility/danger_icon] [font=default-bold]Cambio fazione[/font]
help-story-background=Le Nazioni Unite del Sole si sono divise in cinque paesi.\n\nLa sua moneta comune e i campi profughi rimangono.
help-story-background-detail=Un tempo i cinque pianeti erano governati dalle Nazioni Unite del Sole.\n\nRipetuti disastri planetari e crescenti conflitti di interessi alla fine divisero l'unione.\n\nEmersero cinque nuovi paesi.\n\nLoro condividono ancora una valuta comune e mantengono i campi profughi delle Nazioni Unite.\n\nOggi i paesi possono costruire insieme, chiudere i confini o entrare in guerra.
help-story-factions=La tua fazione determina il tuo pianeta natale, i progressi della ricerca e la proprietà delle risorse.\n\nIl tuo accampamento e la tua proprietà sono i punti di evacuazione più affidabili durante uno spostamento planetario.
help-story-factions-detail=I nuovi giocatori iniziano nella [img=space-location/nauvis] Repubblica popolare di Nauvis.\n\nOgni paese ha ricerche separate.\n\nAnche gli edifici, le proprietà e le piattaforme spaziali appartengono a singoli paesi.\n\nNormalmente puoi costruire, acquistare e inserire proprietà solo nel tuo paese.\n\nI mercati immobiliari esteri sono solo per la visualizzazione.\n\nI cittadini possono spostare le forniture nel loro campo di origine e proprietà prima di un shift.\n\nI giocatori stranieri non possono utilizzare questi siti per evacuare le forniture locali.
help-story-foreign=Le risorse straniere premiano le spedizioni, ma anche i pianeti pubblici stranieri cambiano.\n\nCostruisci presto un silo missilistico [img=item/rocket-silo], lancia minerali e prodotti su una piattaforma orbitale e portali a casa.
help-story-foreign-detail=Tratta le basi straniere come avamposti temporanei.\n\nNon puoi utilizzare un accampamento o una proprietà straniera per evacuare le scorte.\n\nQuando suona l'avviso di evacuazione, sposta le scorte attraverso razzi e piattaforme orbitali.\n\nTu rinascere nel tuo campo di origine dopo la morte.\n\nIl tuo cadavere e gli oggetti trasportati rimangono indietro.
help-story-diplomacy=Le superfici ordinarie sono visibili in tutti e cinque i paesi per impostazione predefinita; gli amministratori possono nasconderli separatamente alle fazioni nazionali o straniere.\n\nI paesi amici condividono i dati delle carte esplorate e osservano un cessate il fuoco.\n\nI paesi ostili non condividono i dati delle carte e le loro difese potrebbero sparare contro giocatori stranieri.
help-story-diplomacy-detail=Gli edifici rimangono di proprietà separata.\n\nLe relazioni amichevoli non ne garantiscono automaticamente il controllo agli alleati.\n\nIndipendentemente dalla diplomazia, non è possibile decostruire gli edifici di un altro paese con un pianificatore.\n\nDopo un paese normale ricerca il propulsore della piattaforma spaziale [img=technology/space-platform-thruster], la sua diplomazia può cambiare durante uno spostamento planetario.\n\nL'Accademia Tecnocratica Aquilo [img=space-location/aquilo] rimane permanentemente neutrale.\n\nResta amichevole con ogni paese.
help-story-faction-switch=Raggiungi il mondo pubblico di una fazione straniera prima di disertarvi.\n\nLa tua vecchia proprietà è stata confiscata, ma le navi restano tue.
help-story-faction-switch-detail=Per unirsi a Vulcanus, Gleba, Fulgora o Aquilo, il tuo personaggio deve trovarsi nel mondo pubblico di quella fazione.\n\nLa defezione costa energia e monete ma non uccide il personaggio.\n\nUnirsi a Nauvis uccide comunque il tuo personaggio sul posto e lo rigenera. al campo profughi di Nauvis.\n\nQualsiasi defezione lascia la vecchia proprietà senza proprietario e distrugge i forzieri personali collegati.\n\nLe navi rimangono tue; gli edifici ordinari rimangono di proprietà della vecchia fazione.
help-detail-linked-chest=Manually placing a wooden chest on an allowed public planet, camp, or property establishes a personal linked chest.\n\nPersonal linked chests cannot be opened by hand and require inserters.\n\nThe current limit is __1__ per player.\n\nPlacing another at the limit recovers the oldest one as a wooden chest.\n\nA property's four built-in linked chests do not count toward this limit and share the owner's personal linked inventory.
help-detail-science=While you are online, your personal linked chest converts science packs about once every __1__ minutes.\n\nConversion continues for the first __3__ hours offline, checked about once every __2__ minutes.\n\nEach pack adds one point of matching personal experience.\n\nEvery type and quality is accepted.
help-detail-logistics-limits=[img=entity/roboport] A single logistics network may contain at most __1__ roboports.\n\n[img=entity/logistic-robot] A single logistics network may contain at most __2__ logistic robots.\n\nIf placing a roboport exceeds either limit, the newly placed roboport is removed and your faction is notified.
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory.\n\nEvery type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nWhile standing inside their own temporary property, the owner may renew, upgrade, or salvage it.\n\nRenewal restores its full original lifetime and charges for the missing life and current area.\n\nAn upgrade raises the property by one construction level and applies that level's size, total lifetime, and price-decay period.\n\nSalvage immediately evacuates everyone, destroys all contents, and deletes the surface.\n\nPermanent public property cannot be renewed, upgraded, or salvaged.\n\nA property name can only be chosen during construction. Leaving it blank uses a default made from the planet, owner, and property number.
help-detail-property-build=Choose a construction level from 0 to your current total level.\n\nHigher levels usually cost more experience and, depending on the type, change dimensions, lifetime, price decay, or opening price.\n\nDifferent science packs produce different property types.\n\nSome property types also modify burglary success; the Crime page shows the resulting chance.\n\nThe Build page shows the actual cost and every resulting attribute.\n\nOnce built, those attributes no longer change with your level.
help-detail-property-build-formula=Let L be the selected construction level.\n\nMatching science-pack experience spent = (__1__+__2__×L)×__6__, plus __3__ stamina.\n\nOpening price = matching science-pack experience spent × that science pack's base market price, up to __5__ coins.\n\nEach planet retains at most __4__ properties.
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T))));\n\nthe current price factor is a=__2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe current base tax rate is __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nRaising the price of your own property is a normal transaction and updates P and D; its tax rate is multiplied by __3__.\n\nExperience refund = floor(build experience × __2__% × remaining life/original life × current area/original area).\n\nRenewal stamina = 1000 + ceil(build stamina × missing life/original life × current area/original area).
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases.\n\nTemperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%.\n\nMinimum brightness is 0–0.2.\n\nThe current technology price multiplier is __8__.\n\nSpoil-time and asteroid-spawning multipliers are __9__ and __10__.
help-detail-tech-leak=Each faction receives a separate technology-leak check every __1__ hour(s).\n\nTechnologies on the immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak.\n\nInfinite research loses only one level when hit.
help-detail-reset-schedule=The next shift is scheduled randomly between __1__ and __2__ hours away.\n\nEach new world changes resources, terrain, enemies, climate, and daylight.\n\nIt also rolls 0–5 planetary traits.\n\nSpecial rules such as a peaceful ecosystem, eternal daylight on Fulgora, or dormant demolisher territories appear as traits too.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses.\n\nNormal technology is revoked.\n\nInfinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round.\n\nA faction-specific multiplier is then applied.\n\n[img=space-location/aquilo] currently uses ×__3__.\n\nEvery other faction uses ×1.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=Purchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence when clicked.\n\nRemote view does not change the character's physical location.\n\nCrime is disabled in space and excludes the criminal's own property and property open to the public.\n\nA failed defection charge does not change faction; a failed Nauvis-switch death refunds its costs.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet.\n\nLowering it never deletes existing property;\n\nit only blocks construction, preventing an administrative setting from erasing player assets.\n\nThe Administration page controls personal linked-chest count and allowed surfaces;\n\nbuilt-in property chests are excluded.\n\nLowering the count recovers the oldest excess chests.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass.\n\nThe player record, inventory, personal blueprints, account and owned assets are removed;\n\nonly science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]Starting resources for new players[/font]
help-admin-starter-resources=Replace the starting-resource list with one /sc command:\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\nThe change takes effect immediately and only affects players created afterward.\n\nIt does not grant or remove items retroactively.\n\nEach entry uses an item prototype name and count.\n\nUnknown items and non-positive counts are skipped;\n\noverflow is dropped at the character's feet.\n\nSet it to {} to stop granting the listed resources.\n\nNew players still receive the same starter equipment offered on the Personal page.\n\nRestore the config.lua defaults with:\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe salvage rate immediately affects player-built property not yet salvaged.\n\nEach property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nDiplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>.\n\nIt reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies.\n\nReplace the whole list with one /sc command;\n\nthe next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default.\n\nWhen enabled, it bypasses visitor permissions for local property only;\n\nadministrators must still stand in their home United Nations Refugee Camp.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
