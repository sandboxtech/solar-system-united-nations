faction-aquilo-neutral=[img=space-location/aquilo] L'Accademia Tecnocratica Aquilo è permanentemente neutrale.\n\nRimane sempre amichevole con tutti gli altri paesi e non partecipa ai turni diplomatici.
faction-switch=Disertare e unirsi
faction-switch-confirm=[img=utility/confirm_slot] Conferma la defezione a __1__ — __2__ resistenza + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Diserta gratuitamente verso __1__
faction-switch-tooltip=Your character must reach the public world of __1__ before defecting.\n\nCosts __2__ stamina and [img=item/coin] __3__.\n\nYour character remains in place after changing faction; another defection requires a __4__-hour wait.\n\nYour old faction confiscates your properties and destroys personal linked chests; ships remain yours.
faction-switch-tooltip-free=Suicidati e unisciti a __1__.\n\nNon costa resistenza né monete.\n\nIl tuo personaggio muore sul posto, lasciando dietro di sé il cadavere e gli oggetti, quindi rinasce al campo profughi di Nauvis dopo __2__ secondi.\n\nLa tua vecchia fazione confisca le tue proprietà e distrugge i forzieri personali collegati; le navi rimangono tue.
faction-already-current=Appartieni già a questa fazione.
faction-online-required=Devi avere __1__ ore online totali prima di unirti a un'altra fazione.\n\nRimane __2__.
faction-target-location-required=Il tuo personaggio deve raggiungere il mondo pubblico di __1__ prima di unirsi a quella fazione.
faction-switch-cooldown=Devi attendere __1__ prima di disertare nuovamente.
faction-switch-broadcast=__2__ [img=entity/character] __1__ si è unito alla fazione.
player-joined-foreign=__2__ [img=entity/character] __1__ è arrivato online.
player-killed-broadcast=__2__ [img=entity/character] __1__ ucciso __4__ [img=entity/character] __3__.
