scenario-name=Nazioni Unite del Sole
description=\n[font=default-large-bold]Nazioni Unite del Sole[/font]\n\nCinque fazioni sviluppano pianeti pubblici che periodicamente passano a un nuovo mondo.\n\nProduci pacchetti scientifici, trasformali in esperienza personale e costruisci proprietà temporanee per portare avanti la tua industria.\n\n[img=virtual-signal/signal-map-marker] Raggiungi il tuo pianeta natale  →  [img=item/linked-chest] Trasforma la scienza in esperienza con gli inseritori  →  [img=item/construction-robot] Costruisci o acquista la tua prima proprietà\n\nNon è necessario leggere tutte le regole prima di iniziare.\n\nCostruisci una fabbrica normale, controlla il conto alla rovescia e conserva l’essenziale nel campo o nella proprietà.\n\nProgetto: https://github.com/sandboxtech/solar-system-united-nations\nGruppo QQ: 293280221

