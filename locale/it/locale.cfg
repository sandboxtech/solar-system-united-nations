coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=Il tuo baule personale collegato è attivo (__1__/__2__). Non può essere aperto manualmente; utilizzare gli inseritori.
dropoff-refund-spilled=Il tuo baule collegato restituito è stato lasciato cadere a terra perché il tuo inventario era pieno.
dropoff-replaced=Il tuo baule personale collegato più vecchio è stato rimosso e restituito come baule collegato.
dropoff-space-forbidden=I bauli personali collegati non possono essere posizionati sulle piattaforme spaziali. L'articolo è stato restituito.
dropoff-placement-forbidden=I bauli personali collegati non possono essere posizionati qui. L'articolo è stato restituito.
dropoff-limit-disabled=Il limite personale dei forzieri collegati è attualmente 0. L'oggetto è stato restituito.
science-converted-notification=Scienza convertita: __1__ esperienza
roboport-limit-ports=[img=entity/roboport] Costruzione rifiutata: la rete logistica connessa conterrebbe robotport __1__, superiori al limite di __2__. Il robotport appena posizionato è stato rimosso.
roboport-limit-robots=[img=entity/logistic-robot] Costruzione rifiutata: la rete logistica connessa contiene robot logistici __1__, oltre il limite di __2__. Il robotport appena posizionato è stato rimosso.
roboport-limit-both=[img=entity/roboport] Costruzione rifiutata: la rete logistica connessa conterrebbe robotport __1__ (limite __2__) e robot logistici __3__ (limite __4__). Il robotport appena posizionato è stato rimosso.
