property-page-tooltip=Different science packs produce properties with different size, lifetime, terrain, or security. The construction type and total level are permanently recorded in the list. Every property has exactly four central linked chests.\n\nBuy and Enter are separate actions. An owner buying their own property is still a sale: they lose the tax and refresh P and D.\n\nWhen the character is physically inside their own player-built property, use “Salvage current property” at the top. Confirmation destroys every item inside.\n\nA property name is fixed during construction and cannot be changed afterward.
