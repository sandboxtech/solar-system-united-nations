faction-page-tooltip=Countries have only two relations: friendly and hostile.\n\nFriendly countries share vision, may use one another's buildings, and are not automatically targeted by turrets.\n\nHostile countries stop sharing new vision, and their turrets may attack.\n\nAfter a country researches [img=technology/space-platform-thruster] Space platform thruster, each completed reset of its public planet rolls for a diplomatic change.\n\nWhile friendly, it has a __3__% chance to become hostile.\n\nWhile hostile, it has a __4__% chance to become friendly.\n\nOtherwise the relation stays unchanged.\n\nSwitching factions kills the character in place. Joining the [planet=nauvis] faction is free; joining another faction costs __1__ stamina.\n\nOld-faction properties become unowned.\n\nThe old-faction ship is destroyed.\n\nThis respawn always takes __2__ seconds, and none of these losses are compensated.
