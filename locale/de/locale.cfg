faction-aquilo-neutral=[img=space-location/aquilo] Die Technokratische Akademie von Aquilo ist dauerhaft neutral.\n\nSie bleibt mit allen anderen Staaten befreundet und nimmt nicht an diplomatischen Wechseln teil.
faction-switch=Überlaufen und beitreten
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Kostenlos zu __1__ überlaufen
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Begehen Sie Selbstmord und schließen Sie sich __1__.\n\nKosten Sie weder Ausdauer noch Münzen an.\n\nDein Charakter stirbt an Ort und Stelle, lässt seine Leiche und Gegenstände zurück und taucht danach im Nauvis-Flüchtlingslager wieder auf __2__ Sekunden.\n\nIhre alte Fraktion beschlagnahmt Ihr Eigentum und zerstört persönliche verknüpfte Truhen; Schiffe bleiben deins.
faction-already-current=Du gehörst bereits zu dieser Fraktion.
faction-online-required=Sie müssen insgesamt __1__ Online-Stunden haben, bevor Sie einer anderen Fraktion beitreten können.\n\nÜber __2__ bleibt bestehen.
faction-target-location-required=Ihr Charakter muss die öffentliche Welt von __1__ erreichen, bevor er dieser Fraktion beitreten kann.
faction-switch-cooldown=Sie müssen warten, __1__, bevor Sie erneut überlaufen.
faction-switch-broadcast=__2__ [img=entity/character] __1__ ist der Fraktion beigetreten.
player-joined-foreign=__2__ [img=entity/character] __1__ ist jetzt online.
player-killed-broadcast=__2__ [img=entity/character] __1__ hat __4__ [img=entity/character] __3__ getötet.
