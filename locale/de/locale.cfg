help-shift-card-travel=[img=utility/time_editor_icon] [font=default-bold]Öffentliche Planeten und Planetenwechsel[/font]
help-shift-travel-summary=Nutze den Lagereingang, um deinen öffentlichen Heimatplaneten zu erreichen.\n\nNach Ablauf des Countdowns wechselt der Planet zu einer neu erzeugten Welt.
help-shift-travel-detail=Die fünf öffentlichen Planeten haben getrennte Countdowns.\n\nPortale verbinden das Flüchtlingslager, den öffentlichen Planeten und den Keller jedes Landes.\n\nBei einem Planetenwechsel werden Bürger in ihr Lager evakuiert.\n\nFremde Spielfiguren werden __1__ und __2__ Minuten vorher gewarnt und getötet;\n\nein Wert von 0 deaktiviert die jeweilige Räumung.\n\nDie neue Welt erhält neues Gelände, neue Ressourcen und neue Planetenmerkmale.
help-shift-card-logistics=[img=item/linked-chest] [font=default-bold]Verbundene Logistik[/font]
help-shift-logistics-summary=Nationale Verbundtruhen transportieren Vorräte zwischen deinem öffentlichen Planeten und dem Flüchtlingslager.\n\nWenn du eine Holzkiste von Hand herstellst, erhältst du eine persönliche Verbundtruhe.
help-shift-logistics-detail=Wenn ein Spieler eine [img=item/wooden-chest] Holztruhe von Hand herstellt, wird das Ergebnis zu einer persönlichen [img=item/linked-chest] verknüpften Truhe kann von Hand platziert werden und kann nicht auf einer Weltraumplattform verwendet werden.\n\nIt kann nicht direkt geöffnet werden; Verwenden Sie Inserter.\n\nJeder Spieler kann derzeit __1__;\n\nMining oder Ersatz platzieren, um die verknüpfte Truhe selbst zurückzugeben.\n\nAdministratoren kontrollieren die zulässigen Normalwerte Oberflächen.\n\nNationale Logistiktruhen sind nicht personenbezogen. Passende Truhen an jedem Zielort teilen sich ein Inventar.
help-shift-card-advice=[img=virtual-signal/signal-info] [font=default-bold]Was zuerst zu tun ist[/font]
help-shift-advice-summary=Beginnen Sie mit dem Bauen wie in einem normalen Spiel.\n\nBeobachten Sie den Countdown oben links und schicken Sie die Vorräte, die Ihnen am meisten am Herzen liegen, zurück zum Lager.
help-shift-advice-detail=Jede Schicht bringt eine andere Karte mit sich.\n\nAuch Ressourcen und Umgebungsbedingungen können sich ändern.\n\nVerlassen Sie wichtige Transporte nicht bis zur letzten Minute.
help-factory-card-experience=[img=item/automation-science-pack] [font=default-bold]Wissenschaft und Erfahrung[/font]
help-factory-experience-summary=Persönlich verknüpfte Truhen verwandeln Wissenschaftspakete in Erfahrung.\n\nErfahrung in jeder Wissenschaftskategorie trägt zum Gesamtniveau bei.
help-factory-card-building=[img=item/construction-robot] [font=default-bold]Bauen Sie einen Fabrikinnenraum[/font]
help-factory-building-summary=Wählen Sie auf der Build-Seite ein Wissenschaftspaket und eine Baustufe aus.\n\nJedes Paket erstellt ein anderes Layout, eine andere Lebensdauer und eine andere Funktion.
help-factory-card-logistics=[img=item/linked-chest] [font=default-bold]Innenlogistik[/font]
help-factory-logistics-summary=Eingangstruhen stellen eine Verbindung zum persönlichen, verknüpften Inventar ihres Besitzers her.
help-factory-card-robots=[img=entity/roboport] [font=default-bold]Roboternetzwerke[/font]
help-factory-robots-summary=Fabrikinnenräume können Roboternetzwerke enthalten.\n\nJedes Logistiknetzwerk hat eine Größenbeschränkung.
help-market-card-manual=[img=item/coin] [font=default-bold]Lokaler Markt[/font]
help-market-manual-summary=Während Sie sich in Ihrem Heimatgebiet aufhalten, können Sie Waren direkt aus Ihrem Hauptinventar handeln.\n\nJedes Land verfügt über unabhängige Lagerbestände, Fonds und Preise.
help-market-card-automatic=[img=item/logistic-science-pack] [font=default-bold]Market Workshop[/font]
help-market-automatic-summary=Eine Marktwerkstatt vergleicht ihre eiserne Zieltruhe mit ihrer stählernen Lagertruhe.\n\nWährend der Besitzer online ist, handelt sie in Richtung der Zielmengen.
help-market-card-prices=[img=virtual-signal/signal-anything] [font=default-bold]Wie sich die Preise bewegen[/font]
help-market-prices-summary=Durch den Verkauf wird Lagerbestand hinzugefügt und die Preise gesenkt.\n\nDurch den Kauf wird Lagerbestand entfernt und die Preise steigen.
help-market-prices-detail=Jeder nationale Markt berechnet die Preise separat.\n\nDer Verkauf eines Artikels erhöht den Lagerbestand und senkt den Preis dieses Artikels kehrt beide Effekte um.
help-property-card-ownership=[img=item/stone-brick] [font=default-bold]Lokale Eigenschaft[/font]
help-property-ownership-summary=Sie dürfen Eigentum nur in Ihrem eigenen Land kaufen und verwalten.\n\nIhr Charakter muss sich im Heimatlager befinden, bevor er Eigentum betritt.
help-property-ownership-detail=Auf der Seite „Eigenschaften“ werden Immobilien in allen fünf Ländern angezeigt nur;\n\nBesucher müssen weiterhin von ihrem Heimatlager aus einreisen.
help-property-card-trading=[img=item/coin] [font=default-bold]Käufe und Aufschläge[/font]
help-property-trading-summary=Nach einem Kauf erhält der Vorbesitzer den Erlös nach Steuern und der nächste Angebotspreis erhöht sich.\n\nEigentümer können ihre eigene Immobilie auch mit einem Preisaufschlag versehen.
help-property-card-lifecycle=[img=utility/time_editor_icon] [font=default-bold]Lebensdauer und Wartung[/font]
help-property-lifecycle-summary=Von Spielern gebaute Innenräume haben ihre eigene Lebensdauer.\n\nEin darin stehender Besitzer kann einen Innenraum erneuern, erweitern oder retten.
help-property-card-access=[img=entity/character] [font=default-bold]Eintritt und öffentlicher Zugriff[/font]
help-property-access-summary=Eigentum kann auf seinen Eigentümer und gemeinsame Freunde beschränkt oder für jeden Bürger zugänglich sein.\n\nAusländische Spieler können normalerweise nicht betreten.
help-property-access-detail=Die Zugangseinstellung des Eigentümers gilt für alle Immobilien, die er besitzt.\n\nDer private Zugang lässt den Eigentümer und gemeinsame Freunde zu;\n\nDer öffentliche Zugang lässt alle Bürger vor Ort zu.\n\nDer normale Eintrag muss noch beginnen aus dem Heimatlager.\n\nEin erfolgreicher Einbruch ist eine Ausnahme.
help-card-story=[img=space-location/solar-system-edge] [font=default-bold]United Nations of Sol[/font]
help-card-factions=[img=entity/character] [font=default-bold]Eine Fraktion auswählen[/font]
help-card-foreign-expedition=[img=item/rocket-silo] [font=default-bold]Expeditionen zu fremden Planeten[/font]
help-card-diplomacy=[img=space-location/solar-system-edge] [font=default-bold]Diplomatische Beziehungen[/font]
help-card-faction-switch=[img=utility/danger_icon] [font=default-bold]Changing countries[/font]
help-story-background=The five planets were once united under the United Nations of Sol and shared one currency.\n\nRecurring catastrophes and diverging interests ultimately fractured that government into five independent factions.\n\nUnited Nations Refugee Camps and the common coin are among the few foundations left by the old order.\n\nToday, countries may open their borders and build together—or close their vision and go to war.
help-story-background-detail=Die fünf Planeten wurden einst von den Vereinten Nationen von Sol regiert.\n\nWiederholte Planetenkatastrophen und zunehmende Interessenkonflikte spalteten schließlich die Union.\n\nFünf neue Länder entstanden.\n\nSie haben immer noch eine gemeinsame Währung und unterhalten Flüchtlingslager der Vereinten Nationen.\n\nHeute können Länder gemeinsam aufbauen, ihre Grenzen schließen oder in den Krieg ziehen.
help-story-factions=Ihre Fraktion bestimmt Ihren Heimatplaneten, den Forschungsfortschritt und den Besitz von Vermögenswerten.\n\nIhr Heimatlager und Ihr Grundstück sind die zuverlässigsten Evakuierungspunkte während einer Planetenverschiebung.
help-story-factions-detail=New players begin in the [img=space-location/nauvis] People's Republic of Nauvis.\n\nEach country has separate research, buildings, property, and space platforms.\n\nYou may normally build, buy, and enter property only in your own country;\n\nforeign property markets are for viewing only.\n\nCitizens may move supplies into their home camp and property before a shift.\n\nForeign players cannot use those sites to evacuate local supplies.
help-story-foreign=Foreign resources reward expeditions, but foreign public planets shift too.\n\nBuild a [img=item/rocket-silo] rocket silo early, launch ores and products to an orbital platform, and carry them home.
help-story-foreign-detail=Behandeln Sie ausländische Stützpunkte als vorübergehende Außenposten.\n\nSie können kein fremdes Lager oder Grundstück zur Evakuierung von Vorräten verwenden.\n\nWenn die Evakuierungswarnung ertönt, bewegen Sie Vorräte durch Raketen und in die Umlaufbahn Plattformen.\n\nDu respawnst nach dem Tod in deinem Heimatlager.\n\nDeine Leiche und getragene Gegenstände bleiben zurück.
help-story-diplomacy=Gewöhnliche Oberflächen sind standardmäßig für alle fünf Länder sichtbar; Administratoren können sie separat vor den inländischen oder ausländischen Fraktionen verbergen.\n\nFreundliche Länder teilen erkundete Kartendaten und halten einen Waffenstillstand ein.\n\nFeindliche Länder teilen keine Kartendaten und ihre Verteidigung kann auf ausländische Spieler schießen.
help-story-diplomacy-detail=Buildings remain separately owned;\n\nfriendly relations do not automatically grant allies control of them.\n\nRegardless of diplomacy, you cannot deconstruct another country's buildings with a planner.\n\nAfter an ordinary country researches [img=technology/space-platform-thruster] Space platform thruster, its diplomacy may change during a planetary shift.\n\nThe [img=space-location/aquilo] Aquilo Technocratic Academy remains permanently neutral and friendly with every country.
help-story-faction-switch=Switching factions forfeits your old property, ship, and personal linked chests.\n\nLeave your affairs in order.
help-story-faction-switch-detail=Switching factions kills your character in place.\n\nIts corpse and carried items remain behind.\n\nProperty in your old faction becomes unowned.\n\nYour ship and personal linked chests are destroyed.\n\nOrdinary buildings remain owned by the old faction.
help-detail-linked-chest=Platziere eine Holzkiste von Hand auf einer erlaubten öffentlichen Welt, in einem Lager oder einer Immobilie, um eine persönliche verbundene Kiste zu erstellen.\n\nSie kann nicht von Hand geöffnet werden und benötigt Greifarme.\n\nDas aktuelle Limit beträgt __1__ pro Spieler.\n\nBei Erreichen des Limits wird die älteste als Holzkiste zurückgegeben.\n\nDie vier eingebauten Kisten einer Immobilie zählen nicht zum Limit.
help-detail-science=While you are online, your personal linked chest converts science packs about once every __1__ minutes.\n\nConversion continues for the first __3__ hours offline, checked about once every __2__ minutes.\n\nEach pack adds one point of matching personal experience.\n\nEvery type and quality is accepted.
help-detail-logistics-limits=[img=entity/roboport] A single logistics network may contain at most __1__ roboports.\n\n[img=entity/logistic-robot] A single logistics network may contain at most __2__ logistic robots.\n\nIf placing a roboport exceeds either limit, the newly placed roboport is removed and your faction is notified.
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory.\n\nEvery type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nWhile standing inside their own temporary property, the owner may renew, upgrade, or salvage it.\n\nRenewal restores its full original lifetime and charges for the missing life and current area.\n\nAn upgrade raises the property by one construction level and applies that level's size, total lifetime, and price-decay period.\n\nSalvage immediately evacuates everyone, destroys all contents, and deletes the surface.\n\nPermanent public property cannot be renewed, upgraded, or salvaged.\n\nA property name can only be chosen during construction. Leaving it blank uses the owner name and property number.
help-detail-property-build=Choose a construction level from 0 to your current total level.\n\nHigher levels usually cost more experience and, depending on the type, change dimensions, lifetime, price decay, or opening price.\n\nDifferent science packs produce different property types.\n\nSome property types also modify burglary success; the Crime page shows the resulting chance.\n\nThe Build page shows the actual cost and every resulting attribute.\n\nOnce built, those attributes no longer change with your level.
help-detail-property-build-formula=Let L be the selected construction level.\n\nMatching science-pack experience spent = (__1__+__2__×L)×__6__, plus __3__ stamina.\n\nOpening price = matching science-pack experience spent × that science pack's base market price, up to __5__ coins.\n\nEach planet retains at most __4__ properties.
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T))));\n\nthe current price factor is a=__2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe current base tax rate is __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nRaising the price of your own property is a normal transaction and updates P and D; its tax rate is multiplied by __3__.\n\nExperience refund = floor(build experience × __2__% × remaining life/original life × current area/original area).\n\nRenewal stamina = 1000 + ceil(build stamina × missing life/original life × current area/original area).
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases.\n\nTemperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%.\n\nMinimum brightness is 0–0.2.\n\nThe current technology price multiplier is __8__.\n\nSpoil-time and asteroid-spawning multipliers are __9__ and __10__.
help-detail-tech-leak=Each faction receives a separate technology-leak check every __1__ hour(s).\n\nTechnologies on the immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak.\n\nInfinite research loses only one level when hit.
help-detail-reset-schedule=The next shift is scheduled randomly between __1__ and __2__ hours away.\n\nEach new world changes resources, terrain, enemies, climate, and daylight.\n\nIt also rolls 0–5 planetary traits.\n\nSpecial rules such as a peaceful ecosystem, eternal daylight on Fulgora, or dormant demolisher territories appear as traits too.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses.\n\nNormal technology is revoked;\n\ninfinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round.\n\nDanach gilt der fraktionsspezifische Multiplikator.\n\n[img=space-location/aquilo] verwendet derzeit ×__3__, alle anderen Fraktionen ×1.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks.\n\nAn asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space.\n\nIts target faction comes from the character's current public planet, United Nations Refugee Camp, or property.\n\nProperties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record.\n\nA failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet.\n\nLowering it never deletes existing property;\n\nit only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest;\n\ncentral property chests are excluded.\n\nProperty and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass.\n\nThe player record, inventory, personal blueprints, account and owned assets are removed;\n\nonly science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]Starting resources for new players[/font]
help-admin-starter-resources=Replace the starting-resource list with one /sc command:\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\nThe change takes effect immediately and only affects players created afterward.\n\nIt does not grant or remove items retroactively.\n\nEach entry uses an item prototype name and count.\n\nUnknown items and non-positive counts are skipped;\n\noverflow is dropped at the character's feet.\n\nSet it to {} to stop granting the listed resources.\n\nNew players still receive the same starter equipment offered on the Personal page.\n\nRestore the config.lua defaults with:\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe salvage rate immediately affects player-built property not yet salvaged.\n\nEach property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nDiplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>.\n\nIt reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies.\n\nReplace the whole list with one /sc command;\n\nthe next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default.\n\nWhen enabled, it bypasses visitor permissions for local property only;\n\nadministrators must still stand in their home United Nations Refugee Camp.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
