scenario-name=Vereinte Nationen von Sol
description=\n[font=default-large-bold]Vereinte Nationen von Sol[/font]\n\nFünf Fraktionen entwickeln öffentliche Planeten, die regelmäßig zu neuen Welten wechseln.\n\nVerwandle Wissenschaftspakete in persönliche Erfahrung, baue befristete Immobilien und führe deine Industrie auf der nächsten Welt fort.\n\n[img=virtual-signal/signal-map-marker] Reisewege und Heimatlager kennenlernen  →  [img=item/linked-chest] Wissenschaftspakete mit Greifarmen zuführen  →  [img=item/construction-robot] erste Immobilie bauen oder kaufen\n\nBringe wichtige Maschinen und Vorräte vor jedem Wechsel an einen sicheren Ort.\n\nDie vollständigen Regeln stehen in der Anleitung im Spiel.\n\nProjekt: https://github.com/sandboxtech/solar-system-united-nations\nQQ-Gruppe: 293280221

[un]
admin-only=Nur Administratoren können diesen Befehl ausführen.
close=Schließen
friend-add=Freund hinzufügen
friend-limit=Ihre Freundesliste hat das Limit von __1__ erreicht.
friend-mutual=Sie und __1__ sind jetzt gemeinsame Freunde. Wenn Sie eine Fraktion teilen, können Sie die Eigenschaften des jeweils anderen betreten.
friend-remove=Freund entfernen
friend-remove-offline=Alle Offline-Freunde entfernen
friend-removed-offline=__1__ Offline-Freunde entfernt.
friend-removed=__1__ aus deiner Freundesliste entfernt.
event-error=Eine Veranstaltung der Vereinten Nationen von Sol ist fehlgeschlagen (__1__). Siehe factio-current.log.
credit-label=[img=item/coin] Münzen
credit-insufficient=Sie haben nicht genügend Münzen.
coin-tooltip=Münzen sind die gemeinsame Währung aller fünf Fraktionen.\n\nHole das Grundeinkommen ab, erhalte Überweisungen oder verkaufe und verwerte Immobilien.\n\nImmobilienkäufe, Überweisungsgebühren und Verbrechen ziehen Münzen aus dem Umlauf.
dropoff-created-count=Deine persönliche verbundene Kiste ist aktiv (__1__/__2__). Öffne sie nicht von Hand; benutze Inserter.
dropoff-refund-spilled=Ihre zurückgegebene verknüpfte Truhe ist auf den Boden gefallen, weil Ihr Inventar voll war.
dropoff-replaced=Deine vorherige persönliche verbundene Kiste wurde entfernt und als Holzkiste zurückgegeben.
dropoff-space-forbidden=Persönliche verknüpfte Truhen können nicht auf Weltraumplattformen platziert werden. Der Artikel wurde zurückgegeben.
dropoff-placement-forbidden=Persönliche verknüpfte Truhen können hier nicht platziert werden. Der Artikel wurde zurückgegeben.
dropoff-limit-disabled=Das persönliche Limit für verknüpfte Truhen beträgt derzeit 0. Der Artikel wurde zurückgegeben.
science-converted-notification=Wissenschaft umgewandelt: __1__ Erfahrung
roboport-limit-ports=[img=entity/roboport] Bau abgelehnt: Das verbundene Logistiknetz hätte __1__ Roboterhangars und überschreitet damit das Limit von __2__. Der neu gebaute Roboterhangar wurde entfernt.
roboport-limit-robots=[img=entity/logistic-robot] Bau abgelehnt: Das verbundene Logistiknetz enthält __1__ Logistikroboter und überschreitet damit das Limit von __2__. Der neu gebaute Roboterhangar wurde entfernt.
roboport-limit-both=[img=entity/roboport] Bau abgelehnt: Das verbundene Logistiknetz hätte __1__ Roboterhangars (Limit __2__) und __3__ Logistikroboter (Limit __4__). Der neu gebaute Roboterhangar wurde entfernt.
