scenario-name=Vereinte Nationen von Sol
description=\n[font=default-large-bold]Vereinte Nationen von Sol[/font]\n\nFünf Fraktionen entwickeln öffentliche Planeten, die regelmäßig durch Katastrophen zurückgesetzt werden. Verwandle Wissenschaftspakete in persönliche Erfahrung, baue befristete Immobilien und bringe deine Industrie vor dem nächsten Reset in Sicherheit.\n\n[img=item/wooden-chest] Holzkiste auf dem Heimatplaneten platzieren  →  [img=item/linked-chest] Wissenschaftspakete mit Greifarmen zuführen  →  [img=item/construction-robot] erste Immobilie bauen\n\nDas Heimatlager bietet Schutz; Reisen auf fremde Planeten bleiben riskant. Alle Regeln stehen in der Anleitung im Spiel.\n\nProjekt: https://github.com/sandboxtech/solar-system-united-nations\nQQ-Gruppe: 293280221

