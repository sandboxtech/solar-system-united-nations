help-section-beginner=Beginner guide: linked chests and coins
help-detail-ubi=Each player receives [img=item/coin] __4__ starting coins when their account is first created. UBI is calculated lazily from game time and accumulates [img=item/coin] __1__ per second, both online and offline. It stores at most __2__ hours, or [img=item/coin] __3__, and must be claimed manually on the Personal page.
help-detail-linked-chest=A wooden chest becomes a personal linked chest only when manually placed on [planet=nauvis]. Each player may establish one; placing another recovers the old chest. The four central property chests do not count toward this limit and share the owner's personal linked inventory.
help-detail-science=While the player is online, science packs in the linked inventory are consumed for coins every __1__ minute(s). Normal, uncommon, rare, epic, and legendary quality multipliers are __2__, __3__, __4__, __5__, and __6__. Successfully consumed packs also add matching experience.
help-detail-experience=Each science pack tracks experience E independently. Its level is 0 when E=0; when E>0, L=floor(log10(E))+1—the number of decimal digits in E. Total level is the sum of all pack levels. Experience and levels are unlimited.
help-detail-experience-effects=Let total level be L. Experience currently has three effects: new ship width = __1__ + L×__2__; new ship lifetime = __3__ + L hours; and, when selling property, actual transaction tax rate = the administrator's base rate (currently __4__%)/(L/100+1). Ship attributes are fixed when built and do not change retroactively as levels increase.
help-detail-property-heading=Property guide
help-detail-property-basic=Buying and entering are separate actions in the property list. After a purchase, the four central chests connect to the new owner's personal linked inventory. Owners, administrators, mutual friends, and visitors to public properties may enter. Owners may also buy their own property: the full asking price is recorded, the after-tax proceeds return to them, and their net cost is the tax.
help-detail-growth-heading=Experience guide
help-detail-world-heading=Public planet guide
help-detail-formulas-heading=Exact formulas, thresholds, and server rules
help-detail-property-price=Short-term properties use T=__1__ hours and long-term properties use T=__2__ hours. Let P be the previous actual sale price and D the time when the price returns to P. Current price = min(__3__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __4__. Properties have no protection period and can be purchased again immediately. For otherwise equal properties, the recommended sale price is proportional to T, making long-term property about __5__ times a short-term one.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP. The administrator sets the base tax rate, currently __1__%. For seller total level L, actual transaction tax rate = base rate × 1/(L/100+1). An owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.
help-detail-property-generation=New properties start at [img=item/coin] __1__–__2__. Width and height independently use 32, 64, or 128. Each property permanently belongs to one of the five public planets, copies natural terrain only from that planet, and follows its day-night cycle. Solar power is fixed at 10% and minimum nighttime brightness at __3__. The property page is divided by planet; vacant properties are shown to the player force, while owned-property surfaces are hidden from its surface list.
help-detail-property-supply=The market evaluates supply every __1__ hour(s). Players seen within __2__ hours count as active, and the target property count is max(__3__, active players×__4__). Supply tends to grow below the target, below __8__% vacancy, or above median price __9__; it tends to shrink above the target when vacancy exceeds __10__% and median price is below __11__. After a condition holds for __5__ checks, each check has only a __6__% chance to add or remove one property. Retirement only selects unowned, unoccupied properties with no trade for at least __7__ hours.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__). Water and native natural-terrain controls use 2^U(-__5__,__5__); cliff interval and continuity use 2^U(-__6__,__6__); enemy-base frequency, size, and starting safe area use 2^U(-__7__,__7__). Moisture and aux receive centered ±0.5 biases and temperature a centered ±20 bias. Daylight occupies 20%–80%, minimum nighttime brightness is 0–0.2, and peaceful mode has __8__% probability. Global technology price, spoil time, and asteroid spawning multipliers are __9__, __10__, and __11__, all immediately adjustable by administrators.
help-detail-cooperation-heading=Friends and transfers
help-detail-friends=Each player may add up to __1__ friends. Friend entries are one-way; players may enter each other's properties after both add one another. While owning at least one property, an owner can open all of their properties to every player from the Properties page. Visitors cannot administer property rights.
help-detail-transfer=Coin transfers settle immediately without recipient confirmation. Each transfer must be at least [img=item/coin] __1__. The fee is max([img=item/coin] __3__, ceil(amount×__2__%)); it is deducted from the recipient's proceeds and removed by the system, while the sender pays only the transfer amount.
help-detail-ship-heading=Ships and travel
help-detail-ship=Each player may own one ship, built only on [planet=nauvis], costing [img=item/coin] __1__. New ship life = __2__ + total level hours, width = __3__ + total level×__4__, and map height is __5__. Levels gained later do not change an existing ship.
help-detail-travel=Each public planet has its own United Nations Refugee Camp. The top-level Home button uses only the character's physical surface: from a public planet it goes to the most recently visited still-owned property on that planet, or that planet's camp if there is no home; from a property or camp it returns to the corresponding public planet's origin. Remote view does not affect this decision. Suicide leaves items with the corpse and sends this respawn to the current planet's camp.
help-detail-resets=The five public planets rotate independently on staggered schedules. Warnings are issued 30, 5, and 1 minute in advance, then entry closes and player bodies are evacuated to the United Nations Refugee Camp. A planet reopens only after clearing, reseeding, and rebuilding finish. Technology is preserved; that planet's production, fluid, kill, and build statistics are cleared. A cleared personal linked chest can be placed again.
help-detail-reset-schedule=Public-planet cycles: [planet=nauvis] __1__h, [planet=vulcanus] __2__h, [planet=gleba] __3__h, [planet=fulgora] __4__h, and [planet=aquilo] __5__h. Every round randomizes the seed, resources, water and natural terrain, cliffs, enemy bases and starting area, climate, day/night proportions, minimum brightness, and a rare peaceful mode. [planet=nauvis] evolution is random(0,1)^2; each planet's native terrain and resources vary through their original generation controls. At most one non-admin player continuously offline for __6__ hours is removed per hourly check together with their long-term data.
