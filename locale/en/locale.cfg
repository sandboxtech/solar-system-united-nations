help-step-linked-chest=1. Manually place a wooden chest on [planet=nauvis]. It becomes your one personal linked chest.
help-step-science=2. Put science packs into it. While you are online, they are exchanged for credit every minute and add matching experience.
help-step-property=3. Spend credit on properties. The central chests in your properties share your personal linked inventory.
help-ubi=Remember to claim your accumulated UBI manually on the Personal page.
help-detail-economy-heading=Credit, linked chests, and experience
help-detail-ubi=UBI is calculated lazily from game time and accumulates __1__ credit per second, both online and offline. It stores at most __2__ hours, or __3__ credit, and must be claimed manually on the Personal page.
help-detail-linked-chest=A wooden chest becomes a personal linked chest only when manually placed on [planet=nauvis]. Each player may establish one; placing another recovers the old chest. The four central property chests do not count toward this limit and share the owner's personal linked inventory.
help-detail-science=While the player is online, science packs in the linked inventory are consumed for credit every __1__ minute(s). Normal, uncommon, rare, epic, and legendary quality multipliers are __2__, __3__, __4__, __5__, and __6__. Successfully consumed packs also add matching experience.
help-detail-experience=Each science pack tracks experience E independently. Its level is 0 when E=0; when E>0, L=floor(log10(E))+1—the number of decimal digits in E. Total level is the sum of all pack levels. Experience and levels are unlimited.
help-detail-property-heading=Properties, prices, and dynamic supply
help-detail-formulas-heading=Formulas, thresholds, and commands
help-detail-property-price=Let P be the previous actual sale price, D the time when the price returns to P, and T=__1__ hours. Current price = min(__2__, max(1, ceil(P × 10^((D−now)/T)))). Properties have no protection period and can be purchased again immediately.
help-detail-property-trade=After a sale, P becomes that sale price and D=now+__2__ hours, so the immediate asking price is about 10P. The buyer pays the full price and the seller receives it after __1__% tax. Each renewal costs ceil(current market price×__1__%), with a minimum of 1, and adds __2__ hours to D; D cannot exceed now+__3__ hours.
help-detail-property-generation=New properties start at __1__–__2__ credit. Width and height independently use 32, 64, or 128. Terrain is copied from a distant natural sample on [planet=nauvis] or [planet=gleba]. Every property follows [planet=nauvis]'s day-night cycle and has fixed 10% solar power.
help-detail-property-supply=The market evaluates supply every __1__ hour(s). Players seen within __2__ hours count as active, and the target property count is max(__3__, active players×__4__). Supply tends to grow below the target, below __8__% vacancy, or above median price __9__; it tends to shrink above the target when vacancy exceeds __10__% and median price is below __11__. After a condition holds for __5__ checks, each check has only a __6__% chance to add or remove one property. Retirement only selects unowned, unoccupied properties with no trade for at least __7__ hours.
help-detail-cooperation-heading=Friends and transfers
help-detail-friends=Each player may add up to __1__ friends. Friend entries are one-way; players may enter each other's properties after both add one another. While owning at least one property, an owner can open all of their properties to every player from the Properties page. Visitors cannot renew or administer property rights.
help-detail-transfer=Credit transfers settle immediately, need no recipient confirmation, and have no gameplay limit. The server still validates the recipient, positive integer amount, and sender balance, and records both sides in the ledger.
help-detail-ship-heading=Ships and travel
help-detail-ship=Each player may own one ship, built only on [planet=nauvis], costing __1__ credit and lasting __2__ hours. New ship width = __3__ + total level×__4__, and map height is __5__. Levels gained later do not automatically widen an existing ship.
help-detail-travel=Travel is available among public planets, the United Nations Shelter, and properties. Travel to [planet=nauvis] prefers the personal linked chest. If the last property is unavailable or no longer owned, travel falls back to the Shelter. Other surface types cannot initiate this travel.
help-detail-resets=The five public planets rotate independently on staggered schedules. Warnings are issued 30, 5, and 1 minute in advance, then entry closes and player bodies are evacuated to the Shelter. A planet reopens only after clearing, reseeding, and rebuilding finish. Technology is preserved; that planet's production, fluid, kill, and build statistics are cleared. A cleared personal linked chest can be placed again.
help-detail-reset-schedule=Public-planet cycles: [planet=nauvis] __1__h, [planet=vulcanus] __2__h, [planet=gleba] __3__h, [planet=fulgora] __4__h, and [planet=aquilo] __5__h. Each round randomizes the map seed, solar multiplier, and day length; [planet=nauvis] also gets a random enemy evolution factor. At most one non-admin player continuously offline for __6__ hours is removed per hourly check, including their property ownership, personal chest, ship, friend references, credit, experience, and ledger entries.
help-detail-commands-heading=Console commands
help-detail-command-friend=/un-friend add <player>, remove <player>, list: add, remove, or list friends.
help-detail-command-transfer=/un-transfer <player> <positive integer>: transfer credit directly.
help-detail-command-rename=/un-property rename <name>: rename a property while its owner is physically inside it.
help-detail-command-admin=Administrators: /un-property list, create [price] [length] [width], delete <id>, delete-confirm <id>, repair; /un-stage0 status|linked|clear|cleanup runs isolated diagnostics.
