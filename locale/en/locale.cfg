scenario-name=United Nations of Sol
description=\n[font=default-large-bold]United Nations of Sol[/font]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Your objective[/font]\nFive public planets undergo periodic catastrophe resets. Produce science packs for coins and experience, then build or buy temporary property. Before the next reset, move factories, supplies, and prefabricated production lines off the public planet.\n\n[img=item/linked-chest] [font=default-large-bold]1. Establish a personal linked chest[/font]\nManually place an [img=item/wooden-chest] wooden chest on your faction's own public planet. It becomes your personal linked chest. It cannot be opened by hand; use inserters to move items. Each science pack deposited is automatically exchanged for [img=item/coin] 1 coin and one point of matching science-pack experience.\n\n[img=item/construction-robot] [font=default-large-bold]2. Build a safe base[/font]\nProperty survives public-planet resets but has its own lifetime. Every faction builds with [img=item/automation-science-pack] automation science pack experience. Larger and longer-lived property costs more. Every property has four linked chests at its center.\n\n[img=space-location/nauvis] [font=default-large-bold]3. Evacuate before catastrophe[/font]\nA reset removes structures and items left on the public planet but preserves technology. United Nations Refugee Camps and unexpired property are unaffected by that reset. Use the top-left [img=virtual-signal/signal-map-marker] Home button to travel.\n\n[img=item/space-platform-starter-pack] Total level increases the width and lifetime of new ships and lowers property-sale tax. Open the in-game guide for faction, friendship, property trading, transfer, and crime rules.\n\nProject: https://github.com/sandboxtech/solar-system-united-nations\nQQ group: 293280221

