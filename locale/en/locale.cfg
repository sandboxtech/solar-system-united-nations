help-brief-start=Place an [img=item/wooden-chest] wooden chest on [planet=nauvis] to establish your personal linked chest. Every science pack placed inside earns exactly [img=item/coin] 1 and matching experience; claim UBI on the Personal page.
help-brief-property=On Build, choose a planet, lifetime, and size, spending both the matching science-pack experience and the same number of [img=item/coin] coins. Properties can be traded or opened to friends; player properties expire automatically.
help-brief-travel=The [virtual-signal=signal-map-marker] button at the top left travels among the character's current planet, your home there, and its United Nations Refugee Camp.
help-section-beginner=[img=item/coin] Coins, UBI, and linked chests
help-detail-ubi=Each player receives [img=item/coin] __4__ starting coins when their account is first created. UBI is calculated lazily from game time and accumulates [img=item/coin] __1__ per second, both online and offline. It stores at most __2__ hours, or [img=item/coin] __3__, and must be claimed manually on the Personal page.
help-detail-linked-chest=A wooden chest becomes a personal linked chest only when manually placed on [planet=nauvis]. Each player may establish one; placing another recovers the old chest. The four central property chests do not count toward this limit and share the owner's personal linked inventory.
help-detail-science=While the player is online, the linked inventory settles every __1__ minute(s). Every science pack type and quality sells for exactly [img=item/coin] 1 per pack; the number actually consumed is also added as matching science-pack experience.
help-detail-experience=Each science pack tracks experience E independently. Its level is 0 when E=0; when E>0, L=floor(log10(E))+1—the number of decimal digits in E. Total level is the sum of all pack levels. Experience and levels are unlimited.
help-detail-experience-effects=Let total level be L. Experience has four uses: paying property construction costs; new ship width = __1__ + L×__2__; new ship lifetime = __3__ + L hours; and, when selling property, actual transaction tax rate = the administrator's base rate (currently __4__%)/(L/100+1). Building permanently spends the selected science-pack experience and can lower total level; ship attributes are fixed when built.
help-detail-property-heading=[img=item/construction-robot] Property guide
help-detail-property-basic=Buying and entering are separate actions in the property list. After a purchase, the four central chests connect to the new owner's personal linked inventory. Owners, administrators, mutual friends, and visitors to public properties may enter. Owners may also buy their own property: the full asking price is recorded, the after-tax proceeds return to them, and their net cost is the tax.
help-detail-property-build=Lifetime 30/120/480 hours and size 64×32/128×64/256×128 each use cost tiers 1/3/5. Let C be the product of the selected tiers: construction permanently spends __1__×C experience from the planet's science pack and the same number of coins. A successful build starts a __2__-hour per-player cooldown. The builder owns the new property, with initial P=__3__×experience cost, D=now, and T=3/12/48 hours. Each planet also has three permanent small properties (T=3h) and one permanent medium property (T=12h). Trading never extends lifetime.
help-detail-growth-heading=[img=item/space-science-pack] Experience and levels
help-detail-world-heading=[planet=nauvis] Public planets
help-detail-formulas-heading=[virtual-signal=signal-info] Exact formulas, thresholds, and server rules
help-detail-property-price=Each property stores its own price-return period T. Let P be the previous actual sale price and D the time when the price returns to P. Current price = min(__1__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __2__. Properties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP. The administrator sets the base tax rate, currently __1__%. For seller total level L, actual transaction tax rate = base rate × 1/(L/100+1). An owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__). Water and native natural-terrain controls use 2^U(-__5__,__5__); cliff interval and continuity use 2^U(-__6__,__6__); enemy-base frequency, size, and starting safe area use 2^U(-__7__,__7__). Moisture and aux receive centered ±0.5 biases and temperature a centered ±20 bias. Daylight occupies 20%–80%, minimum nighttime brightness is 0–0.2, and peaceful mode has __8__% probability. Global technology price, spoil time, and asteroid spawning multipliers are __9__, __10__, and __11__, all immediately adjustable by administrators.
help-detail-cooperation-heading=[img=entity/character] Friends and transfers
help-detail-friends=Each player may add up to __1__ friends. Friend entries are one-way; players may enter each other's properties after both add one another. While owning at least one property, an owner can open all of their properties to every player from the Properties page. Visitors cannot administer property rights.
help-detail-transfer=Coin transfers settle immediately without recipient confirmation. Each transfer must be at least [img=item/coin] __1__. The fee is max([img=item/coin] __3__, ceil(amount×__2__%)); it is deducted from the recipient's proceeds and removed by the system, while the sender pays only the transfer amount.
help-detail-ship-heading=[img=item/space-platform-starter-pack] Ships and travel
help-detail-ship=Each player may own one ship, built only on [planet=nauvis], costing [img=item/coin] __1__. New ship life = __2__ + total level hours, width = __3__ + total level×__4__, and map height is __5__. Levels gained later do not change an existing ship.
help-detail-travel=Each public planet has its own United Nations Refugee Camp. The top-level Home button uses only the character's physical surface: from a public planet it goes to the most recently visited still-owned property on that planet, or that planet's camp if there is no home; from a property or camp it returns to the corresponding public planet's origin. Remote view does not affect this decision. The five suicide buttons each lock this respawn to the selected planet's camp; the character still dies in place and leaves items with the corpse.
help-detail-resets=The five public planets rotate independently on staggered schedules. Warnings are issued 30, 5, and 1 minute in advance, then entry closes and player bodies are evacuated to the United Nations Refugee Camp. A planet reopens only after clearing, reseeding, and rebuilding finish. Each round also rolls 3 planet traits shown on the Planets page. Technology is preserved; that planet's production, fluid, kill, and build statistics are cleared. A cleared personal linked chest can be placed again.
help-detail-reset-schedule=At the end of each round, every public planet independently rolls its next reset period as 1+4×random(0,1)^2 hours: a 1–5 hour range biased toward shorter periods. Every round randomizes the seed, resources, water and natural terrain, cliffs, enemy bases and starting area, climate, day/night proportions, minimum brightness, and a rare peaceful mode. [planet=nauvis] evolution is random(0,1)^2; each planet's native terrain and resources vary through their original generation controls. At most one non-admin player continuously offline for __1__ hours is removed per hourly check together with their long-term data.
