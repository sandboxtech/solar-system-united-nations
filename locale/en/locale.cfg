[scenario-name]
un=United Nations of Sol

[scenario-description]
un=Develop across five periodically rebuilt public planets, each with three traits per round. Every science pack sells for one coin and one experience; spend planet-specific experience plus equal coins to build limited-life properties, trade them, and build level-scaled ships.

