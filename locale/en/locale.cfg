scenario-name=[color=acid]United Nations of Sol[/color]
description=\n[color=acid][font=default-large-bold]United Nations of Sol[/font][/color]\n\n[img=item/linked-chest] [font=default-large-bold]Sell science packs[/font]\nManually place a [color=yellow]wooden chest[/color] on [planet=nauvis] to establish your personal linked chest. Every science-pack type and quality sells for exactly [img=item/coin] [color=acid]1 coin[/color] per pack while adding matching experience. Offline UBI keeps accumulating for up to 30 hours.\n\n[img=item/construction-robot] [font=default-large-bold]Build and trade property[/font]\nSpend a planet's matching science-pack experience and 10000 stamina to construct limited-life private property. Every successful build starts a 20-hour cooldown. [planet=nauvis] property uses automation science; the other planets use their specialty packs. Property can be traded or opened to mutual friends, and evacuates its occupants before expiring automatically.\n\n[img=space-location/nauvis] [font=default-large-bold]Five rebuilding planets[/font]\nEach public planet rebuilds on its own randomized schedule, changing resources, terrain, climate, and daylight. Every round also receives [color=acid]3 random planet traits[/color] whose multipliers stack on that round's map settings. Rebuilding removes structures and stored items from the planet but preserves server technology.\n\n[img=item/space-platform-starter-pack] [font=default-large-bold]Experience, cooperation, and ships[/font]\nThe decimal digit count of each science-pack experience total is its level contribution. Total level expands new ships, extends their lifetime, and reduces property-selling tax. Players can build a ship in any public planet's orbit from anywhere, form friendships, visit one another's property, and transfer coins directly.\n\n[virtual-signal=signal-info] After entering the scenario, use the top-left menu for the complete gameplay guide.\n\nProject https://github.com/sandboxtech/solar-system-united-nations\nQQ group 293280221

