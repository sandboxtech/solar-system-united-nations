help-card-factions=[img=space-location/solar-system-edge] [font=default-bold]Five hostile factions[/font]
help-story-background=The five planets were once united under the United Nations of Sol.\n\nIt established the common coin system still used today.\n\nRecurring catastrophes and diverging interests ultimately fractured that government into five hostile factions.\n\nUnited Nations Refugee Camps and the common currency are among the few shared foundations left by the old order.\n\nSell science packs and accumulate coins and experience.\n\nBuild temporary properties and ships to leave a mark in worlds that never remain stable.
help-story-factions=Factorio forces separate technology, building ownership, space platforms, and ordinary chat.\n\nCountries have only two relations: friendly and hostile. Friendly countries share vision and may use one another's buildings; hostile countries stop sharing new vision, and their turrets may attack.\n\nAfter a country researches [img=technology/space-platform-thruster] Space platform thruster, each completed reset of its public planet may change diplomacy. While friendly, it has a __2__% chance to become hostile; while hostile, it has a __3__% chance to become friendly.\n\nChanging diplomacy lets players act as builders, traders, and diplomats, but may also bring invasion and sabotage.\n\nCitizens alone have access to their planet's United Nations Refugee Camp and may own local properties.\n\nBefore a planetary catastrophe, they can pack up cheaply and move key assets and prefabricated factories onto surfaces that do not reset with the public planet.\n\nForeign citizens cannot use that local disaster shelter network. Buildings and inventories left on the public planet are still erased.\n\nThe sender's faction sees native chat. Each of the other four factions receives a forwarded version prefixed with the sender's planet icon and faction name.\n\nSwitching kills the character in place. Joining the [planet=nauvis] faction is free; joining another faction costs __1__ stamina.\n\nProperties in the old faction become unowned, its ship is destroyed, and ordinary buildings remain with the old faction.
help-brief-start=[font=default-bold]1. Claim starting funds[/font]\n\nA new account receives [img=item/coin] 10000. Open Personal and claim any accumulated UBI.\n\n[font=default-bold]2. Establish a personal linked chest[/font]\n\nTravel to your faction's own public planet and manually place an [img=item/wooden-chest] wooden chest.\n\nIt becomes a personal linked chest. It cannot be opened by hand and must be served by inserters. Each player may establish one.\n\n[font=default-bold]3. Sell science packs[/font]\n\nUse inserters to place science packs into the linked chest. Every type and quality sells for [img=item/coin] 1 per pack and adds matching experience. Begin with [img=item/automation-science-pack] automation science packs to prepare for your first property.
help-brief-property=[font=default-bold]4. Build your first property[/font]\n\nChoose automation or logistic science on Build. Size, lifetime, and price half-life are generated from your current total level.\n\nConstruction spends __1__+__2__×total level experience of the selected pack, plus __3__ stamina. Width grows with level, rounds down to an even number, and is capped at __4__ tiles. Every property has four central linked chests.\n\nAutomation science builds a cramped, very short-lived shelter. Logistic science builds a cottage of the same size with twice the base lifetime. At expiry, occupants evacuate before the surface is deleted.
help-brief-travel=[font=default-bold]5. Move between the public world and safe bases[/font]\n\nThe top-left [img=virtual-signal/signal-map-marker] Home button moves among the current faction's public planet, owned property, and United Nations Refugee Camp.\n\nPublic planets rebuild periodically, erasing structures and inventories left on them.\n\nThe camp does not reset with its public planet, and private property is unaffected until its own lifetime expires. Move critical supplies and prefabricated factories to these safe surfaces in time.
help-brief-project=[img=virtual-signal/signal-info] QQ group: 293280221\n\n[img=virtual-signal/signal-info] GitHub: https://github.com/sandboxtech/solar-system-united-nations
help-brief-deconstruction=[img=item/deconstruction-planner] Deconstruction planning unlocks after __1__ total online hours and the next surface transfer.
help-section-beginner=[img=item/linked-chest] [font=default-bold]Linked chests and science sales[/font]
help-detail-linked-chest=A player may establish a personal linked chest only by manually placing a wooden chest on their current faction's own public planet. Wooden chests on other public planets, camps, property, and space platforms remain ordinary.\n\nA personal linked chest cannot be opened by hand and must be served by inserters. Each player may establish one; placing another recovers the old chest.\n\nEvery property size has exactly four central linked chests. They do not count toward the personal limit and share the owner's linked inventory.
help-detail-science=While you are online, the system checks your personal linked chest every __1__ minute(s) and automatically sells the science packs inside.\n\nEvery science pack type and quality sells for exactly [img=item/coin] 1 per pack. Each pack sold also adds one point of matching experience.
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]Property guide[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]Experience effect formulas[/font]
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory. Small and large property both have four: small property is cheaper, while large property provides more usable space.\n\nOwners may also buy their own property.\n\nThe full asking price is recorded, after-tax proceeds return to them, and their net cost is the tax.\n\nWhile physically inside their own player-built property, the owner may salvage it from the top of Properties. Confirmation immediately evacuates everyone, destroys all contents, and deletes the surface. Permanent public property cannot be salvaged.\n\nA property name can only be chosen during construction and cannot be changed afterward. Leaving it blank uses a default made from the planet, owner, and property number.
help-detail-property-build=Let L be total level at construction. Both types permanently spend __1__+__2__×L experience of the selected science pack, plus __3__ stamina.\n\nWidth=min(__6__, round down to even(32+L)); height=32.\n\n[img=item/automation-science-pack] Temporary shelter: T=6+0.1L hours; total life=12+L hours.\n\n[img=item/logistic-science-pack] Simple cottage: T=12+0.2L hours; total life=24+L hours.\n\nInitial asking price=experience cost×__4__, capped by the global property price limit. Attributes are fixed at construction and do not change after levelling. Each planet retains at most __5__ properties.
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]Public planets[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]Property price and trade formulas[/font]
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe administrator sets the base tax rate, currently __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nAn owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.\n\nSalvage coins = max(1, floor(initial construction price × __2__% × remaining life/total life)). Transactions never change the salvage basis.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases. Temperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%. Minimum brightness is 0–0.2. Peaceful mode has __8__% probability.\n\nThe current technology price multiplier is __9__.\n\nSpoil-time and asteroid-spawning multipliers are __10__ and __11__.
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]Travel and respawn[/font]
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe Home button travels among the current faction's public planet, properties, and camp.\n\nBefore leaving a public planet for a property or camp, the scenario records the departure coordinates, surface, and current reset round.\n\nReturning from a property or camp first searches near those coordinates if the planet is still in the same round.\n\nIf no nearby landing point exists, the planet has reset, its surface has changed, or no record exists, arrival uses a random safe point in the 256×256 square around the origin. Positions nearer the origin are more likely.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns the player after __2__ seconds.\n\nOtherwise no stamina is spent, and respawn takes __3__ seconds.\n\nOrdinary deaths respawn at the current faction's camp.\n\nSwitching on the Factions page kills the character in place and leaves the corpse and items there.\n\nThat respawn goes to the target faction's camp.\n\nA faction-switch death has no additional respawn charge and always waits __3__ seconds.
help-detail-resets=The five public planets rotate independently on staggered schedules.\n\nA warning is issued 5 minutes in advance; entry then closes, players evacuate, and the planet is rebuilt.\n\nEach round rolls 0–5 mutually compatible weighted traits shown on the Planets page.\n\nResources and other high-impact traits have greater weight; environmental flavor has lower weight.\n\nPlanet resets do not directly alter technology; that planet's statistics are cleared, and a cleared personal linked chest can be placed again.
help-detail-tech-leak=Once a faction has researched [img=technology/space-platform-thruster] Space platform thruster, its technology receives a separate leak check every __1__ hour(s).\n\nA faction that has not reached this milestone cannot lose technology. Losing the thruster technology later does not lock this mechanism again.\n\nTechnologies on the administrator-managed immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak. Infinite research loses only one level when hit.
help-detail-reset-schedule=Each public planet independently rolls its next reset period. With lower bound __1__ hours, upper bound __2__ hours, and exponent a=__3__:\nperiod = lower+(upper−lower)×random(0,1)^a.\n\na>1 biases shorter periods, a=1 is uniform, and 0<a<1 biases longer periods.\n\nEvery round randomizes the seed, resources, terrain, enemies, climate, daylight, and a rare peaceful mode.\n\n[planet=nauvis] and [planet=gleba] independently set evolution to random(0,1)^2; each planet's native terrain and resources also vary through original controls.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses. Normal technology is revoked; infinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round. Setting this limit to 0 prevents all losses.\n\nA faction-specific multiplier is then applied. [planet=aquilo] currently uses ×__3__; every other faction uses ×1.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks. An asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space. Its target faction comes from the character's current public planet, United Nations Refugee Camp, or property. Properties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record. A failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet. Lowering it never deletes existing property; it only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest; central property chests are excluded. Property and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass. The player record, inventory, personal blueprints, account and owned assets are removed; only science experience is retained by player name.\n\nPublic-planet resets close entry and evacuate characters before asynchronous clearing begins.
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, technology-leak, and global multipliers can be adjusted live.\n\nProperty lifetime, T, and initial-price multipliers affect only properties built afterward; the salvage rate immediately affects every player-built property not yet salvaged.\n\nReset-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nTo inspect a fresh planet round, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>. It reuses normal evacuation and clearing and refuses to run while another planet is clearing.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies. Replace the whole list with one /sc command; the next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any property” is disabled by default. It bypasses visitor permissions only when explicitly enabled.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions or existing ship attributes.
