help-card-factions=[space-location=solar-system-edge] Five hostile factions
help-story-background=The five planets were once united under the United Nations of Sol, which established the common coin system still used today. Recurring catastrophes and diverging interests ultimately fractured that government into five competing regimes.\n\nUnited Nations Refugee Camps and the common currency are among the few shared foundations left by the old order. Sell science packs, accumulate coins and experience, and build temporary properties and ships to leave a mark in worlds that never remain stable.
help-story-factions=Factorio forces separate technology, building ownership, space platforms, and ordinary chat.\n\nPlayers in one faction share technology and can normally use its buildings. Other factions are hostile in engine terms and their turrets automatically fire. Friendly fire can also be forced within one faction.\n\nHostility enables conflict but does not mandate war. Players may avoid offensive weapons and act as builders, traders, or diplomats to create practical cooperation—or choose to sabotage and invade.\n\nCitizens alone have access to their planet's United Nations Refugee Camp and may own local properties. Before a planetary catastrophe, they can use travel to pack up cheaply and move key assets and prefabricated factories onto these surfaces, which do not reset with the public planet. Foreign citizens cannot use that local disaster shelter network. Buildings and inventories left on the public planet are still erased.\n\nOrdinary chat remains unchanged inside its faction; other factions receive a forwarded version marked with its source faction.\n\nSwitching costs __1__ stamina and kills the character in place. Properties in the old faction become unowned, its ship is destroyed, and ordinary buildings remain with the old faction.
help-brief-start=Place an [img=item/wooden-chest] wooden chest on [planet=nauvis] to establish your personal linked chest.\n\nEvery science pack placed inside earns exactly [img=item/coin] 1 and matching experience.\n\nClaim UBI on the Personal page.
help-brief-property=On Build, choose a lifetime and size, spending automation science experience and __1__ stamina to build in your current faction.\n\nProperties can be traded or opened to friends; player properties expire automatically.
help-brief-travel=Use the [virtual-signal=signal-map-marker] button at the top left to travel.\n\nIt moves the character among their current planet, your home there, and its United Nations Refugee Camp.
help-brief-project=QQ group: 293280221\n\nGitHub: https://github.com/sandboxtech/solar-system-united-nations
help-section-beginner=[img=item/linked-chest] Linked chests and science sales
help-detail-linked-chest=A wooden chest becomes a personal linked chest only when manually placed on [planet=nauvis].\n\nEach player may establish one; placing another recovers the old chest.\n\nThe four central property chests do not count toward this limit and share the owner's linked inventory.
help-detail-science=While the player is online, the linked inventory settles every __1__ minute(s).\n\nEvery science pack type and quality sells for exactly [img=item/coin] 1 per pack; the amount actually consumed is also added as matching experience.
help-detail-property-heading=[img=item/construction-robot] Property guide
help-detail-growth-heading=[img=item/space-science-pack] Experience effect formulas
help-detail-experience-effects=Let total level be L. Building permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__; new ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1). Ship attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory.\n\nOwners may also buy their own property: the full asking price is recorded, after-tax proceeds return to them, and their net cost is the tax. Entry permissions and renaming are shown under [img=info] on Properties.
help-detail-property-build=The three lifetime tiers are currently __3__/__4__/__5__ hours, with cost tiers 1/3/5. The three sizes, 64×32/128×64/256×128, also use cost tiers 1/3/5.\n\nLet C be the product of the selected tiers: construction permanently spends __1__×C automation science experience and __12__ stamina. A successful build starts a __2__-hour cooldown. Construction is limited to the current faction.\n\nThe builder owns the new property, with initial P=min(__10__, ceil(__9__×experience cost)), D=now, and the three current T values are __6__/__7__/__8__ hours.\n\nEach planet retains at most __11__ properties.\n\nEach planet also has one permanent small, medium, and large property, all with T=3h. Trading never extends lifetime.
help-detail-world-heading=[planet=nauvis] Public planets
help-detail-formulas-heading=[item=stone-brick] Property price and trade formulas
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe administrator sets the base tax rate, currently __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nAn owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__); cliffs use 2^U(-__6__,__6__); enemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases, temperature a centered ±20 bias; daylight occupies 20%–80%, minimum brightness is 0–0.2, and peaceful mode has __8__% probability.\n\nCurrent technology price, spoil-time, and asteroid-spawning multipliers are __9__, __10__, and __11__.
help-detail-ship-heading=[virtual-signal=signal-map-marker] Travel and respawn
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe Home button travels among the current faction's public planet, properties, and camp. Arrival on a public planet uses a random safe point in the 128×128 area around its origin, reducing the value of camping one fixed entrance.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns the player after __2__ seconds. Otherwise no stamina is spent and respawn takes __3__ seconds.\n\nSwitching on the Factions page kills the character in place and leaves the corpse and items there; that respawn goes to the target faction's camp. A faction-switch death has no additional respawn charge and always waits __3__ seconds.
help-detail-resets=The five public planets rotate independently on staggered schedules.\n\nA warning is issued 5 minutes in advance; entry then closes, players evacuate, and the planet is rebuilt.\n\nEach round also rolls 3 planet traits shown on the Planets page.\n\nPlanet resets do not directly alter technology; that planet's statistics are cleared, and a cleared personal linked chest can be placed again.
help-detail-tech-leak=Each faction's technology receives a separate leak check every __1__ hour(s). Trigger technologies and direct prerequisites of current research are protected; infinite research loses only one level when hit.
help-detail-reset-schedule=Each public planet independently rolls its next reset period. With lower bound __1__ hours, upper bound __2__ hours, and exponent a=__3__:\nperiod = lower+(upper−lower)×random(0,1)^a.\n\na>1 biases shorter periods, a=1 is uniform, and 0<a<1 biases longer periods.\n\nEvery round randomizes the seed, resources, terrain, enemies, climate, daylight, and a rare peaceful mode.\n\n[planet=nauvis] evolution is random(0,1)^2; each planet's native terrain and resources also vary through original controls.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses. Normal technology is revoked; infinite research loses one level.
help-admin-security-heading=[img=utility/admin] Permissions and abuse resistance
help-admin-security=The GUI is display only. Purchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click. A stale GUI cannot bypass these checks; an asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view. Crime is disabled in space and only selects another player's property in the current faction.\n\nFaction switching charges first and installs a one-shot death record; a failed death is refunded. That death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] Capacity and cleanup
help-admin-limits=The current soft property cap is __1__ per planet. Lowering it never deletes existing property; it only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest; central property chests are excluded. Property and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass, avoiding a large burst of state destruction in one tick. Public-planet resets close entry and evacuate characters before asynchronous clearing begins.
help-admin-controls-heading=[img=utility/mod_settings] Dynamic-setting boundaries
help-admin-controls=The Administration page is visible only to administrators. Common economy, property, planet, technology-leak, and global multipliers can be adjusted live. Property lifetime, T, and initial-price multipliers affect only properties built afterward. Reset-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\n“Administrators may enter any property” is disabled by default and bypasses visitor permissions only when explicitly enabled. Changing settings does not retroactively grant, charge, or recalculate completed transactions or existing ship attributes.
