help-layer-brief=[img=virtual-signal/signal-info] [font=default-bold]Goal: produce on public planets, then move important supplies to safety before each catastrophe.[/font]\n\nOn your first visit, follow the five steps below. You do not need to learn the price, tax, or technology-loss formulas yet.
help-layer-advanced=[img=item/automation-science-pack] [font=default-bold]This page only explains how systems connect.[/font]\n\nIt does not repeat opening steps or exact formulas.
help-layer-full=[img=item/space-science-pack] [font=default-bold]This page contains only formulas, random ranges, and edge rules.[/font]\n\nUse Brief or the page tooltips for basic operations.
