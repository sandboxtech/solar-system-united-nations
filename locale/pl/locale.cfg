scenario-name=Zjednoczone Narody Słońca
description=\n[font=default-large-bold]Zjednoczone Narody Słońca[/font]\n\nPięć frakcji rozwija publiczne planety, które okresowo przeskakują do nowych światów.\n\nProdukuj pakiety naukowe, zamieniaj je na osobiste doświadczenie i buduj tymczasowe posiadłości, aby zachować swoją fabrykę.\n\n[img=virtual-signal/signal-map-marker] Udaj się na swoją planetę macierzystą  →  [img=item/linked-chest] Zamieniaj naukę w doświadczenie za pomocą inserterów  →  [img=item/construction-robot] Zbuduj lub kup pierwszą posiadłość\n\nNie musisz czytać wszystkich zasad przed rozpoczęciem.\n\nZbuduj zwykłą fabrykę, obserwuj odliczanie skoku i przechowuj najważniejsze rzeczy w obozie lub posiadłości.\n\nProjekt: https://github.com/sandboxtech/solar-system-united-nations\nGrupa QQ: 293280221

