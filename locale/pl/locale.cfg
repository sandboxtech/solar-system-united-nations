coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=Twoja osobista połączona skrzynia jest aktywna (__1__/__2__). Nie można go otworzyć ręcznie; użyj wkładek.
dropoff-refund-spilled=Twoja zwrócona połączona skrzynia została upuszczona na ziemię, ponieważ Twój ekwipunek był pełny.
dropoff-replaced=Twoja najstarsza osobista połączona skrzynia została usunięta i zwrócona jako połączona skrzynia.
dropoff-space-forbidden=Osobiste połączone skrzynie nie mogą być umieszczane na platformach kosmicznych. Przedmiot został zwrócony.
dropoff-placement-forbidden=Nie można tu umieszczać osobistych połączonych skrzyń. Przedmiot został zwrócony.
dropoff-limit-disabled=Limit osobistych połączonych skrzyń wynosi obecnie 0. Przedmiot został zwrócony.
science-converted-notification=Przetworzono naukę: __1__ doświadczenia
roboport-limit-ports=[img=entity/roboport] Konstrukcja odrzucona: podłączona sieć logistyczna zawierałaby robotyporty __1__, powyżej limitu __2__. Nowo umieszczony robotport został usunięty.
roboport-limit-robots=[img=entity/logistic-robot] Konstrukcja odrzucona: podłączona sieć logistyczna zawiera roboty logistyczne __1__, powyżej limitu __2__. Nowo umieszczony robotport został usunięty.
roboport-limit-both=[img=entity/roboport] Konstrukcja odrzucona: podłączona sieć logistyczna zawierałaby robotyporty __1__ (limit __2__) i roboty logistyczne __3__ (limit __4__). Nowo umieszczony robotport został usunięty.
