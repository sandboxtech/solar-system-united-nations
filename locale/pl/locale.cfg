property-access-tooltip=This switch controls every property you own.\n\nWhen off, only the owner and mutual friends from the same faction may enter.\n\nWhen on, every player in your faction may enter.\n\nVisitors must still depart from their home United Nations Refugee Camp.\n\nForeign players still cannot enter.
property-page-tooltip=Different science packs produce properties with different size, lifetime, terrain, or security.\n\nThe selected type and construction level are recorded permanently.\n\nEvery property has four central linked chests.\n\nProperty names cannot be changed after construction.
