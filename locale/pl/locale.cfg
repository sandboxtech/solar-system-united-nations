planet-countdown-paused=Wstrzymano w __1__
planet-page-note=Odliczanie wykorzystuje czas gry.\n\n „Shifting” pojawia się na chwilę po odlocie;\n\nmiejsce docelowe otwiera się, gdy tylko nowy świat będzie gotowy.\n\nKażdy cykl rzuca 0–5 wzajemnie zgodnych ważeń cechy.\n\nZasoby, wrogowie i cechy zmieniające zasady są bardziej powszechne;\n\nZastosowania środowiskowe są rzadsze.\n\nKażdy wymieniony efekt kumuluje się oprócz istniejących ustawień losowej mapy w tym cyklu.
