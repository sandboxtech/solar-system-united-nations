planet-reset-foreign-death=__1__ will shift soon. Because this is foreign territory, your character was killed and will respawn at the camp of __2__. Supplies left on the previous world will not arrive on the new one.
planet-reset-failed=__1__ could not begin its shift. The system will retry in one minute; see the log for details.
planet-reset-command-help=Natychmiast wywołaj zmianę dla jednej publicznej planety.\n\nTylko dla administratorów.
planet-reset-command-usage=Użycie: /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>
planet-reset-command-started=A manual shift was requested for __1__. Evacuation, randomization, and new-world generation use the normal path.
planet-reset-command-busy=__1__ is already shifting. The request was rejected because shifts run one at a time.
planet-reset-command-failed=Nie można wyzwolić zmiany dla __1__.\n\nSzczegóły można znaleźć w dzienniku.
planet-reset-accelerate-button=[img=utility/time_editor_icon] Głosuj za przyspieszeniem — Wydaj wytrzymałość __1__
planet-reset-accelerate-tooltip=Vote to accelerate the current shift cycle on __1__.\n\nSpend __2__ stamina to immediately remove __3__% of the remaining time.\n\nEach player may vote once per cycle, and only while more than __4__ minutes remain.
planet-reset-accelerated=[img=utility/time_editor_icon] __1__ głosował za przyspieszeniem __2__, skracając pozostały czas o __3__%; Pozostało około __4__ minut.
planet-reset-accelerate-error-invalid-player=Nie udało się zidentyfikować gracza, dlatego głosowanie jest niedostępne.
planet-reset-accelerate-error-invalid-faction=Nie jesteś obecnie członkiem żadnej z pięciu frakcji.
planet-reset-accelerate-error-clearing=Publiczna planeta Twojej frakcji zmienia się, więc głosowanie jest niedostępne.
planet-reset-accelerate-error-paused=Odliczanie przesunięcia planetarnego zostało wstrzymane, więc głosowanie jest niedostępne.
planet-reset-accelerate-error-too-late=Głosowanie jest możliwe tylko do czasu, gdy pozostało więcej niż __1__ minut.
planet-reset-accelerate-error-already-voted=Głosowałeś już podczas tego cyklu zmiany.
planet-reset-accelerate-error-insufficient-stamina=Głosowanie wymaga wytrzymałości __2__.
