faction-aquilo-neutral=[img=space-location/aquilo] Akademia Technokratyczna Aquilo jest trwale neutralna.\n\nZawsze pozostaje przyjazna z każdym innym krajem i nie uczestniczy w zmianach dyplomatycznych.
faction-switch=Zdradź i dołącz
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Przejdź bezpłatnie do __1__
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Popełnij samobójstwo i dołącz do __1__.\n\n Nie kosztuje wytrzymałości ani monet.\n\nTwoja postać umiera na miejscu, pozostawiając zwłoki i przedmioty, a następnie odradza się w Obozie Uchodźców Nauvis po __2__ sekund.\n\nTwoja stara frakcja konfiskuje twoją własność i niszczy osobiste powiązane skrzynie; statki pozostają twoje.
faction-already-current=Należysz już do tej frakcji.
faction-online-required=Musisz mieć __1__ całkowitą liczbę godzin online, zanim dołączysz do innej frakcji.\n\nO __2__ pozostaje.
faction-target-location-required=Twoja postać musi dotrzeć do publicznego świata __1__ zanim dołączy do tej frakcji.
faction-switch-cooldown=Musisz poczekać __1__ przed ponowną dezercją.
faction-switch-broadcast=__2__ [img=entity/character] __1__ dołączył do frakcji.
player-joined-foreign=__2__ [img=entity/character] __1__ pojawił się online.
player-killed-broadcast=__2__ [img=entity/character] __1__ zabił __4__ [img=entity/character] __3__.
