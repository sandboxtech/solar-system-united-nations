scenario-name=ソル国際連合
description=\n[font=default-large-bold]太陽系国際連合[/font]\n\n5つの勢力が、新しい世界へ周期的に遷移する公共惑星を開発します。\n\nサイエンスパックを個人経験値に変換し、期限付き物件を建造して、次の世界へ産業をつなげましょう。\n\n[img=virtual-signal/signal-map-marker] 移動と本国キャンプを確認  →  [img=item/linked-chest] インサータでサイエンスパックを投入  →  [img=item/construction-robot] 最初の物件を建造または購入\n\n遷移前に重要な設備と物資を安全な場所へ移してください。\n\n詳しい規則はゲーム内ガイドを確認してください。\n\nProject: https://github.com/sandboxtech/solar-system-united-nations\nQQ group: 293280221

