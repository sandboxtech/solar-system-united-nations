help-layer-brief=[img=virtual-signal/signal-info] [font=default-bold]Public planets will reset. Learn where safety is, then establish your experience and property loop.[/font]\n\nFollow the four steps below to begin.
help-layer-advanced=[img=item/automation-science-pack] [font=default-bold]Learn evacuation and respawn, linked logistics, property rules, and technology loss.[/font]
help-layer-full=[img=item/space-science-pack] [font=default-bold]Precise formulas, random ranges, and rules that affect planning.[/font]
