faction-switch-tooltip-free=Commit suicide and join __1__.\n\nJoining the [img=space-location/nauvis] Nauvis faction costs no stamina.\n\nProperties and the ship in the old faction are lost.\n\nRespawn always takes __2__ seconds, with no additional respawn stamina charge.
