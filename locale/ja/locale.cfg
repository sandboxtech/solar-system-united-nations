help-card-factions=[img=space-location/solar-system-edge] [font=default-bold]What your faction changes[/font]
help-foreign-survival=[font=default-bold]本国と異星[/font]\n\n所属勢力に対応する公共惑星だけが本国です。本国民はリセット時に国連難民キャンプへ退避します。他の4惑星に残ると死亡し、自国キャンプで復活します。残した物資は消去され、異星の物件市場は閲覧専用です。
help-story-background=The five planets were once united under the United Nations of Sol and shared one currency.\n\nRecurring catastrophes and diverging interests ultimately fractured that government into five independent factions.\n\nUnited Nations Refugee Camps and the common coin are among the few foundations left by the old order. Today, countries may open their borders and build together—or close their vision and go to war.
help-story-factions=Choosing a faction means choosing your home planet. New players begin in the [planet=nauvis] People's Republic of Nauvis.\n\nResearch, building ownership, space platforms, and property markets are separated by faction. Another faction's buildings are not yours and cannot be removed with a deconstruction planner.\n\nYou can establish a personal linked chest only by placing a wooden chest on your home public planet. You may buy and build only local property; foreign markets are visible but read only.\n\nWhen your home public planet resets, citizens evacuate to its United Nations Refugee Camp. Characters caught on a foreign planet are removed before its reset and respawn at their home camp; anything left behind disappears with the planet.\n\nFriendly countries open their borders, share vision, may use one another's buildings, and are not automatically targeted by turrets. Hostile countries no longer open their borders or share vision, and their defences may fire on foreign players.\n\nAfter an ordinary country researches [img=technology/space-platform-thruster] Space platform thruster, its diplomacy may change when its planet resets. The [planet=aquilo] Aquilo Technocratic Academy is permanently neutral and remains friendly with every country.\n\nSwitching factions kills your character in place. Old-faction properties become unowned, and its ship and manually established linked chest are destroyed; ordinary buildings remain with the old faction.
help-brief-start=[font=default-bold]2. Convert science packs into experience[/font]\n\nManually place an [img=item/wooden-chest] wooden chest on your home public planet. It becomes your personal linked chest, which cannot be opened by hand and must be served by inserters.\n\nInsert science packs to gain matching personal experience. Before you own property, this chest mainly serves as the input for science conversion.
help-brief-property=[font=default-bold]3. Spend experience to build property[/font]\n\nOpen Build and choose a science pack and construction level. Building spends matching experience and stamina; the page previews its dimensions, lifetime, and price.\n\nFour chests in the property share the owner's personal linked inventory. Connect them to a production line to move supplies between the public planet and safe property.\n\n[font=default-bold]4. Or buy property with coins[/font]\n\nOpen Personal to claim UBI coins, then use Properties to buy an existing local property. Its four linked chests connect to you immediately after purchase.
help-brief-travel=[font=default-bold]1. Learn the Home button first[/font]\n\nPublic planets reset periodically, erasing structures and inventories. Camps and property do not reset with public planets, but temporary property disappears when its own lifetime expires.\n\nThe top-left [img=virtual-signal/signal-map-marker] Home button moves among your home public planet, owned property, and United Nations Refugee Camp. Before starting production, decide where your important supplies will be evacuated.
help-brief-project=[img=virtual-signal/signal-info] QQ group: 293280221\n\n[img=virtual-signal/signal-info] GitHub: https://github.com/sandboxtech/solar-system-united-nations
help-brief-deconstruction=[img=item/deconstruction-planner] 解体プランナーは、累計オンライン時間が __1__ 時間に達し、その後にマップを移動すると使用可能になります。
help-section-beginner=[img=item/linked-chest] [font=default-bold]リンクチェストと個人経験値[/font]
help-detail-linked-chest=A player may establish a personal linked chest only by manually placing a wooden chest on their current faction's own public planet. Wooden chests on other public planets, camps, property, and space platforms remain ordinary.\n\nA personal linked chest cannot be opened by hand and must be served by inserters. Each player may establish one; placing another recovers the old chest.\n\nEvery property size has exactly four central linked chests. They do not count toward the personal limit and share the owner's linked inventory.
help-detail-science=While you are online, your personal linked chest converts science packs about once every __1__ minute(s).\n\nEach pack adds one point of matching personal experience. Every type and quality is accepted.
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]Property guide[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]Experience effect formulas[/font]
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory. Every type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nOwners may also buy their own property.\n\nThe full asking price is recorded, after-tax proceeds return to them, and their net cost is the tax.\n\nWhile physically inside their own player-built property, the owner may salvage it from the top of Properties. Confirmation immediately evacuates everyone, destroys all contents, and deletes the surface. Permanent public property cannot be salvaged.\n\nA property name can only be chosen during construction and cannot be changed afterward. Leaving it blank uses a default made from the planet, owner, and property number.
help-detail-property-build=Choose a construction level from 0 to your current total level. Higher levels usually cost more experience and, depending on the type, change dimensions, lifetime, price decay, or opening price.\n\nDifferent science packs produce different property types. The Fortified Bunker resists burglary; the Aquilo Cryo-Habitat lasts a long time but is easier to enter illegally.\n\nThe Build page shows the actual cost and every resulting attribute. Once built, those attributes no longer change with your level.
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]Public planets[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]Property construction and trade formulas[/font]
help-detail-property-build-formula=Let L be the selected construction level.\n\nMatching science-pack experience spent = __1__+__2__×L, plus __3__ stamina.\n\nOpening price = min(__6__, ceil(experience cost × current construction-price multiplier __4__ × property-type multiplier)).\n\nEach planet retains at most __5__ properties.
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T)))); the administrator sets a, currently __2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe administrator sets the base tax rate, currently __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nAn owner buying their own property is also a sale, uses that owner's level for tax, and updates P and D normally.\n\nSalvage coins = max(1, floor(initial construction price × __2__% × remaining life/total life)). Transactions never change the salvage basis.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases. Temperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%. Minimum brightness is 0–0.2. Peaceful mode has __8__% probability.\n\nThe current technology price multiplier is __9__.\n\nSpoil-time and asteroid-spawning multipliers are __10__ and __11__.
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]Travel, respawn, and planet resets[/font]
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe Home button travels among the current faction's public planet, properties, and camp.\n\nLeaving a public planet remembers your position. If it has not reset, returning places you near that position when possible.\n\nAfter a reset, or when no nearby landing point exists, you arrive at a random point in the 256×256 area around spawn. Positions nearer spawn are more likely.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns you after __2__ seconds; otherwise no stamina is spent, and respawn takes __3__ seconds.\n\nOrdinary deaths respawn at your faction's camp.\n\nSwitching factions kills your character in place and leaves the corpse and items behind. You respawn at the target faction's camp after __3__ seconds without an additional respawn charge.
help-detail-resets=The five public planets count down independently.\n\nServer-wide warnings are issued 5 minutes and 1 minute beforehand. At both times, foreign characters still on that planet are removed; citizens evacuate to their own United Nations Refugee Camp when the reset begins.\n\nEach round rolls 0–5 mutually compatible traits shown on the Planets page. High-impact resource traits are more common than environmental flavor.\n\nPlanet resets do not directly remove technology. That planet's production statistics are cleared, and a removed personal linked chest can be placed again.
help-detail-tech-leak=Once a faction has researched [img=technology/space-platform-thruster] Space platform thruster, its technology receives a separate leak check every __1__ hour(s).\n\nA faction that has not reached this milestone cannot lose technology. Losing the thruster technology later does not lock this mechanism again.\n\nTechnologies on the administrator-managed immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak. Infinite research loses only one level when hit.
help-detail-reset-schedule=Each public planet independently rolls its next reset period. With lower bound __1__ hours, upper bound __2__ hours, and exponent a=__3__:\nperiod = lower+(upper−lower)×random(0,1)^a.\n\na>1 biases shorter periods, a=1 is uniform, and 0<a<1 biases longer periods.\n\nEvery round randomizes the seed, resources, terrain, enemies, climate, daylight, and a rare peaceful mode.\n\n[planet=nauvis] and [planet=gleba] independently set evolution to random(0,1)^2; each planet's native terrain and resources also vary through original controls.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses. Normal technology is revoked; infinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round. Setting this limit to 0 prevents all losses.\n\nその後、勢力別の倍率が適用されます。[planet=aquilo] は現在×__3__、ほかの勢力は×1です。
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks. An asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space. Its target faction comes from the character's current public planet, United Nations Refugee Camp, or property. Properties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record. A failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet. Lowering it never deletes existing property; it only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest; central property chests are excluded. Property and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass. The player record, inventory, personal blueprints, account and owned assets are removed; only science experience is retained by player name.\n\nPublic-planet resets close entry and evacuate characters before asynchronous clearing begins.
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, technology-leak, and global multipliers can be adjusted live.\n\nThe new-property initial-price multiplier affects only properties built afterward; the salvage rate immediately affects every player-built property not yet salvaged. Red and green property dimensions, half-life, and total-lifetime formulas are defined by the scenario configuration.\n\nReset-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nTo inspect a fresh planet round, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>. It reuses normal evacuation and clearing and refuses to run while another planet is clearing.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies. Replace the whole list with one /sc command; the next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any property” is disabled by default. It bypasses visitor permissions only when explicitly enabled.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions or existing ship attributes.
