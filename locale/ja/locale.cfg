planet-reset-warning=__1__ は __2__ 分後に遷移します。重要な物資を早めに退避してください。
planet-reset-finished=__1__ は新しい世界に到着しました。
planet-reset-closed=__1__ は遷移中です。\n\n国連難民キャンプへ移動しました。
planet-reset-foreign-death=__1__ はまもなく遷移します。 ここは異星のためキャラクターは死亡し、__2__ の難民キャンプで復活します。 前の世界に残した物資は新世界へ届きません。
planet-reset-failed=__1__ は遷移を開始できませんでした。 1分後に再試行します。 詳細はログを確認してください。
planet-reset-command-help=1 つのパブリック プラネットのシフトを直ちにトリガーします。\n\n管理者のみ。
planet-reset-command-usage=使用法: /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>
planet-reset-command-started=A manual shift was requested for __1__. Evacuation, randomization, and new-world generation use the normal path.
planet-reset-command-busy=__1__ is already shifting. The request was rejected because shifts run one at a time.
planet-reset-command-failed=__1__ のシフトをトリガーできませんでした。\n\n詳細については、ログを参照してください。
planet-reset-accelerate-button=[img=utility/time_editor_icon] 加速に投票 — 体力 __1__ を消費
planet-reset-accelerate-tooltip=Vote to accelerate the current shift cycle on __1__.\n\nSpend __2__ stamina to immediately remove __3__% of the remaining time.\n\nEach player may vote once per cycle, and only while more than __4__ minutes remain.
planet-reset-accelerated=[img=utility/time_editor_icon] __1__ が __2__ の加速に投票し、残り時間が __3__% 短縮されました。 残り約 __4__ 分です。
planet-reset-accelerate-error-invalid-player=プレイヤーを確認できないため投票できません。
planet-reset-accelerate-error-invalid-faction=現在、5つの勢力のいずれにも所属していません。
planet-reset-accelerate-error-clearing=本国の公共惑星は遷移中のため投票できません。
planet-reset-accelerate-error-paused=惑星遷移のカウントダウンは停止中です。
planet-reset-accelerate-error-too-late=残り時間が __1__ 分を超える間だけ投票できます。
planet-reset-accelerate-error-already-voted=この遷移周期ではすでに投票済みです。
