scenario-name=ソル国際連合
description=\n[font=default-large-bold]太陽系国際連合[/font]\n\n5つの勢力が、災害で定期的にリセットされる公共惑星を開発します。サイエンスパックを個人経験値に変換し、期限付き物件を建造して、次のリセット前に産業を安全な場所へ移します。\n\n[img=item/wooden-chest] 本国で木製チェストを設置  →  [img=item/linked-chest] インサータでサイエンスパックを投入  →  [img=item/construction-robot] 最初の物件を建造\n\n本国キャンプは避難先になります。異星への遠征には危険があります。詳しい規則はゲーム内ガイドを確認してください。\n\nProject: https://github.com/sandboxtech/solar-system-united-nations\nQQ group: 293280221

