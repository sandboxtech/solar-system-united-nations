faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=自殺して __1__ に参加します。\n\nスタミナもコインもかかりません。\n\nキャラクターは死体とアイテムを残してその場で死亡し、__2__ 後にノーヴィス難民キャンプにリスポーンします。秒。\n\nあなたの古い派閥はあなたの財産を没収し、個人のリンクされた宝箱を破壊します。船はあなたのもののままです。
faction-already-current=あなたはすでにこの派閥に属しています。
faction-online-required=別の勢力に参加するには、合計オンライン時間が __1__ 必要です。\n\n残りは約 __2__ です。
faction-target-location-required=あなたのキャラクターは、その派閥に参加する前に、__1__ のパブリック ワールドに到達する必要があります。
faction-switch-cooldown=再び亡命する前に、__1__ 待つ必要があります。
