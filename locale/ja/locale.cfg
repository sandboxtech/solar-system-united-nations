planet-page-note=カウントダウンにはゲーム時間を使用します。\n\n出発後に短時間「シフト」が表示されます。\n\n新しい世界の準備が整うとすぐに目的地が開きます。\n\n各サイクルのロールは 0 ～ 5 で、相互に互換性のある重み付けされています。特性。\n\nリソース、敵、ルール変更特性がより一般的です。\n\n環境フレーバーはよりまれです。\n\nリストにあるすべての効果は、そのサイクルの既存のランダム化されたマップ設定の上にスタックされます。
