coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=Votre coffre lié personnel est actif (__1__/__2__). Il ne peut pas être ouvert à la main ; utiliser des inséreurs.
dropoff-refund-spilled=Votre coffre lié renvoyé a été laissé tomber par terre car votre inventaire était plein.
dropoff-replaced=Votre coffre lié personnel le plus ancien a été supprimé et restitué en tant que coffre lié.
dropoff-space-forbidden=Les coffres personnels liés ne peuvent pas être placés sur les plateformes spatiales. L'article a été retourné.
dropoff-placement-forbidden=Les coffres personnels liés ne peuvent pas être placés ici. L'article a été retourné.
dropoff-limit-disabled=La limite personnelle des coffres liés est actuellement de 0. L'objet a été retourné.
