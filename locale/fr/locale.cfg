roboport-limit-ports=[img=entity/roboport] Construction rejetée : le réseau logistique connecté contiendrait des roboports __1__, au-dessus de la limite de __2__. Le roboport nouvellement placé a été supprimé.
roboport-limit-robots=[img=entity/logistic-robot] Construction rejetée : le réseau logistique connecté contient des robots logistiques __1__, au-dessus de la limite de __2__. Le roboport nouvellement placé a été supprimé.
