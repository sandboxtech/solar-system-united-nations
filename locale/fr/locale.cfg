scenario-name=Nations unies du Soleil
description=\n[font=default-large-bold]Nations unies du Soleil[/font]\n\nCinq factions développent des planètes publiques qui basculent régulièrement vers un nouveau monde.\n\nProduisez des packs scientifiques, transformez-les en expérience personnelle et construisez des propriétés temporaires pour préserver votre industrie.\n\n[img=virtual-signal/signal-map-marker] Rejoignez votre planète natale  →  [img=item/linked-chest] Transformez la science en expérience avec des bras inséreurs  →  [img=item/construction-robot] Construisez ou achetez votre première propriété\n\nIl n’est pas nécessaire de lire toutes les règles avant de commencer.\n\nConstruisez une usine classique, surveillez le compte à rebours et mettez l’essentiel dans votre camp ou votre propriété.\n\nProjet : https://github.com/sandboxtech/solar-system-united-nations\nGroupe QQ : 293280221

