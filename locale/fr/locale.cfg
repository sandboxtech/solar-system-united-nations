faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Faire défection gratuitement vers __1__
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Commettez-vous suicide et rejoignez __1__.\n\nNe coûte ni endurance ni pièces.\n\nVotre personnage meurt sur place, laissant son cadavre et ses objets derrière lui, puis réapparaît au camp de réfugiés de Nauvis après __2__. secondes.\n\nVotre ancienne faction confisque vos propriétés et détruit les coffres personnels liés ; les navires restent à vous.
faction-already-current=Vous appartenez déjà à cette faction.
faction-online-required=Vous devez avoir un total d'heures en ligne __1__ avant de rejoindre une autre faction. \n\nÀ propos de __2__ reste.
faction-target-location-required=Votre personnage doit atteindre le monde public de __1__ avant de rejoindre cette faction.
faction-switch-cooldown=Vous devez attendre __1__ avant de faire à nouveau défection.
