faction-switch-tooltip=必须亲自抵达 __1__ 公共星球才能叛国加入。\n\n消耗 __2__ 体力和 [img=item/coin] __3__。\n\n转籍后角色留在原地；再次转籍需等待 __4__ 小时。\n\n原阵营房产会被充公，个人关联箱会被摧毁；飞船保留。
faction-switch-tooltip-free=自杀并加入 __1__。\n\n不消耗体力或金币。\n\n角色在原地死亡，尸体和物品留下；__2__ 秒后在地球难民营复活。\n\n原阵营房产会被充公，个人关联箱会被摧毁；飞船保留。
