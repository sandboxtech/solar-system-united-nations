help-story-background=五颗星球曾经统一在太阳系联合国之下。\n\n太阳系联合国建立了沿用至今的统一金币体系。\n\n周期性灾变与利益分化最终撕裂了统一政权，五颗星球分别建立起五个敌对阵营。\n\n联合国难民营和共同货币，是旧秩序留下的少数公共基础。\n\n你将出售科技瓶，积累金币和经验。\n\n建造限时房产与飞船，在不断重置的世界中留下阶段性的产业。
help-story-factions=阵营会分开科技、建筑归属、太空平台和聊天。\n\n国家关系只有友好和敌对两种。友好国家共享视野并能使用彼此的建筑；敌对国家停止共享新视野，炮塔可以攻击。\n\n一个国家研究 [img=technology/space-platform-thruster] 太空平台推进器后，每当本国公共星球完成重置，都会在“对其余四国全部友好”和“对其余四国全部敌对”之间切换。\n\n不断变化的外交关系允许玩家扮演建设者、商人和外交大使，也可能带来入侵与破坏。\n\n本国居民独享本星球的联合国难民营，并能拥有本地房产。\n\n公共星球即将发生灾变时，居民可以传送收摊，把关键物资和预制工厂撤入不会随公共星球重置的安全地图。\n\n外国居民不能使用这套本地避灾设施。留在公共星球上的建筑和库存仍会被清除。\n\n本阵营会看到原本的聊天消息；其他四个阵营会收到带有发言者星球图标和阵营名称的转发消息。\n\n切换阵营会在原地死亡；加入 [planet=nauvis] 地球帝国免费，加入其他阵营消耗 __1__ 体力。\n\n原阵营房产变为无主，原阵营飞船被摧毁，普通建筑继续留给原阵营。
help-brief-start=[font=default-bold]1. 先领取启动资金[/font]\n\n新账户获得 [img=item/coin] 10000。打开“个人”页领取已经积累的低保。\n\n[font=default-bold]2. 建立个人关联箱[/font]\n\n前往自己阵营所属的公共星球，手动放置 [img=item/wooden-chest] 木箱。\n\n木箱会变成个人关联箱。它不能手动打开，必须用机械臂存取。每人只能建立一个。\n\n[font=default-bold]3. 出售科技瓶[/font]\n\n用机械臂把科技瓶放进关联箱。所有种类、所有品质的科技瓶都按每瓶 [img=item/coin] 1 出售，并累计对应经验。先生产 [img=item/automation-science-pack] 自动化科技包，为第一套房产准备经验。\n\n累计在线满 __1__ 小时并完成下一次传送后，开放 [img=item/deconstruction-planner] 红图拆除规划。
help-brief-property=[font=default-bold]4. 建造第一套房产[/font]\n\n在“建造”页选择寿命和尺寸。每 __2__ 小时寿命需要 __1__ 基础经验，再乘所选尺寸的费用倍数；每次另消耗 __3__ 体力。\n\n新玩家以 __4__ 满体力开始，可以连续建造两套最便宜的房产。建造没有额外等待时间。\n\n小房成本低、适合尽快获得安全据点；大房空间充足、适合搬入完整工厂。所有尺寸中央都固定有四个关联箱。\n\n房产可以交易、向好友开放，也可在屋内主动回收。寿命结束后房内玩家会先被撤离，随后房产自动删除。
help-brief-travel=[font=default-bold]5. 在公共星球与安全据点之间往返[/font]\n\n左上角 [img=virtual-signal/signal-map-marker]“家”按钮会在当前阵营的公共星球、自有房产和联合国难民营之间切换。\n\n公共星球会周期重建，留在上面的建筑和库存都会消失。\n\n联合国难民营不会随公共星球重置；私人房产在自身寿命结束前也不会受到影响。把关键物资和预制工厂及时搬进这些安全地图。
help-brief-project=[img=virtual-signal/signal-info] QQ 群：293280221\n\n[img=virtual-signal/signal-info] GitHub：https://github.com/sandboxtech/solar-system-united-nations
help-section-beginner=[img=item/linked-chest] [font=default-bold]关联箱与科技瓶兑换[/font]
help-detail-linked-chest=玩家只能在自己当前阵营所属的公共星球上，手动放置木箱建立个人关联箱。其他公共星球、难民营、房产和太空平台上的木箱保持普通木箱。\n\n个人关联箱不能手动打开，需要使用机械臂存取。每名玩家最多建立一个；再次放置会回收旧箱。\n\n房产无论大小，中央都固定有四个关联箱。这四个箱子不占个人上限，并与屋主的个人关联箱共享物品。
help-detail-science=玩家在线时，系统每 __1__ 分钟检查一次个人关联箱，并自动出售里面的科技瓶。\n\n所有种类、所有品质的科技瓶均按每瓶 [img=item/coin] 1 出售；实际卖出的数量同时累计为对应科技瓶经验。
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]房产说明[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]经验作用公式[/font]
help-detail-experience-effects=设总等级为 L。\n\n建房会永久消耗对应科技瓶经验，可能降低 L。\n\n新飞船宽度 = __1__+L×__2__。\n\n新飞船寿命 = __3__+L 小时。\n\n作为房产卖方时，实际交易税率 = 当前基础税率 __4__%/(L/100+1)。\n\n飞船属性只在建造时确定，之后升级不追溯修改。
help-detail-property-basic=购买后，房产中央四个关联箱会连接到新屋主的个人关联箱库存。小房和大房都只有四个；小房优势是成本低，大房优势是可用空间大。\n\n屋主也可购买自己的房产。\n\n系统按完整报价成交并返还扣税后的所得，屋主实际只损失税款。\n\n角色站在自己的房产里时，屋主可以从房产页顶部回收当前房产。确认后立即撤离所有人、销毁房内物资并删除这张地图。永久公共房产不能回收。\n\n房产名称只能在建造时设定，建成后不可修改；留空则使用星球、屋主和房产序号组成的默认名称。
help-detail-property-build=三档总寿命当前为 __3__/__4__/__5__ 小时。\n\n寿命费用倍数 = 总寿命/__2__；三档尺寸 64×32/128×64/256×128 的费用倍数为 1/3/5。\n\n建造永久消耗“__1__×寿命费用倍数×尺寸费用倍数”点 [img=item/automation-science-pack] 自动化科技包经验，结果向上取整；另消耗 __12__ 体力。只能在当前阵营建房，没有额外等待时间。\n\n新房归建造者所有。初始成交价 P=min(__10__, 向上取整(__9__×经验成本))，初始降价时间 D=当前时刻。三档降价时间 T 当前为 __6__/__7__/__8__ 小时。\n\n每颗星球最多保留 __11__ 套房产。\n\n每颗星球另有小、中、大三套永久房产，T 均为 3 小时。交易不会延长寿命。
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]公共星球[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]房价与交易公式[/font]
help-detail-property-price=每套房产都有自己的降价时间 T。\n\nP 是上一笔实际成交价，D 是价格降回 P 的时刻。\n\n当前价 = min(__1__, max(1, 向上取整(P × a^((D−当前时刻)/T))))。管理员设定房价倍率 a，当前为 __2__。\n\n房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=每次成交后，P 改为本次成交价，D=当前时刻+T，因此刚成交后的新报价约为 aP。\n\n管理员设置基础税率，当前为 __1__%。\n\n设卖方总等级为 L，实际交易税率 = 基础税率 × 1/(L/100+1)。\n\n房主购买自己的房产也算正常交易，使用自己的等级计税，并更新 P 与 D。\n\n主动回收金币 = max(1, 向下取整(建造时初始价格 × __2__% × 剩余寿命/总寿命))。后续交易价格不会改变回收基准。
help-detail-world-randomization=每轮资源以频率 __1__、矿区大小 __2__、丰度 __3__ 为标准，各自乘 2^U(-__4__,__4__)。\n\n水域和自然地形参数各乘 2^U(-__5__,__5__)。\n\n悬崖间距与连续程度各乘 2^U(-__6__,__6__)。\n\n敌巢频率、大小和出生点安全区各乘 2^U(-__7__,__7__)。\n\n湿度和辅助地形参数在 ±0.5 内变化，温度在 ±20 内变化。\n\n白昼占 20%～80%。夜间最低亮度为 0～0.2。和平模式概率为 __8__%。\n\n当前全服科技价格倍率为 __9__。\n\n腐败时间倍率为 __10__。小行星生成倍率为 __11__。
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]传送与复活[/font]
help-detail-travel=每颗公共星球都有独立的联合国难民营。\n\n顶层“家”按钮在本阵营公共星球、房产和难民营之间往返。\n\n从公共星球前往房产或难民营前，系统会记录离开坐标、星球表面和当前重置轮次。\n\n从房产或难民营返回时，如果星球仍是同一轮，会优先在记录坐标附近寻找落脚点。\n\n如果附近无法落脚、星球已经重置、表面已经更换或尚无记录，则改在出生点周围边长 256 格的正方形内随机落脚；越靠近出生点，出现概率越高。\n\n普通死亡时，若有至少 __1__ 体力，系统自动扣除 __1__ 体力并在 __2__ 秒后复活。\n\n体力不足时不扣除，在 __3__ 秒后复活。\n\n在“阵营”页切换阵营会让角色在原地死亡，尸体和物品留在原地。\n\n本次复活前往目标阵营的难民营。\n\n切换阵营的死亡不额外收取复活体力，固定等待 __3__ 秒。
help-detail-resets=五颗公共星球分别倒计时，并且一次只重置一颗。\n\n系统提前 5 分钟预警，随后禁止进入并把星球上的玩家撤往联合国难民营；删除旧地图并生成新地图后才重新开放。\n\n每轮会抽取 0～5 个互不冲突的星球特色，并显示在“星球”页。\n\n资源等影响明显的特色更容易出现，单纯改变环境外观的特色较少出现。\n\n星球重置不会清除科技；该星球的生产统计归零，个人关联箱被清除后可以重新放置。
help-detail-tech-leak=每个阵营每 __1__ 小时分别进行一次科技失传判定。\n\n用于解锁事件的特殊科技不会失传。\n\n当前研究直接依赖的科技不会失传。\n\n无限科技被抽中时只降低一级。
help-detail-reset-schedule=每颗公共星球会随机决定下一次重置时间。设最短 __1__ 小时、最长 __2__ 小时、随机偏向指数 a=__3__：\n周期 = 最短时间+(最长时间−最短时间)×随机数^a。\n\na>1 时更容易抽到短周期，a=1 时机会均等，0<a<1 时更容易抽到长周期。\n\n每轮都会改变地图种子、资源、地形、敌巢、气候、昼夜，并有少量机会进入和平模式。\n\n[planet=nauvis] 与 [planet=gleba] 的进化度各自取“随机数的平方”；各星球特有地形与资源也会一同变化。
help-detail-tech-leak-formula=每轮科技失传会随机得到一个 0～__1__ 的强度 x。\n\n某项已研究科技的失传概率为 x%×该科技使用的科技瓶种类数。普通科技会被撤销，无限科技只降低一级。
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]权限与防滥用[/font]
help-admin-security=界面只显示结果，不能直接改变游戏数据。\n\n购买、进入、建造、犯罪、传送和切换阵营时，代码都会重新核对玩家、阵营、角色位置、金币、体力、所有权以及目标地图是否仍然存在。\n\n过期界面不能绕过检查；正在删除的房产只会提示不可用。\n\n传送与犯罪以角色身体真正所在的地图为准，不受远程查看画面影响。\n\n太空中不能犯罪。目标阵营由角色所在的公共星球、联合国难民营或房产决定，并跳过犯罪者自己以及已对外开放的房产。\n\n切换阵营会先扣除体力并记录这次特殊死亡；如果死亡操作失败，体力会退还。\n\n这次死亡固定等待 60 秒，不再收取普通快速复活费用。
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]容量与清理[/font]
help-admin-limits=每颗星球当前最多有 __1__ 套房产。调低上限不会删除已有房产，只会阻止继续建造，避免误删玩家财产。\n\n每名玩家只能在公共星球建立一个个人关联箱；房产中央的箱子不计入。房产和飞船到期时都会先撤离玩家。\n\n连续离线 __2__ 小时的非管理员玩家，每小时最多清理一名，避免同一时刻集中删除大量数据。公共星球重置会先禁止进入并撤离角色，再清除旧地图。
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]管理设置的影响范围[/font]
help-admin-controls=管理页只对管理员显示。\n\n常用的经济、房产、星球、科技失传和全服倍率都可以在游戏中调整。\n\n房产寿命、降价时间 T 和初始价格倍率只影响之后建造的房产；回收比例会立即影响所有尚未回收的玩家房产。\n\n星球重置的最短时间、最长时间和随机偏向只用于安排下一轮，不会改动已经开始的倒计时。\n\n手动生成新一轮星球：/un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>。这条命令使用与自动重置相同的撤离和清图流程；已有星球正在重置时会拒绝执行。\n\n“管理员进入任意房产”默认关闭。只有主动开启时，管理员才能绕过访客权限。\n\n调整参数不会补发、追扣或重新计算已经完成的交易和已经建成的飞船。
