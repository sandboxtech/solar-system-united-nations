faction-page-tooltip=五个阵营互相敌对，炮塔会自动开火。\n\n战争并非强制玩法。你可以建设、贸易和担任外交大使，也可以入侵与破坏。\n\n切换阵营会让角色在原地死亡。加入 [planet=nauvis] 地球帝国免费；加入其他阵营消耗 __1__ 体力。\n\n原阵营房产会变为无主。\n\n原阵营飞船会被摧毁。\n\n本次复活固定等待 __2__ 秒，损失均不补偿。
