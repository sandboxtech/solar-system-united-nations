scenario-name=[color=acid]United Nations of Sol[/color]
description=\n[color=acid][font=default-large-bold]United Nations of Sol[/font][/color]\n\n[img=item/linked-chest] [font=default-large-bold]出售科技瓶[/font]\n在 [planet=nauvis] 手动放置 [color=yellow]木箱[/color]，即可建立个人关联箱。所有种类和品质的科技瓶都按每瓶 [img=item/coin] [color=acid]1 金币[/color]出售，同时累计对应经验。离线期间低保仍会增长，最多保存 30 小时。\n\n[img=item/construction-robot] [font=default-large-bold]建造和交易房产[/font]\n消耗星球对应的科技瓶经验和 10000 体力，建造限时私人房产；每次成功建造后冷却 20 小时。[planet=nauvis] 房产使用红瓶经验，其余星球使用各自的特产科技瓶。房产可以交易、向双向好友开放，寿命结束后会自动撤离玩家并删除。\n\n[img=space-location/nauvis] [font=default-large-bold]不断重建的五颗星球[/font]\n五颗公共星球各自按随机周期重建，资源、地貌、气候和昼夜都会改变。每轮另有 [color=acid]3 个随机特色词条[/color]，倍率叠加在本轮地图参数之上。重建会清除星球建筑和物资，但保留全服科技。\n\n[img=item/space-platform-starter-pack] [font=default-large-bold]经验、合作与飞船[/font]\n每种科技瓶经验的十进制位数就是它贡献的等级。总等级会扩大新飞船、延长其寿命，并降低卖房税率。玩家可在任何地点选择任意公共星球轨道建造飞船，也可以建立好友关系、互访房产和直接转账。\n\n[virtual-signal=signal-info] 进入场景后点击左上角按钮查看完整玩法说明。\n\n项目 https://github.com/sandboxtech/solar-system-united-nations\nQQ 群 293280221

