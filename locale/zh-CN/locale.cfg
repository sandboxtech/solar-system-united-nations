help-foreign-survival=[font=default-bold]本国与外星[/font]\n\n你所属阵营对应的公共星球是本国星球，其他公共星球都是外星。\n\n本国星球跃迁时，居民可以撤入本国联合国难民营。\n\n跃迁前仍滞留在外星的角色会死亡，随后在本国难民营复活。\n\n外星房产只能查看，不能正常购买或进入。
help-story-background=五颗星球曾经由太阳系联合国统一管理。\n\n它们共同使用金币。\n\n一次次星球灾变和不断扩大的利益分歧，最终令联合国分裂。\n\n五颗星球各自建立了新的国家。\n\n联合国难民营和通用货币仍被保留下来。\n\n各国既可能合作建设，也可能彼此封锁甚至开战。
help-story-factions=阵营决定你的本国星球、科技进度和资产归属。\n\n本国难民营和房产，是星球跃迁时最可靠的撤运据点。
help-story-factions-detail=新玩家从 [img=space-location/nauvis] 地球人民共和国开始。\n\n各国分别研究科技。\n\n建筑、房产和太空平台也分别归各国所有。\n\n你只能正常建造、购买和进入本国房产。\n\n其他国家的房产市场仅供查看。\n\n本国居民可以在跃迁前把物资转入本国难民营和房产。\n\n外国玩家不能使用这些据点撤运当地物资。
help-story-foreign=他国特产值得远征，但当地公共星球同样会跃迁。\n\n尽快建设 [img=item/rocket-silo] 火箭发射井，把矿物和产品发往轨道平台，再运回本国。
help-story-foreign-detail=他国基地是有期限的前哨站。\n\n你不能使用当地难民营或房产撤运物资。\n\n撤离警报响起后，请尽快通过火箭和轨道平台运走物资。\n\n死亡后会在本国难民营复活。\n\n尸体和随身物品留在原处。
help-story-diplomacy=普通地图默认向五国开放；管理员可以分别对本国或外国阵营隐藏。\n\n友好国家共享已经探索的视野并停火。\n\n敌对国家不共享探索视野，防御塔也可能向外国玩家开火。
help-story-diplomacy-detail=建筑始终归各国所有。\n\n友好关系不会自动向盟友开放建筑控制权。\n\n无论关系如何，你都不能用红图拆除其他国家的建筑。\n\n普通国家研究 [img=technology/space-platform-thruster] 太空平台推进器后，外交关系可能在星球跃迁时发生变化。\n\n[img=space-location/aquilo] 冰星技术官僚学院永久中立。\n\n它与其他国家始终友好。
help-story-faction-switch=加入外国阵营前，先亲自抵达对方的公共星球。\n\n房产会被充公，飞船保留。
help-story-faction-switch-detail=加入火星、草星、雷星或冰星阵营时，角色必须站在目标公共星球。\n\n转籍消耗体力和金币，角色不会死亡。\n\n加入地球阵营仍会让角色在原地死亡，随后在地球难民营复活。\n\n无论加入哪国，原阵营房产都会变为无主，个人关联箱会被摧毁。\n\n飞船保留；普通建筑仍归原阵营所有。
help-advanced-travel-summary=公共星球会周期跃迁。\n\n本国难民营和房产是稳定的落脚点。\n\n走进关联箱旁的教学网格门口，即可在这些地图之间通行。
help-advanced-linked-summary=个人关联箱会把科技瓶转换成经验。\n\n房产自带的四个关联箱与屋主共享同一库存，可用机械臂跨地图转移物资。
help-advanced-property-summary=房型由科技瓶决定，建造等级会影响本次成本和属性。\n\n房产可以买卖、再次购买或回收，也会在寿命结束时消失。
help-advanced-world-summary=每次跃迁都会生成新的地形、资源和星球特色。\n\n已研究科技也可能失传。
help-brief-start=亲手放置 [img=item/wooden-chest] 木箱，建立个人关联箱。\n\n关联箱不能直接打开。\n\n用机械臂投入科技瓶。\n\n每瓶都会变成对应的个人经验。
help-brief-property=有经验后，可以在“建造”页消耗经验和体力建房。\n\n也可以先领取低保金币。\n\n然后在“房产”页购买本国现成房产。\n\n第一套选择负担得起的小屋即可。
help-brief-storage=房产入口的四个关联箱，与屋主的个人关联箱共享物品。\n\n使用机械臂或自带装卸机存取。\n\n这样就能把想保留的物资送进房产。
help-brief-advice=前期先做一条小规模科技瓶产线，不必一次建完大工厂。\n\n留意左上角的跃迁倒计时，提前搬走最重要的物资。\n\n房产被别人买走时，你会收到扣税后的成交款，可以再建或再买，不会因此无法继续。
help-brief-travel=走进关联箱旁的教学网格门口，前往本国公共星球。\n\n先在星球采集资源。\n\n再把基础供电和研究设施逐步搬进难民营。
help-brief-project=[img=virtual-signal/signal-info] QQ 群：293280221\n\n[img=virtual-signal/signal-info] GitHub：https://github.com/sandboxtech/solar-system-united-nations
help-brief-features=[img=utility/time_editor_icon] 每次星球跃迁都会带来新的地图、资源和特色。\n\n[img=space-location/solar-system-edge] 五个阵营拥有各自的科技、领土和市场。\n\n你可以专心建设，也可以参与贸易、合作、外交、入侵或战争。
help-brief-deconstruction=累计在线满 __1__ 小时并完成下一次传送后，开放 [img=item/deconstruction-planner] 红图拆除规划。
help-section-beginner=[img=item/linked-chest] [font=default-bold]关联箱与个人经验[/font]
help-detail-linked-chest=在允许的公共星球、难民营或房产中，亲手放置木箱可以建立个人关联箱。\n\n个人关联箱不能手动打开，需要使用机械臂存取。\n\n当前每名玩家最多建立 __1__ 个。\n\n达到上限后再次放置，会回收最早的旧箱并退还木箱。\n\n房产入口自带的四个关联箱不占个人上限，并与屋主的个人关联库存共享物品。\n\n本国公共星球接驳站下方的四个国家物流箱，与本国难民营的四个国家物流箱相连；\n\n它们不属于任何个人，需要使用机械臂存取。
help-detail-science=玩家在线时，个人关联箱大约每 __1__ 分钟转换一次科技瓶。\n\n离线不满 __3__ 小时仍会转换，但大约每 __2__ 分钟检查一次。\n\n每瓶增加 1 点对应的个人经验；\n\n所有种类和品质都可以转换。
help-detail-logistics-limits=[img=entity/roboport] 单个物流网络最多连接 __1__ 座机器人指令平台。\n\n[img=entity/logistic-robot] 单个物流网络最多容纳 __2__ 个物流机器人。\n\n放置机器人指令平台后超过任一上限时，刚放置的平台会被移除，并通知本阵营玩家。
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]房产说明[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]经验作用公式[/font]
help-detail-experience-effects=设总等级为 L。\n\n建房会永久消耗对应科技瓶经验，可能降低 L。\n\n新飞船宽度 = __1__+L×__2__。\n\n新飞船寿命 = __3__+L 小时。\n\n作为房产卖方时，实际交易税率 = 当前基础税率 __4__%/(L/100+1)。\n\n飞船属性只在建造时确定，之后升级不追溯修改。
help-full-growth-summary=总等级会增强新建飞船，并在卖房时降低税率。\n\n建造房产会消耗经验，因此总等级可能下降。
help-detail-property-basic=购买后，房产入口四个关联箱会连接到新屋主的个人关联箱库存。\n\n每种房型都固定有四个关联箱；\n\n不同科技瓶会建成尺寸、寿命、地貌或安全性不同的房产。\n\n屋主站在自己的限时房产内，可以续期、升级或回收。\n\n续期把剩余寿命补回建造时的完整寿命；经验费按缺少的寿命和当前面积计算。\n\n升级会把房产提升一级，并按目标等级更新尺寸、总寿命和降价周期。\n\n回收会立即撤离所有人、销毁房内物资并删除这张地图。\n\n永久公共房产不能续期、升级或回收。\n\n房产名称只能在建造时设定，建成后不可修改；\n\n留空则使用屋主和房产序号组成的默认名称。
help-detail-property-build=建造等级可以在 0 到当前总等级之间选择。\n\n等级越高，通常需要越多经验，也会按房型改变尺寸、寿命、降价速度或初始价格。\n\n不同科技瓶会建成不同房型。\n\n安全小屋更难遭到入室犯罪；\n\n冰原小屋寿命很长，但更容易被闯入。\n\n建造页会显示本次建造的实际成本和全部属性。\n\n房产建成后，这些属性不再随玩家等级变化。
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]公共星球[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]房产建造与交易公式[/font]
help-detail-property-build-formula=设选择的建造等级为 L。\n\n消耗的对应科技瓶经验 = __1__+__2__×L，并另消耗 __3__ 体力。\n\n初始房价 = min(__6__, 向上取整(经验成本 × 当前建造价格倍率 __4__ × 房型倍率))。\n\n每颗星球最多保留 __5__ 套房产。
help-detail-property-price=每套房产都有自己的降价时间 T。\n\nP 是上一笔实际成交价，D 是价格降回 P 的时刻。\n\n当前价 = min(__1__, max(1, 向上取整(P × a^((D−当前时刻)/T))))。\n\n当前房价倍率 a=__2__。\n\n房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=每次成交后，P 改为本次成交价，D=当前时刻+T，因此刚成交后的新报价约为 aP。\n\n当前基础税率为 __1__%。\n\n设卖方总等级为 L，实际交易税率 = 基础税率 × 1/(L/100+1)。\n\n房主给自己的房产加价也算正常交易，并更新 P 与 D；其税率再乘以 __3__。\n\n回收经验 = 向下取整(建造经验 × __2__% × 剩余寿命/建造总寿命 × 当前面积/初始面积)。\n\n续期体力 = 1000 + 向上取整(建房体力 × 缺失寿命/建造总寿命 × 当前面积/初始面积)。
help-full-property-summary=建房消耗经验和体力。\n\n购买后，下一次报价立即上涨到约 __1__ 倍；\n\n成交款扣税后交给原屋主。\n\n精确公式请悬停信息图标查看。
help-detail-world-randomization=每轮资源以频率 __1__、矿区大小 __2__、丰度 __3__ 为标准，各自乘 2^U(-__4__,__4__)。\n\n水域和自然地形参数各乘 2^U(-__5__,__5__)。\n\n悬崖间距与连续程度各乘 2^U(-__6__,__6__)。\n\n敌巢频率、大小和出生点安全区各乘 2^U(-__7__,__7__)。\n\n湿度和辅助地形参数在 ±0.5 内变化，温度在 ±20 内变化。\n\n白昼占 20%～80%。\n\n夜间最低亮度为 0～0.2。\n\n和平模式概率为 __8__%。\n\n当前全服科技价格倍率为 __9__。\n\n腐败时间倍率为 __10__。\n\n小行星生成倍率为 __11__。
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]传送、复活与星球跃迁[/font]
help-detail-travel=每颗公共星球都有独立的联合国难民营。\n\n关联箱旁的 4×3 教学网格区域就是“门口”。\n\n本国居民走进公共星球门口，会前往本国难民营。\n\n走进难民营门口，会返回本国公共星球。\n\n走进本国房产门口，会前往本国难民营。\n\n外国居民站在这些门口不会触发传送。\n\n进入获准访问的房产，仍使用房产列表中的“进入”。\n\n普通死亡时，若有至少 __1__ 体力，会自动扣除 __1__ 体力并在 __2__ 秒后复活；\n\n体力不足时不扣除，在 __3__ 秒后复活。\n\n普通死亡后会在本阵营难民营复活。
help-detail-resets=五颗公共星球分别计算跃迁倒计时。\n\n外国角色会在跃迁前收到撤离警报。\n\n本国居民会在跃迁时撤往本国联合国难民营。\n\n新星球会生成不同的地图、资源和星球特色。
help-detail-tech-leak=每个阵营每 __1__ 小时分别进行一次科技失传判定。\n\n免疫名单内的科技、触发科技，以及当前研究直接依赖的科技不会失传。\n\n其他开局赠送科技及其前置科技仍然可能失传。\n\n无限科技被抽中时只降低一级。
help-detail-reset-schedule=下一次跃迁会随机安排在 __1__～__2__ 小时后。\n\n新星球会改变资源、地形、敌巢、气候和昼夜。\n\n各星球的特有地形与资源也会变化。\n\n新星球有少量机会进入和平模式。
help-detail-tech-leak-formula=每轮科技失传会随机得到一个 0～__1__ 的强度 x。\n\n某项已研究科技的失传概率为 x%×该科技使用的科技瓶种类数。\n\n普通科技会被撤销。\n\n无限科技只降低一级。\n\n每个阵营每轮最多影响 __2__ 项科技。\n\n随后再乘所属阵营的倍率。\n\n[img=space-location/aquilo] 当前为×__3__。\n\n其他阵营均为×1。
help-full-world-summary=每次跃迁都会生成新的随机公共星球。\n\n世界词条、跃迁周期和科技失传都可能影响规划；\n\n精确范围与概率请悬停信息图标查看。
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]权限与防滥用[/font]
help-admin-security=购买、进入、建造、犯罪、传送和切换阵营时，代码都会重新核对玩家、阵营、角色位置、金币、体力、所有权以及目标地图是否仍然存在。\n\n远程视图不会改变角色的实际位置。\n\n太空中不能犯罪。\n\n犯罪会跳过犯罪者自己的房产和已对外开放的房产。\n\n转籍扣费失败时不会改变阵营；地球转籍死亡失败时会退还费用。
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]容量与清理[/font]
help-admin-limits=每颗星球当前最多有 __1__ 套房产。\n\n调低上限不会删除已有房产，只会阻止继续建造，避免误删玩家财产。\n\n个人关联箱的数量和允许表面可在管理页调整；\n\n房产自带的箱子不计入。\n\n降低数量上限会从最早建立的箱子开始回收。\n\n连续离线 __2__ 小时的非管理员玩家，每小时最多清理一名。\n\n玩家记录、背包、个人蓝图、账户和名下资产都会删除，只按玩家名保留科技瓶经验。\n\n公共星球跃迁会先禁止进入并撤离角色，再离开旧星球。
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]新玩家起始资源[/font]
help-admin-starter-resources=用一条 /sc 命令替换起始资源表：\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\n修改立即生效，只影响之后首次创建的玩家，不会补发或收回已有资源。\n\n每项使用物品原型名和数量。\n\n不存在的物品与非正数数量会被跳过；\n\n背包放不下的物品掉在角色脚下。\n\n设为 {} 可停止发放起始资源。\n\n恢复 config.lua 默认值：\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]管理设置的影响范围[/font]
help-admin-controls=管理页只对管理员显示。\n\n常用的经济、房产、星球、外交、科技失传和全服倍率都可以在游戏中调整。\n\n新建房产初始价格倍率只影响之后建造的房产；\n\n回收比例会立即影响尚未回收的玩家房产。\n\n各房型的尺寸、T、寿命、地貌和风险由场景配置决定。\n\n星球跃迁的最短时间、最长时间和随机偏向只用于安排下一轮，不会改动已经开始的倒计时。\n\n外交转换概率从下一次跃迁判定起生效。\n\n手动触发星球跃迁：/un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>。\n\n这条命令使用与自动跃迁相同的撤离和生成流程；\n\n已有星球正在跃迁时会拒绝执行。\n\n[font=default-bold]科技失传免疫[/font]\n\n免疫名单直接保存在 storage.tech_leak_immune_technologies。\n\n管理员用一条 /sc 覆盖完整名单即可，下一次失传判定立即使用新名单。\n\n默认示例：/sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“管理员进入本国任意房产”默认关闭。\n\n开启后只绕过本国房产的访客权限，不解除太空与外星传送限制。\n\n调整参数不会补发、追扣或重新计算已经完成的交易、房产或飞船。
