help-story-background=五颗星球曾经统一在太阳系联合国之下。\n\n太阳系联合国建立了沿用至今的统一金币体系。\n\n周期性灾变与利益分化最终撕裂了统一政权，五颗星球分别建立起相互竞争的新政体。\n\n联合国难民营和共同货币，是旧秩序留下的少数公共基础。\n\n你将出售科技瓶，积累金币和经验。\n\n建造限时房产与飞船，在不断重置的世界中留下阶段性的产业。
help-story-factions=Factorio 的 force（阵营）会分隔科技、建筑所有权、太空平台和原生聊天。\n\n同阵营玩家共享科技，并能正常使用彼此的建筑。\n\n不同阵营在引擎中互相敌对，炮塔会自动开火。同阵营也允许强制攻击。\n\n敌对关系只提供冲突的可能，并不强迫战争。\n\n玩家可以不部署攻击性武器，扮演建设者、商人和外交大使，形成事实合作。\n\n玩家也可以扮演破坏者和入侵者。\n\n本国居民独享本星球的联合国难民营，并能拥有本地房产。\n\n公共星球即将发生灾变时，居民可以通过传送低成本收摊，把关键财产和预制工厂撤入不会随公共星球重置的表面。\n\n外国居民不能使用这套本地避灾基础设施。留在公共星球上的建筑和库存仍会被清除。\n\n普通聊天在本阵营显示原文。其他阵营收到带阵营标记的转发消息。\n\n切换阵营消耗 __1__ 体力并在原地死亡。\n\n原阵营房产变为无主，原阵营飞船被摧毁，普通建筑继续留给原阵营。
help-brief-start=[font=default-bold]关联箱[/font]\n\n在 [planet=nauvis] 放置 [img=item/wooden-chest] 木箱，建立个人关联箱。\n\n[font=default-bold]金币与经验[/font]\n\n把任意科技瓶放入关联箱，或在“个人”页直接兑换主背包里的科技瓶。每瓶固定获得 [img=item/coin] 1，并累计对应科技瓶经验。\n\n[font=default-bold]低保[/font]\n\n在“个人”页手动领取。
help-brief-property=[font=default-bold]建造房产[/font]\n\n在“建造”页选择寿命和尺寸。\n\n消耗 [img=item/automation-science-pack] 自动化科技包经验与 __1__ 体力，在当前阵营建造房产。\n\n[font=default-bold]交易、回收与到期[/font]\n\n房产可以交易，也可以向好友开放。\n\n屋主可主动摧毁玩家建造的房产并换取少量金币。房产到期后自动删除。
help-brief-travel=[font=default-bold]顶层“家”按钮[/font]\n\n使用左上角 [img=virtual-signal/signal-map-marker] 按钮往返。\n\n角色会在当前所属公共星球、本星球最近到访的自有房产和联合国难民营之间移动。\n\n[font=default-bold]联合国难民营[/font]\n\n难民营不会随公共星球灾变重置，是撤离物资、保存预制工厂和重新出发的安全中转站。
help-brief-project=[img=virtual-signal/signal-info] QQ 群：293280221\n\n[img=virtual-signal/signal-info] GitHub：https://github.com/sandboxtech/solar-system-united-nations
help-section-beginner=[img=item/linked-chest] [font=default-bold]关联箱与科技瓶兑换[/font]
help-detail-linked-chest=只有在 [planet=nauvis] 手动放置木箱时，木箱才会变成个人关联箱。\n\n每名玩家最多建立一个；再次放置会回收旧箱。\n\n房产中央四个关联箱不占此上限，并与屋主的个人关联库存相通。
help-detail-science=玩家在线时，系统每 __1__ 分钟结算关联库存。\n\n“个人”页也可立即兑换主背包中的科技瓶。\n\n所有种类、所有品质的科技瓶均按每瓶 [img=item/coin] 1 出售；成功消耗的实际瓶数同时累计为对应科技瓶经验。
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]房产说明[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]经验作用公式[/font]
help-detail-experience-effects=设总等级为 L。\n\n建房会永久消耗对应科技瓶经验，可能降低 L。\n\n新飞船宽度 = __1__+L×__2__。\n\n新飞船寿命 = __3__+L 小时。\n\n作为房产卖方时，实际交易税率 = 当前基础税率 __4__%/(L/100+1)。\n\n飞船属性只在建造时确定，之后升级不追溯修改。
help-detail-property-basic=购买后，房产中央四个关联箱会连接到新屋主的个人关联库存。\n\n屋主也可购买自己的房产。\n\n系统按完整报价成交并返还税后所得，屋主实际只损失税款。\n\n屋主可以回收玩家建造的房产。确认后立即撤离所有人、销毁房内物资并删除表面。永久公共房产不能回收。\n\n房产名称只能在建造时设定，建成后不可修改；留空则使用星球、屋主和房产序号组成的默认名称。
help-detail-property-build=三档总寿命当前为 __3__/__4__/__5__ 小时，成本档为 1/3/5；三档尺寸 64×32/128×64/256×128，成本档同为 1/3/5。\n\n设两档成本乘积为 C，建造永久消耗 [img=item/automation-science-pack] 自动化科技包经验 __1__×C，并消耗 __12__ 体力；成功建造后冷却 __2__ 小时。只能在当前阵营建房。\n\n新房由建造者持有，初始 P=min(__10__, ceil(__9__×经验成本))、D=当前时刻，三档 T 当前为 __6__/__7__/__8__ 小时。\n\n每颗星球最多保留 __11__ 套房产。\n\n每颗星球另有小、中、大三套永久房产，T 均为 3 小时。交易不会延长寿命。
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]公共星球[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]房价与交易公式[/font]
help-detail-property-price=每套房产保存自己的价格周期 T。\n\n设 P 为上一笔实际成交价，D 为价格回落到 P 的时间点。\n\n当前价 = min(__1__, max(1, ceil(P × a^((D−now)/T))))。管理员设定 a，当前为 __2__。\n\n房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=每次成交后，P 改为本次成交价，D=now+T，因此即时新报价约为 aP。\n\n管理员设置基础税率，当前为 __1__%。\n\n设卖方总等级为 L，实际交易税率 = 基础税率 × 1/(L/100+1)。\n\n房主购买自己房产也属于交易，使用自己的等级计税，并正常更新 P 与 D。\n\n主动回收金币 = max(1, floor(建造时初始价格 × __2__% × 剩余寿命/总寿命))。交易价格不会改变回收基数。
help-detail-world-randomization=每轮资源以频率 __1__、大小 __2__、丰度 __3__ 为标准，各自乘 2^U(-__4__,__4__)。\n\n水域和原生自然地形各参数乘 2^U(-__5__,__5__)。\n\n悬崖间距与连续度各乘 2^U(-__6__,__6__)。\n\n敌巢频率、大小和起始安全区各乘 2^U(-__7__,__7__)。\n\n湿度和 aux 使用居中的 ±0.5 偏移。温度使用居中的 ±20 偏移。\n\n白昼占 20%～80%。夜间最低亮度为 0～0.2。和平模式概率为 __8__%。\n\n当前全局科技价格倍率为 __9__。\n\n腐败时间倍率为 __10__。小行星生成倍率为 __11__。
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]传送与复活[/font]
help-detail-travel=每颗公共星球都有独立的联合国难民营。\n\n顶层“家”按钮在本阵营公共星球、房产和难民营之间往返。\n\n进入公共星球时会在原点周围 128×128 区域随机落脚，降低敌对阵营蹲守固定入口的风险。\n\n普通死亡时，若有至少 __1__ 体力，系统自动扣除 __1__ 体力并在 __2__ 秒后复活。\n\n体力不足时不扣除，在 __3__ 秒后复活。\n\n在“阵营”页切换阵营会让角色在原地死亡，尸体和物品留在原地。\n\n本次复活前往目标阵营的难民营。\n\n切换阵营的死亡不额外收取复活体力，固定等待 __3__ 秒。
help-detail-resets=五颗公共星球独立、错峰轮换。\n\n系统提前 5 分钟预警，随后关闭进入并把玩家身体撤往联合国难民营；清图、换种和重建完成后才重新开放。\n\n每轮按权重抽取 0～5 个互不冲突的星球特色词条，并显示在“星球”页。\n\n资源等高影响词条权重更高，环境风味词条权重更低。\n\n星球重置本身不改变科技；该星球的统计归零，个人关联箱被清除后可以重新放置。
help-detail-tech-leak=每个阵营的科技每 __1__ 小时分别进行漏水判定。\n\n触发式科技不会漏水。\n\n当前研究的直接前置科技不会漏水。\n\n无限科技触发时只降低一级。
help-detail-reset-schedule=每颗公共星球独立抽取下一次重置周期。设下限为 __1__ 小时、上限为 __2__ 小时、指数为 a=__3__：\n周期 = 下限+(上限−下限)×random(0,1)^a。\n\na>1 时偏向较短周期，a=1 时均匀，0<a<1 时偏向较长周期。\n\n每轮随机地图种子、资源、地形、敌巢、气候、昼夜和少见的和平模式。\n\n[planet=nauvis] 进化度为 random(0,1)^2；各星球特有地形与资源也随原生生成控制变化。
help-detail-tech-leak-formula=科技漏水每轮共用一个强度 x，x 均匀随机于 0～__1__。\n\n某项已研究科技的失传概率为 x%×该科技使用的不重复科技瓶种类数。普通科技撤销，无限科技降低一级。
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]权限与防滥用[/font]
help-admin-security=GUI 只负责显示。\n\n购买、进入、建造、犯罪、传送和切换阵营，都会在点击时重新核对玩家、阵营、实体位置、余额、体力、所有权及 surface 是否仍存在。\n\n过期界面不能绕过判定。异步删除的房产只会返回不可用。\n\n传送与犯罪依据角色的 physical surface，而不是 remote view 所显示的 surface。\n\n犯罪在太空禁用。目标阵营由角色所在的公共星球、联合国难民营或房产决定，并跳过犯罪者自己的房产。\n\n切换阵营先扣费并建立一次性死亡记录。死亡失败会退款。\n\n这次死亡固定 60 秒，且不再触发普通快速复活扣费。
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]容量与清理[/font]
help-admin-limits=每颗星球房产软上限当前为 __1__。调低上限不会删除已有房产，只会阻止新建，避免管理设置误删玩家财产。\n\n个人关联箱限制为一个，房产中央箱不计入；房产和飞船的到期删除均先撤离玩家。\n\n连续离线 __2__ 小时的非管理员玩家，每小时最多清理一名，避免同一 tick 集中销毁大量状态。公共星球重置会先关闭进入并撤离角色，再执行异步清图。
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]动态设置边界[/font]
help-admin-controls=管理页只对管理员显示。\n\n常用经济、房产、星球、科技漏水和全局倍率可动态调整。\n\n房产寿命、T 与初始价格倍率只影响之后建造的房产；回收比例会立即影响所有尚未回收的玩家房产。\n\n星球重置周期的上下限与插值指数 a 会用于下一次抽取，不强行改写已经排定的倒计时。\n\n“管理员进入任意房产”默认关闭。只有显式开启时，管理员才会绕过访客权限。\n\n调整参数不会补发、追扣或重算既有玩家交易与既有飞船属性。
