property-salvage-tooltip=角色必须亲自站在自己的房产里。\n\n回收会立即销毁房产，并按剩余寿命和当前面积返还 __1__% 的建造经验。\n\n当前返还 __2__ __3__ 点经验。
property-salvage-rule-tooltip=只有屋主亲自站在房产内才能回收。\n\n返还经验按剩余寿命和当前面积计算，返还比例为 __1__%。\n\n永久公共房产不能回收。
property-salvage-confirm-tooltip=再次点击将立即撤离所有人、销毁房内全部物资并删除这张房产地图。\n\n确认返还 __1__ __2__ 点经验。
