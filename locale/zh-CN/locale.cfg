scenario-name=太阳系联合国
description=\n[font=default-large-bold]太阳系联合国[/font]\n\n五个阵营在不断跃迁的公共星球上重新开拓。\n\n生产科技瓶、积累个人经验，再建立能够延续产业的限时房产。\n\n[img=virtual-signal/signal-map-marker] 前往本国星球  →  [img=item/linked-chest] 用机械臂把科技瓶换成经验  →  [img=item/construction-robot] 建造或购买第一套房产\n\n不必先读完规则。\n\n像普通游戏一样开始建设，留意跃迁倒计时，并逐步把重要物资送入难民营或房产。\n\n项目：https://github.com/sandboxtech/solar-system-united-nations\nQQ 群：293280221

