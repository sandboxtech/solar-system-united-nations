faction-page-tooltip=普通地图是否隐藏由管理员设置。\n\n当前对外国阵营隐藏：__3__。\n\n当前对本国阵营隐藏：__4__。\n\n太空平台是否可见仍由船主决定。\n\n友好国家额外共享已经探索的视野并停火。\n\n敌对国家不共享探索视野，防御塔可能向外国玩家开火。\n\n国家研究 [img=technology/space-platform-thruster] 太空平台推进器后，外交关系可能随本国星球跃迁而改变。\n\n友好转为敌对的概率为 __1__%。\n\n敌对转为友好的概率为 __2__%。\n\n[img=space-location/aquilo] 冰星技术官僚学院永久中立。
