faction-page-tooltip=国家关系只有“友好”和“敌对”两种。\n\n友好国家共享视野，可以使用彼此的建筑，炮塔不会自动攻击。\n\n敌对国家停止共享新视野，炮塔可以攻击。\n\n一个国家研究 [img=technology/space-platform-thruster] 太空平台推进器后，每当本国公共星球完成重置，都会在“对其余四国全部友好”和“对其余四国全部敌对”之间切换。\n\n切换阵营会让角色在原地死亡。加入 [planet=nauvis] 地球帝国免费；加入其他阵营消耗 __1__ 体力。\n\n原阵营房产会变为无主。\n\n原阵营飞船会被摧毁。\n\n本次复活固定等待 __2__ 秒，损失均不补偿。
