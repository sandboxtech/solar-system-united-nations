property-expand=扩建当前房产
property-expand-confirm=确认升至 __1__ 级（__2__×__3__）— __4__ 经验，__5__ 体力
property-expand-tooltip=只有屋主亲自站在房产内才能扩建。\n\n本次从建造等级 __7__ 提升到 __8__；地图尺寸变为 __1__×__2__，总寿命和降价周期也按新等级更新。\n\n经验费按相邻两级的建房经验差额计算。\n\n本次消耗 __3__ __4__ __5__ 点经验和 __6__ 体力。
property-expand-rule-tooltip=只有屋主亲自站在房产内才能扩建。\n\n每次提升一级；玩家总等级必须达到目标等级。\n\n地图尺寸、总寿命和降价周期会按新等级更新。\n\n经验费为相邻两级建房经验差额的 __1__ 倍，另消耗 __2__ 点体力。\n\n永久公共房产和不支持扩建的房型不能扩建。
property-expand-unavailable=永久公共房产或这种房型不能扩建。
