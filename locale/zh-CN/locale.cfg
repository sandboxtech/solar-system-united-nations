help-mode-full=完整说明
help-brief-start=在 [planet=nauvis] 放置木箱建立个人关联箱；把科技瓶放进去，系统会把它们兑换为 [img=item/coin] 金币并累计对应经验。低保在“个人”页手动领取。
help-brief-property=在“建造”页选择星球、寿命和尺寸，消耗该星球特产科技瓶经验建房。玩家房产到期自动删除；每颗星球另有四套永久基准房。
help-brief-travel=左上角地图标记按钮在当前公共星球、该星球的家和联合国难民营之间往返。
help-section-beginner=新手说明：关联箱与金币
help-detail-ubi=每位玩家首次建立账户时获得 [img=item/coin] __4__ 初始金币。低保按游戏时间懒计算，每秒积累 [img=item/coin] __1__；在线和离线都积累。最多保存 __2__ 小时，即 [img=item/coin] __3__，必须在“个人”页手动领取。
help-detail-linked-chest=只有在 [planet=nauvis] 手动放置木箱时，木箱才会变成个人关联箱。每名玩家最多建立一个；再次放置会回收旧箱。房产中央四个关联箱不占此上限，并与屋主的个人关联库存相通。
help-detail-science=玩家在线时，系统每 __1__ 分钟消耗关联库存中的科技瓶并发放金币。普通、优良、稀有、史诗、传说品质倍率依次为 __2__、__3__、__4__、__5__、__6__；成功消耗的数量同时累计为对应科技瓶经验。
help-detail-experience=每种科技瓶独立累计经验 E。E=0 时等级为 0；E>0 时，等级 L=floor(log10(E))+1，也就是 E 的十进制位数。总等级是全部科技瓶等级之和，经验和等级均无上限。
help-detail-experience-effects=设总等级为 L。经验有四个作用：支付房产建造成本；新建飞船宽度 = __1__ + L×__2__；新建飞船寿命 = __3__ + L 小时；作为房产卖方时，实际交易税率 = 管理员基础税率（当前 __4__%）/(L/100+1)。建房会永久扣除对应科技瓶经验，可能降低总等级；飞船属性只在建造时确定。
help-detail-property-heading=房产说明
help-detail-property-basic=房产列表中的“购买”和“进入”是独立操作。购买后，房产中央四个关联箱会连接到新屋主的个人关联库存。屋主、管理员、双向好友及公开房产的访客可以进入。屋主也可购买自己的房产：按完整报价成交并收回税后所得，实际只损失税款。
help-detail-property-build=玩家选择寿命 30/120/480 小时（成本 1/3/5）和尺寸 64×32/128×64/256×128（成本 1/3/5），总成本为 __1__×寿命成本×尺寸成本个所属星球科技瓶经验。对应价格周期 T 为 3/12/48 小时。每颗星球还有三套永久 64×32（T=3 小时）和一套永久 128×64（T=12 小时）基准房。玩家房产的寿命从建成时开始，交易不延长。
help-detail-growth-heading=经验说明
help-detail-world-heading=公共星球说明
help-detail-formulas-heading=精确公式、阈值与服务器规则
help-detail-property-price=每套房产保存自己的价格周期 T。设 P 为上一笔实际成交价，D 为价格回落到 P 的时间点。当前价 = min(__1__, max(1, ceil(P × a^((D−now)/T))))，管理员设定 a，当前为 __2__。房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=每次成交后，P 改为本次成交价，D=now+T，因此即时新报价约为 aP。管理员设置基础税率，当前为 __1__%。设卖方总等级为 L，实际交易税率 = 基础税率 × 1/(L/100+1)。房主购买自己房产也属于交易，使用自己的等级计税，并正常更新 P 与 D。
help-detail-world-randomization=每轮资源以频率 __1__、大小 __2__、丰度 __3__ 为标准，各自乘 2^U(-__4__,__4__)；水域和原生自然地形各参数乘 2^U(-__5__,__5__)；悬崖间距与连续度各乘 2^U(-__6__,__6__)；敌巢频率、大小和起始安全区各乘 2^U(-__7__,__7__)。湿度和 aux 使用居中的 ±0.5 偏移，温度使用居中的 ±20 偏移；白昼占 20%～80%，夜间最低亮度为 0～0.2，和平模式概率 __8__%。全局科技价格倍率 __9__、腐败时间倍率 __10__、小行星生成倍率 __11__，均可由管理员即时修改。
help-detail-cooperation-heading=好友与转账
help-detail-friends=每名玩家最多添加 __1__ 名好友。好友是单向记录；双方互相添加后可以进入对方房产。持有至少一套房产时，屋主可以在“房产”页把自己的全部房产对所有玩家开放。访客不能管理产权。
help-detail-transfer=金币转账直接成交，无需对方确认。每次至少转 [img=item/coin] __1__；手续费为 max([img=item/coin] __3__, ceil(金额×__2__%))，从收款人的所得中扣除并由系统回收，付款人只支付转账金额。
help-detail-ship-heading=飞船与传送
help-detail-ship=每名玩家最多一艘飞船，只能在 [planet=nauvis] 建造，费用 [img=item/coin] __1__。新建飞船寿命 = __2__ + 总等级（小时），宽度 = __3__ + 总等级×__4__，地图高度为 __5__；建成后获得的新等级不会改变现有飞船。
help-detail-travel=每颗公共星球都有独立的联合国难民营。顶层“家”按钮只根据角色身体所在表面判断：在公共星球时前往该星球最近到访且仍自有的房产，没有家则前往该星球难民营；在房产或难民营时返回对应公共星球原点。remote view 不改变这个判断。五个自杀按钮分别锁定本次复活到对应星球的难民营；角色仍在原地死亡，物品随尸体留在原地。
help-detail-resets=五颗公共星球独立、错峰轮换。系统提前 30、5、1 分钟预警，随后关闭进入并把玩家身体撤往联合国难民营；清图、换种和重建完成后才重新开放。科技保持不变，该星球的生产、流体、击杀和建造统计归零；个人关联箱被清除后可以重新放置。
help-detail-reset-schedule=每颗公共星球在每轮完成时独立抽取下一次重置周期：1+4×random(0,1)^2 小时，即 1～5 小时且偏向较短周期。每轮随机地图种子、资源、水域与自然地形、悬崖、敌巢与安全区、气候、昼夜比例、夜间亮度及少见的和平模式；[planet=nauvis] 进化度为 random(0,1)^2，各星球特有地形与资源也随原生生成控制变化。连续离线 __1__ 小时的非管理员玩家每小时最多清理一名，其长期数据一并清理。
help-detail-commands-heading=命令行功能
help-detail-command-transfer=/un-transfer <玩家名> <金额>：直接转账；每笔最少 1000 金币，另收 0.1% 且最低 100 金币手续费。
help-detail-command-rename=/un-property rename <名称>：屋主身体位于自己的房产内时重命名该房产。
