scenario-name=太阳系联合国
description=\n[font=default-large-bold]太阳系联合国[/font]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你要做什么[/font]\n公共星球会周期性灾变重建。生产科技瓶，换取金币与经验；再建造或购买不会随公共星球重置的房产，把工厂、物资和预制产线保存下来。\n\n[img=item/linked-chest] [font=default-large-bold]第一步：建立个人关联箱[/font]\n在自己阵营所属的公共星球上，手动放置木箱。木箱会变成个人关联箱。关联箱不能手动打开，需要用机械臂投入科技瓶。所有科技瓶每瓶固定获得 [img=item/coin] 1 金币，并累计对应经验。\n\n[img=item/construction-robot] [font=default-large-bold]第二步：建造房产[/font]\n所有阵营都使用 [img=item/automation-science-pack] 自动化科技包经验建房。寿命越长、面积越大，需要的经验越多；每次还要消耗 50000 体力。\n\n小房成本低、容易周转；大房空间充足，适合保存完整工厂。所有尺寸的房产中央都固定有四个关联箱。\n\n[img=space-location/nauvis] [font=default-large-bold]第三步：在灾变之间经营[/font]\n五颗公共星球每轮获得 0～5 个随机特色词条。重建会清除星球建筑和物资，但保留科技；联合国难民营和私人房产不会随公共星球一起重置。使用左上角“家”按钮往返。\n\n[img=item/space-platform-starter-pack] 总等级会扩大新飞船、延长寿命，并降低卖房税率。你还可以加入其他阵营、结交好友、交易房产、直接转账或发动犯罪。\n\n进入场景后，点击左上角菜单查看完整说明。\n\n项目 https://github.com/sandboxtech/solar-system-united-nations\nQQ 群 293280221

