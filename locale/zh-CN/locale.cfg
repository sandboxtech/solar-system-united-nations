property-page-tooltip=小房成本低、容易周转；大房空间充足，适合保存完整工厂。所有尺寸中央都固定有四个关联箱。\n\n“购买”和“进入”是两个不同操作。屋主也能购买自己的房产，此时只会实际损失税款，并重新开始本轮降价。\n\n角色亲自站在自己的房产里时，可使用页面顶部的“回收当前房产”；确认后房内物资全部销毁。\n\n房产名称在建造时确定，建成后不可修改。
