crime-button-tooltip=每次消耗 [img=item/coin] __1__ 和 __2__ 体力。\n\n成功或失败都不退还。\n\n系统根据角色所在的公共星球、联合国难民营或房产，等概率抽取对应阵营的一套有主房产。\n\n抽取会跳过犯罪者自己以及已对外开放的房产。\n\n设目标当前报价为 Q。\n\n成功率 = 1/(1+Q/__3__)。\n\n成功后直接进入。判定结果全服通知。\n\n太空中不能犯罪。
