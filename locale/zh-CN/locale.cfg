help-brief-start=在 [planet=nauvis] 放置 [img=item/wooden-chest] 木箱，建立个人关联箱。\n\n把任意科技瓶放进去：每瓶固定获得 [img=item/coin] 1，并累计对应经验。\n\n低保在“个人”页领取。
help-brief-property=在“建造”页选择星球、寿命和尺寸，消耗对应科技瓶经验与 __1__ 体力。\n\n房产可以交易、向好友开放；玩家房产到期自动删除。
help-brief-travel=左上角 [virtual-signal=signal-map-marker] 按钮用于往返。\n\n角色会在当前所属星球、该星球的家和联合国难民营之间移动。
help-brief-crime=在“犯罪”页花费 [img=item/coin] __1__ 和 __2__ 体力，尝试闯入当前所属星球的一套有主房产。太空中不能犯罪。
help-brief-project=QQ 群：293280221\n\nGitHub：https://github.com/sandboxtech/solar-system-united-nations
help-section-beginner=[img=item/coin] 金币、低保与关联箱
help-detail-ubi=每位玩家首次建立账户时获得 [img=item/coin] __4__ 初始金币。\n\n低保按游戏时间懒计算，每秒积累 [img=item/coin] __1__；在线和离线都积累。\n\n最多保存 __2__ 小时，即 [img=item/coin] __3__，必须在“个人”页手动领取。
help-detail-starter=新玩家首次进入时获得铁板、铜板、石和木材。\n\n“个人”页可消耗 __1__ 体力购买模块装甲、个人机器人指令模块、6 块太阳能板和 5 台建设机器人。
help-detail-linked-chest=只有在 [planet=nauvis] 手动放置木箱时，木箱才会变成个人关联箱。\n\n每名玩家最多建立一个；再次放置会回收旧箱。\n\n房产中央四个关联箱不占此上限，并与屋主的个人关联库存相通。
help-detail-science=玩家在线时，系统每 __1__ 分钟结算关联库存。\n\n所有种类、所有品质的科技瓶均按每瓶 [img=item/coin] 1 出售；成功消耗的实际瓶数同时累计为对应科技瓶经验。
help-detail-experience=每种科技瓶独立累计经验 E。\n\nE=0 时等级为 0；E>0 时，等级 L=floor(log10(E))+1，也就是 E 的十进制位数。\n\n总等级是全部科技瓶等级之和，经验和等级均无上限。
help-detail-experience-effects=设总等级为 L。\n\n经验可以支付房产建造成本。\n\n新建飞船宽度 = __1__ + L×__2__；新建飞船寿命 = __3__ + L 小时。\n\n作为房产卖方时，实际交易税率 = 管理员基础税率（当前 __4__%）/(L/100+1)。\n\n建房会永久扣除对应科技瓶经验，可能降低总等级；飞船属性只在建造时确定。
help-detail-property-heading=[img=item/construction-robot] 房产说明
help-detail-property-basic=购买后，房产中央四个关联箱会连接到新屋主的个人关联库存。\n\n屋主、管理员、双向好友及公开房产的访客可以进入。\n\n屋主也可购买自己的房产：按完整报价成交并收回税后所得，实际只损失税款。
help-detail-property-build=三档总寿命当前为 __3__/__4__/__5__ 小时，成本档为 1/3/5；三档尺寸 64×32/128×64/256×128，成本档同为 1/3/5。\n\n设两档成本乘积为 C，建造永久消耗所属星球科技瓶经验 __1__×C，并消耗 __12__ 体力；成功建造后冷却 __2__ 小时。\n\n新房由建造者持有，初始 P=min(__10__, ceil(__9__×经验成本))、D=当前时刻，三档 T 当前为 __6__/__7__/__8__ 小时。\n\n每颗星球最多保留 __11__ 套房产；这是软上限，管理员调低时不会删除已有房产。\n\n每颗星球另有三套永久小房（T=3 小时）和一套永久中房（T=12 小时）。交易不会延长寿命。
help-detail-growth-heading=[img=item/space-science-pack] 经验与等级
help-detail-world-heading=[planet=nauvis] 公共星球
help-detail-formulas-heading=[virtual-signal=signal-info] 精确公式、阈值与服务器规则
help-detail-property-price=每套房产保存自己的价格周期 T。\n\n设 P 为上一笔实际成交价，D 为价格回落到 P 的时间点。\n\n当前价 = min(__1__, max(1, ceil(P × a^((D−now)/T))))。管理员设定 a，当前为 __2__。\n\n房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=每次成交后，P 改为本次成交价，D=now+T，因此即时新报价约为 aP。\n\n管理员设置基础税率，当前为 __1__%。\n\n设卖方总等级为 L，实际交易税率 = 基础税率 × 1/(L/100+1)。\n\n房主购买自己房产也属于交易，使用自己的等级计税，并正常更新 P 与 D。
help-detail-crime=每次犯罪消耗 [img=item/coin] __1__ 和 __2__ 体力，不论成功或失败都不退还。\n\n系统从玩家当前所属星球的全部有主房产中等概率抽取一套。设其当前报价为 Q，成功率 = 1/(1+Q/__3__)。成功后直接进入目标房产；结果和成功率全服通知。太空平台上不能犯罪。
help-detail-world-randomization=每轮资源以频率 __1__、大小 __2__、丰度 __3__ 为标准，各自乘 2^U(-__4__,__4__)。\n\n水域和原生自然地形各参数乘 2^U(-__5__,__5__)；悬崖间距与连续度各乘 2^U(-__6__,__6__)；敌巢频率、大小和起始安全区各乘 2^U(-__7__,__7__)。\n\n湿度和 aux 使用居中的 ±0.5 偏移，温度使用居中的 ±20 偏移；白昼占 20%～80%，夜间最低亮度为 0～0.2，和平模式概率 __8__%。\n\n全局科技价格倍率 __9__、腐败时间倍率 __10__、小行星生成倍率 __11__，均可由管理员即时修改。
help-detail-cooperation-heading=[img=entity/character] 好友与转账
help-detail-friends=每名玩家最多添加 __1__ 名好友。好友是单向记录。\n\n双方互相添加后，可以进入对方房产。\n\n持有至少一套房产时，屋主可以在“房产”页把自己的全部房产对所有玩家开放。
help-detail-transfer=金币转账直接成交，无需对方确认。\n\n每次至少转 [img=item/coin] __1__；手续费为 max([img=item/coin] __3__, ceil(金额×__2__%))。\n\n手续费从收款人的所得中扣除并由系统回收，付款人只支付转账金额。
help-detail-ship-heading=[img=item/space-platform-starter-pack] 飞船与传送
help-detail-ship=每名玩家最多一艘飞船，建造消耗 __1__ 体力。玩家可在任何地点选择五颗公共星球中的任意轨道建造。\n\n新建飞船寿命 = __2__ + 总等级（小时）。\n\n宽度 = __3__ + 总等级×__4__，地图高度为 __5__；建成后获得的新等级不会改变现有飞船。
help-detail-travel=每颗公共星球都有独立的联合国难民营。\n\n顶层“家”按钮只根据角色身体所在表面判断：在公共星球时前往该星球最近到访且仍自有的房产，没有家则前往难民营；在房产或难民营时返回公共星球原点。\n\nremote view 不改变这个判断。\n\n五个自杀按钮分别锁定本次复活到对应星球的难民营；角色仍在原地死亡，物品随尸体留在原地。
help-detail-resets=五颗公共星球独立、错峰轮换。\n\n系统提前 5 分钟预警，随后关闭进入并把玩家身体撤往联合国难民营；清图、换种和重建完成后才重新开放。\n\n每轮另抽取 3 个星球特色词条并显示在“星球”页。\n\n星球重置本身不改变科技；该星球的统计归零，个人关联箱被清除后可以重新放置。
help-detail-tech-leak=全服科技每 __1__ 小时进行一次独立漏水判定。触发式科技和当前研究的直接前置科技不会漏水；无限科技触发时只降低一级。
help-detail-reset-schedule=每颗公共星球在每轮完成时独立抽取下一次重置周期：1+4×random(0,1)^2 小时，即 1～5 小时且偏向较短周期。\n\n每轮随机地图种子、资源、地形、敌巢、气候、昼夜和少见的和平模式。\n\n[planet=nauvis] 进化度为 random(0,1)^2；各星球特有地形与资源也随原生生成控制变化。\n\n连续离线 __1__ 小时的非管理员玩家每小时最多清理一名，其长期数据一并清理。
help-detail-tech-leak-formula=科技漏水每轮共用一个强度 x，x 均匀随机于 0～__1__。\n\n某项已研究科技的失传概率为 x%×该科技使用的不重复科技瓶种类数。普通科技撤销，无限科技降低一级。
