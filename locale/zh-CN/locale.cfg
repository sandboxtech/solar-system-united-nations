help-section-beginner=新手说明：关联箱与信用
help-detail-ubi=每位玩家首次建立账户时获得 __4__ 初始信用。低保按游戏时间懒计算，每秒积累 __1__ 信用；在线和离线都积累。最多保存 __2__ 小时，即 __3__ 信用，必须在“个人”页手动领取。
help-detail-linked-chest=只有在 [planet=nauvis] 手动放置木箱时，木箱才会变成个人关联箱。每名玩家最多建立一个；再次放置会回收旧箱。房产中央四个关联箱不占此上限，并与屋主的个人关联库存相通。
help-detail-science=玩家在线时，系统每 __1__ 分钟消耗关联库存中的科技瓶并发放信用。普通、优良、稀有、史诗、传说品质倍率依次为 __2__、__3__、__4__、__5__、__6__；成功消耗的数量同时累计为对应科技瓶经验。
help-detail-experience=每种科技瓶独立累计经验 E。E=0 时等级为 0；E>0 时，等级 L=floor(log10(E))+1，也就是 E 的十进制位数。总等级是全部科技瓶等级之和，经验和等级均无上限。
help-detail-property-heading=房产说明
help-detail-property-basic=房产列表中的“购买/续期”和“进入”是独立操作。购买后，房产中央四个关联箱会连接到新屋主的个人关联库存。屋主、管理员、双向好友及公开房产的访客可以进入；访客不能续期或管理产权。
help-detail-growth-heading=经验说明
help-detail-world-heading=公共星球说明
help-detail-formulas-heading=精确公式、阈值与服务器规则
help-detail-property-price=设 P 为上一笔实际成交价，D 为价格回落到 P 的时间点，T=__1__ 小时。当前价 = min(__2__, max(1, ceil(P × 10^((D−now)/T))))。房产没有保护期，任何时候都可以再次购买。
help-detail-property-trade=成交后，P 改为本次成交价，D=now+__2__ 小时，因此刚成交后的报价约为 10P。买方支付全部成交价，卖方获得扣除 __1__% 税款后的金额。屋主每次续期支付 ceil(当前市场价×__1__%)（最低 1），并令 D 增加 __2__ 小时；D 最多延长到 now+__3__ 小时。
help-detail-property-generation=新房初始价格在 __1__～__2__ 信用之间；长和宽分别随机取 32、64、128。地形从 [planet=nauvis] 或 [planet=gleba] 的远方自然样本复制。所有房产与 [planet=nauvis] 同步昼夜，太阳能效率固定为 10%，夜间最低亮度固定为 __3__。
help-detail-property-supply=市场每 __1__ 小时评估一次。活跃玩家统计最近 __2__ 小时上线者，目标房产数为 max(__3__, 活跃玩家×__4__)。房产少于目标、空置率低于 __8__%，或中位价高于 __9__ 时倾向增加；房产多于目标、空置率高于 __10__% 且中位价低于 __11__ 时倾向减少。条件连续满足 __5__ 次后，每次只有 __6__% 概率增减一套；淘汰只选择无主、无人占用且至少 __7__ 小时未交易的房产。
help-detail-cooperation-heading=好友与转账
help-detail-friends=每名玩家最多添加 __1__ 名好友。好友是单向记录；双方互相添加后可以进入对方房产。持有至少一套房产时，屋主可以在“房产”页把自己的全部房产对所有玩家开放。访客不能替屋主续期或管理产权。
help-detail-transfer=信用转账直接成交，无需对方确认，没有玩法限额。服务端仍会校验收款玩家、正整数金额和付款方余额，并为双方记录流水。
help-detail-ship-heading=飞船与传送
help-detail-ship=每名玩家最多一艘飞船，只能在 [planet=nauvis] 建造，费用 __1__ 信用，寿命 __2__ 小时。新建飞船宽度 = __3__ + 总等级×__4__，地图高度为 __5__；建成后获得的新等级不会自动扩宽现有飞船。
help-detail-travel=公共星球、联合国避难所和房产之间可以传送。前往 [planet=nauvis] 时优先抵达个人关联箱附近；最近房产失效或已易主时改去避难所。其他类型表面不能发起这些传送。
help-detail-resets=五颗公共星球独立、错峰轮换。系统提前 30、5、1 分钟预警，随后关闭进入并把玩家身体撤往避难所；清图、换种和重建完成后才重新开放。科技保持不变，该星球的生产、流体、击杀和建造统计归零；个人关联箱被清除后可以重新放置。
help-detail-reset-schedule=公共星球周期：[planet=nauvis] __1__ 小时、[planet=vulcanus] __2__ 小时、[planet=gleba] __3__ 小时、[planet=fulgora] __4__ 小时、[planet=aquilo] __5__ 小时。每轮随机地图种子、太阳能倍率与昼夜长度；[planet=nauvis] 另随机虫群进化度。连续离线 __6__ 小时的非管理员玩家每小时最多清理一名，其房产变为空置，个人箱、飞船、好友引用、信用、经验和流水一并清理。
help-detail-commands-heading=命令行功能
help-detail-command-friend=/un-friend add <玩家名>、remove <玩家名>、list：添加、移除或列出好友。
help-detail-command-transfer=/un-transfer <玩家名> <正整数金额>：直接向玩家转账信用。
