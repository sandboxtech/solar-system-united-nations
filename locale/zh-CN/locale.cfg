property-access-tooltip=此开关同时控制你拥有的全部房产。\n\n关闭时，只有屋主与本国的双向好友可以进入。\n\n开启时，本国所有玩家都可以进入。\n\n外国玩家仍然不能进入。
property-page-tooltip=不同科技瓶会建成尺寸、寿命、地貌或安全性不同的房产。\n\n建造时选择的房型和等级会永久记录。\n\n每套房产入口都有四个关联箱和四个可旋转的超速装卸机。\n\n房产名称建成后不可修改。
property-faction-survival-tooltip=只有当前阵营对应的公共星球是你的本国星球。\n\n其余公共星球都是外星。\n\n你可以查看外星房产市场，但不能正常购买或进入外星房产。\n\n当前外国角色清除时间为跃迁前 __1__ 分钟和 __2__ 分钟。\n\n非零时间点会发出全服警报，并杀死滞留的外国角色。\n\n角色随后会在本国难民营复活。\n\n留在旧星球的尸体和物资不会抵达新星球。
