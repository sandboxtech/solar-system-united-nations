property-renew-confirm=确认续期 — __1__ 经验，__2__ 体力
property-renew-tooltip=只有屋主亲自站在房产内才能续期。\n\n续期会把剩余寿命补回建造时的完整寿命（__5__ 小时），不会额外叠加一整期。\n\n经验和体力根据缺少的寿命与当前面积计算；体力另收 1000 点固定费用。\n\n本次消耗 __1__ __2__ __3__ 点经验和 __4__ 体力。
property-renew-rule-tooltip=只有屋主亲自站在房产内才能续期。\n\n续期会把剩余寿命补回建造时的完整寿命，不会额外叠加一整期。\n\n经验和体力根据缺少的寿命与当前面积计算；体力另收 1000 点固定费用。\n\n永久公共房产不能续期。
