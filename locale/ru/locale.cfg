planet-page-note=Обратный отсчет использует игровое время. \n\n «Сдвиг» появляется на короткое время после отправления; \n\nпункт назначения открывается, как только новый мир готов. \n\nКаждый цикл выдает 0–5 взаимно совместимых взвешенных значений. черты.\n\nРесурсы, враги и черты, изменяющие правила, встречаются чаще;\n\nОкружающая среда встречается реже.\n\nКаждый перечисленный эффект складывается поверх существующих рандомизированных настроек карты этого цикла.
