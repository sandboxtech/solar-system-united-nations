credit-insufficient=Вам не хватает монет.
coin-tooltip=Монеты — общая валюта всех пяти фракций.\n\nПолучайте базовый доход и переводы, продавайте или утилизируйте владения.\n\nПокупка владений, комиссии за переводы и преступления выводят часть монет из обращения.
dropoff-created-count=Личный связанный сундук активен (__1__/__2__). Открыть вручную нельзя; используйте манипуляторы.
dropoff-refund-spilled=Ваш возвращенный связанный сундук упал на землю, потому что ваш инвентарь был полон.
dropoff-replaced=Предыдущий личный связанный сундук удалён и возвращён как деревянный сундук.
dropoff-space-forbidden=Персональные связанные сундуки нельзя размещать на космических платформах. Товар был возвращен.
dropoff-placement-forbidden=Здесь нельзя разместить личные связанные сундуки. Товар был возвращен.
dropoff-limit-disabled=Лимит личного связанного сундука в настоящее время равен 0. Предмет был возвращен.
science-converted-notification=Наука преобразована: __1__ опыта
roboport-limit-ports=[img=entity/roboport] Строительство отклонено: в подключённой логистической сети стало бы __1__ робопортов при лимите __2__. Новый робопорт удалён.
roboport-limit-robots=[img=entity/logistic-robot] Строительство отклонено: в подключённой логистической сети __1__ логистических роботов при лимите __2__. Новый робопорт удалён.
roboport-limit-both=[img=entity/roboport] Строительство отклонено: в подключённой логистической сети стало бы __1__ робопортов (лимит __2__) и __3__ логистических роботов (лимит __4__). Новый робопорт удалён.
