property-renew-tooltip=Only the owner may renew while physically inside the property.\n\nRenewal restores the remaining life to its full original lifetime (__5__ hours); it does not add another full term.\n\nExperience and stamina costs follow the missing lifetime and current area, with an additional fixed cost of 1000 stamina.\n\nCurrent cost: __1__ __2__ __3__ experience and __4__ stamina.
property-renew-rule-tooltip=Only the owner may renew while physically inside the property.\n\nRenewal restores the remaining life to its full original lifetime; it does not add another full term.\n\nExperience and stamina costs follow the missing lifetime and current area, with an additional fixed cost of 1000 stamina.\n\nPermanent public property cannot be renewed.
property-renew-unavailable=Обновлять можно только временное имущество, построенное игроком.
property-renew-full=Это свойство уже имеет полный срок эксплуатации и не нуждается в обновлении.
property-renewed-broadcast=__5__ [img=entity/character] __1__ обновил __2__, потратив опыт __3__ и выносливость __4__.
property-expand=Расширить текущую недвижимость
property-expand-confirm=Подтвердить уровень __1__ (__2__×__3__) — опыт __4__, выносливость __5__
property-expand-tooltip=Only the owner may expand while physically inside the property.\n\nThis expansion raises construction level __7__ to __8__. Map dimensions become __1__×__2__, while total lifetime and price-decay period update to the new level.\n\nThe experience cost follows the build-experience difference between the two levels.\n\nCurrent cost: __3__ __4__ __5__ experience and __6__ stamina.
property-expand-rule-tooltip=Only the owner may expand while physically inside the property.\n\nEach expansion raises the property by one level; your total level must reach the target level.\n\nMap dimensions, total lifetime, and price-decay period update to the new level.\n\nExperience costs __1__ times the build-experience difference between the two levels, plus __2__ stamina.\n\nPermanent public property and property types that do not support expansion cannot be expanded.
property-expand-unavailable=Постоянная общественная собственность и этот тип собственности не может быть расширен.
property-expand-level-required=Ваш текущий общий уровень должен превышать уровень строительства объекта, прежде чем его можно будет улучшить.
property-expanded-broadcast=__7__ [img=entity/character] __1__ расширил __2__ до __3__×__4__, потратив опыт __5__ и выносливость __6__.
property-manage-not-owner=Это может сделать только текущий владелец.
property-manage-not-inside=Встаньте внутри объекта, который вы хотите обновить или расширить.
property-manage-cost-changed=Оставшаяся жизнь изменила стоимость опыта. Просмотрите и подтвердите еще раз.
scheduler-error=Не удалось выполнить запланированное задание Организации Объединенных Наций Солнца (тикает __1__). \n\nСм. Factorio-current.log.
planet-reset-warning=__1__ перейдёт через __2__ мин. Заранее вывезите важные запасы.
planet-reset-finished=__1__ прибыла в новый мир.
planet-reset-closed=__1__ переходит.\n\nВы перемещены в лагерь беженцев ООН.
planet-reset-foreign-death=__1__ скоро перейдёт. Это чужая территория, поэтому персонаж погиб и возродится в лагере __2__. Оставшиеся в прежнем мире запасы не попадут в новый.
planet-reset-failed=__1__ не смогла начать переход. Система повторит попытку через минуту; подробности в журнале.
planet-reset-command-help=Немедленно активировать смену для одной общедоступной планеты.\n\nТолько для администраторов.
planet-reset-command-usage=Использование: /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>
planet-reset-command-started=A manual shift was requested for __1__. Evacuation, randomization, and new-world generation use the normal path.
planet-reset-command-busy=__1__ is already shifting. The request was rejected because shifts run one at a time.
planet-reset-command-failed=Не удалось вызвать сдвиг для __1__.\n\nПодробности см. в журнале.
