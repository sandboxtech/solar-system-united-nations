help-foreign-survival=[font=default-bold]Home territory and foreign planets[/font]\n\nOnly your faction's corresponding public planet is home territory.\n\nIts citizens may evacuate to their United Nations Refugee Camp during a shift.\n\nEvery other public planet is foreign.\n\nForeign characters still there shortly before a shift are killed and respawn at their home camp.\n\nForeign property markets are visible but read only.
help-story-background=The five planets were once united under the United Nations of Sol and shared one currency.\n\nRecurring catastrophes and diverging interests ultimately fractured that government into five independent factions.\n\nUnited Nations Refugee Camps and the common coin are among the few foundations left by the old order.\n\nToday, countries may open their borders and build together—or close their vision and go to war.
help-story-factions=Your faction determines your home planet, research progress, and asset ownership.\n\nYour home camp and property are the most reliable evacuation points during a planetary shift.
help-story-factions-detail=New players begin in the [img=space-location/nauvis] People's Republic of Nauvis.\n\nEach country has separate research, buildings, property, and space platforms.\n\nYou may normally build, buy, and enter property only in your own country;\n\nforeign property markets are for viewing only.\n\nCitizens may move supplies into their home camp and property before a shift.\n\nForeign players cannot use those sites to evacuate local supplies.
help-story-foreign=Foreign resources reward expeditions, but foreign public planets shift too.\n\nBuild a [img=item/rocket-silo] rocket silo early, launch ores and products to an orbital platform, and carry them home.
help-story-foreign-detail=Treat foreign bases as temporary outposts.\n\nYou cannot use a foreign camp or property to evacuate supplies.\n\nWhen the evacuation warning sounds, move supplies through rockets and orbital platforms.\n\nYou respawn at your home camp after death.\n\nYour corpse and carried items remain behind.
help-story-diplomacy=Ordinary surfaces are visible to all five countries by default; administrators may hide them from the home or foreign factions separately.\n\nFriendly countries share explored chart data and observe a ceasefire.\n\nHostile countries do not share chart data, and their defences may fire on foreign players.
help-story-diplomacy-detail=Buildings remain separately owned;\n\nfriendly relations do not automatically grant allies control of them.\n\nRegardless of diplomacy, you cannot deconstruct another country's buildings with a planner.\n\nAfter an ordinary country researches [img=technology/space-platform-thruster] Space platform thruster, its diplomacy may change during a planetary shift.\n\nThe [img=space-location/aquilo] Aquilo Technocratic Academy remains permanently neutral and friendly with every country.
help-story-faction-switch=Switching factions forfeits your old property, ship, and personal linked chests.\n\nLeave your affairs in order.
help-story-faction-switch-detail=Switching factions kills your character in place.\n\nIts corpse and carried items remain behind.\n\nProperty in your old faction becomes unowned.\n\nYour ship and personal linked chests are destroyed.\n\nOrdinary buildings remain owned by the old faction.
help-advanced-travel-summary=Public planets shift periodically.\n\nYour home camp and property provide stable footholds;\n\nthe two top-left travel buttons handle the public planet and your own properties.
help-advanced-linked-summary=Your personal linked chest converts science packs into experience.\n\nA property's four built-in chests share its owner's inventory, allowing inserters to move supplies between surfaces.
help-advanced-property-summary=The science pack selects the property type, while construction level affects this build's cost and attributes.\n\nProperty can be traded, bought again, or salvaged, and expires at the end of its lifetime.
help-advanced-world-summary=Every shift creates new terrain, resources, and planetary traits.\n\nCompleted technologies may also be lost.
help-brief-start=Поставьте [img=item/wooden-chest] деревянный сундук вручную, чтобы создать личный связанный сундук.\n\nЕго нельзя открыть напрямую.\n\nЗагружайте исследовательские пакеты манипуляторами.\n\nКаждый пакет превращается в соответствующий личный опыт.
help-brief-property=Накопив опыт, потратьте опыт и выносливость в разделе строительства.\n\nТакже можно забрать базовые монеты.\n\nЗатем купите свободное владение своей страны.\n\nДля начала достаточно небольшого дома.
help-brief-storage=Четыре связанных сундука в центре владения используют общий инвентарь с вашим личным связанным сундуком.\n\nПеремещайте предметы манипуляторами.\n\nТак можно отправить во владение запасы, которые вы хотите сохранить.
help-brief-advice=Сначала постройте небольшую линию науки;\n\nогромный завод сразу не нужен.\n\nСледите за отсчётом планетарного перехода слева сверху и заранее переносите самое важное.\n\nЕсли другой игрок купит ваше владение, вы получите выручку после налога и сможете снова строить или покупать.
help-brief-travel=Нажмите [img=virtual-signal/signal-map-marker] «Перемещение» слева сверху.\n\nОтправляйтесь на родную общественную планету.\n\nДобывайте руду, вырабатывайте электричество и исследуйте технологии.\n\nНачните производство как в обычной игре Factorio.
help-brief-project=[img=virtual-signal/signal-info] QQ group: 293280221\n\n[img=virtual-signal/signal-info] GitHub: https://github.com/sandboxtech/solar-system-united-nations
help-brief-features=Каждый планетарный переход приносит новую карту, ресурсы и особенности мира.\n\nУ пяти фракций раздельные исследования, территории и рынки.\n\nСтройте, торгуйте, сотрудничайте, ведите переговоры, совершайте рейды или воюйте.
help-brief-deconstruction=[img=item/deconstruction-planner] Планировщик сноса откроется после __1__ часов общего онлайна и следующего перехода между картами.
help-section-beginner=[img=item/linked-chest] [font=default-bold]Связанный сундук и личный опыт[/font]
help-detail-linked-chest=Ручная установка деревянного сундука на разрешённой общественной планете, в лагере или владении создаёт личный связанный сундук.\n\nЕго нельзя открыть вручную;\n\nиспользуйте манипуляторы.\n\nТекущий лимит — __1__ на игрока.\n\nПри превышении самый старый возвращается деревянным сундуком.\n\nЧетыре встроенных сундука владения не входят в лимит.
help-detail-science=While you are online, your personal linked chest converts science packs about once every __1__ minute(s).\n\nConversion continues for the first __3__ hours offline, checked about once every __2__ minutes.\n\nEach pack adds one point of matching personal experience.\n\nEvery type and quality is accepted.
help-detail-logistics-limits=[img=entity/roboport] A single logistics network may contain at most __1__ roboports.\n\n[img=entity/logistic-robot] A single logistics network may contain at most __2__ logistic robots.\n\nIf placing a roboport exceeds either limit, the newly placed roboport is removed and your faction is notified.
help-detail-property-heading=[img=item/construction-robot] [font=default-bold]Property guide[/font]
help-detail-growth-heading=[img=item/space-science-pack] [font=default-bold]Experience effect formulas[/font]
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-full-growth-summary=Total level improves new ships and lowers property-sale tax.\n\nBuilding property spends experience.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory.\n\nEvery type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nWhile standing inside their own temporary property, the owner may renew, upgrade, or salvage it.\n\nRenewal restores its full original lifetime and charges for the missing life and current area.\n\nAn upgrade raises the property by one construction level and applies that level's size, total lifetime, and price-decay period.\n\nSalvage immediately evacuates everyone, destroys all contents, and deletes the surface.\n\nPermanent public property cannot be renewed, upgraded, or salvaged.\n\nA property name can only be chosen during construction. Leaving it blank uses a default made from the planet, owner, and property number.
help-detail-property-build=Choose a construction level from 0 to your current total level.\n\nHigher levels usually cost more experience and, depending on the type, change dimensions, lifetime, price decay, or opening price.\n\nDifferent science packs produce different property types.\n\nThe Fortified Bunker resists burglary;\n\nthe Aquilo Cryo-Habitat lasts a long time but is easier to enter illegally.\n\nThe Build page shows the actual cost and every resulting attribute.\n\nOnce built, those attributes no longer change with your level.
help-detail-world-heading=[img=space-location/nauvis] [font=default-bold]Public planets[/font]
help-detail-formulas-heading=[img=item/coin] [font=default-bold]Property construction and trade formulas[/font]
help-detail-property-build-formula=Let L be the selected construction level.\n\nMatching science-pack experience spent = __1__+__2__×L, plus __3__ stamina.\n\nOpening price = min(__6__, ceil(experience cost × current construction-price multiplier __4__ × property-type multiplier)).\n\nEach planet retains at most __5__ properties.
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T))));\n\nthe current price factor is a=__2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe current base tax rate is __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nRaising the price of your own property is a normal transaction and updates P and D; its tax rate is multiplied by __3__.\n\nExperience refund = floor(build experience × __2__% × remaining life/original life × current area/original area).\n\nRenewal stamina = 1000 + ceil(build stamina × missing life/original life × current area/original area).
help-full-property-summary=Building costs experience and stamina.\n\nBuying raises the next asking price by about ×__1__;\n\nthe previous owner receives the after-tax proceeds.\n\nHover for formulas.
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases.\n\nTemperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%.\n\nMinimum brightness is 0–0.2.\n\nPeaceful mode has __8__% probability.\n\nThe current technology price multiplier is __9__.\n\nSpoil-time and asteroid-spawning multipliers are __10__ and __11__.
help-detail-ship-heading=[img=virtual-signal/signal-map-marker] [font=default-bold]Travel, respawn, and planetary shifts[/font]
help-detail-travel=Each public planet has its own United Nations Refugee Camp.\n\nThe top-level Travel button switches between your home public planet and its camp;\n\nfrom local property, it returns to the public planet.\n\nThe Property button enters only property you own.\n\nIt cycles in property-number order when you own several and is disabled when you own none.\n\nBefore leaving a public planet, your coordinates and its current shift cycle are recorded.\n\nYour position is also recorded when leaving a refugee camp.\n\nIf it is still the same world, returning places you near the recorded position when possible.\n\nChanging factions clears both records.\n\nAfter a shift, or when no nearby landing point exists, you arrive at a random point in the 256×256 area around spawn.\n\nPositions nearer spawn are more likely.\n\nOn an ordinary death, having at least __1__ stamina automatically spends __1__ stamina and respawns you after __2__ seconds;\n\notherwise no stamina is spent, and respawn takes __3__ seconds.\n\nOrdinary deaths respawn at your faction's camp.\n\nSwitching factions kills your character in place and leaves the corpse and items behind.\n\nYou respawn at the target faction's camp after __3__ seconds without an additional respawn charge.
help-detail-resets=The five public planets count down independently.\n\nForeign characters receive an evacuation warning before a shift.\n\nCitizens evacuate to their home United Nations Refugee Camp when their planet shifts.\n\nEach new world generates different terrain, resources, and planetary traits.
help-detail-tech-leak=Each faction receives a separate technology-leak check every __1__ hour(s).\n\nTechnologies on the immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak.\n\nInfinite research loses only one level when hit.
help-detail-reset-schedule=The next shift is scheduled randomly between __1__ and __2__ hours away.\n\nEach new world changes resources, terrain, enemies, climate, and daylight.\n\nPlanet-specific terrain and resources also vary.\n\nA new world has a small chance to be peaceful.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses.\n\nNormal technology is revoked;\n\ninfinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round.\n\nЗатем применяется множитель фракции.\n\nДля [img=space-location/aquilo] сейчас установлен ×__3__, для остальных фракций — ×1.
help-full-world-summary=Every shift creates a newly randomized public world.\n\nHover for exact ranges, timing, and technology-loss probabilities.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks.\n\nAn asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space.\n\nIts target faction comes from the character's current public planet, United Nations Refugee Camp, or property.\n\nProperties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record.\n\nA failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet.\n\nLowering it never deletes existing property;\n\nit only blocks construction, preventing an administrative setting from erasing player assets.\n\nEach player is limited to one personal linked chest;\n\ncentral property chests are excluded.\n\nProperty and ship expiry evacuate players before deletion.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass.\n\nThe player record, inventory, personal blueprints, account and owned assets are removed;\n\nonly science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]Starting resources for new players[/font]
help-admin-starter-resources=Replace the starting-resource list with one /sc command:\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\nThe change takes effect immediately and only affects players created afterward.\n\nIt does not grant or remove items retroactively.\n\nEach entry uses an item prototype name and count.\n\nUnknown items and non-positive counts are skipped;\n\noverflow is dropped at the character's feet.\n\nSet it to {} to stop granting starting resources.\n\nRestore the config.lua defaults with:\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe new-property initial-price multiplier affects only properties built afterward;\n\nthe salvage rate immediately affects player-built property not yet salvaged.\n\nEach property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nDiplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>.\n\nIt reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies.\n\nReplace the whole list with one /sc command;\n\nthe next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default.\n\nWhen enabled, it bypasses visitor permissions for local property only;\n\nit does not bypass the space or foreign-world travel restriction.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
