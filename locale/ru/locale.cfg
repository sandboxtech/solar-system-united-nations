faction-current-summary=[img=space-location/solar-system-edge] Текущая фракция: __1__
faction-aquilo-neutral=[img=space-location/aquilo] Технократическая академия Аквило постоянно нейтральна.\n\nОна всегда дружит со всеми другими странами и не участвует в дипломатических переменах.
faction-switch=Предать и вступить
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Бесплатно перейти в __1__
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Совершите самоубийство и присоединитесь к __1__.\n\nНе требует выносливости и монет.\n\nВаш персонаж умирает на месте, оставляя после себя труп и предметы, а затем возрождается в лагере беженцев Наувис после __2__ секунд.\n\nВаша старая фракция конфискует ваше имущество и уничтожает личные связанные сундуки; корабли остаются вашими.
faction-already-current=Вы уже принадлежите к этой фракции.
faction-online-required=У вас должно быть общее количество онлайн-часов __1__, прежде чем присоединиться к другой фракции. \n\nО __2__ остается.
faction-target-location-required=Ваш персонаж должен достичь публичного мира __1__, прежде чем присоединиться к этой фракции.
faction-switch-cooldown=Вы должны подождать __1__, прежде чем снова дезертировать.
faction-switch-broadcast=__2__ [img=entity/character] __1__ вступает во фракцию.
player-joined-foreign=__2__ [img=entity/character] __1__ в сети.
player-killed-broadcast=__2__ [img=entity/character] __1__ убивает __4__ [img=entity/character] __3__.
