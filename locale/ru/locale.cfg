scenario-name=Объединённые Нации Солнечной системы
description=\n[font=default-large-bold]Организация Объединённых Наций Солнечной системы[/font]\n\nПять фракций осваивают общественные планеты, которые периодически переходят к новым мирам.\n\nПревращайте исследовательские пакеты в личный опыт, стройте временные владения и переносите промышленность в следующий мир.\n\n[img=virtual-signal/signal-map-marker] Изучите перемещение и родной лагерь  →  [img=item/linked-chest] Загружайте пакеты манипуляторами  →  [img=item/construction-robot] Постройте или купите первое владение\n\nДо перехода перенесите важные машины и запасы в безопасное место.\n\nПолные правила находятся в игровом руководстве.\n\nПроект: https://github.com/sandboxtech/solar-system-united-nations\nQQ: 293280221

