faction-switch-tooltip=Defect and join __1__.\n\nCosts __2__ stamina.\n\nYour old faction confiscates your properties; your ship and personal linked chests are destroyed.\n\nYour character dies in place, leaving its corpse and items behind. Respawn takes __3__ seconds with no additional stamina charge.
faction-switch-tooltip-free=Defect and join __1__.\n\nDefecting to the [img=space-location/nauvis] Nauvis faction costs no stamina.\n\nYour old faction confiscates your properties; your ship and personal linked chests are destroyed.\n\nYour character dies in place, leaving its corpse and items behind. Respawn takes __2__ seconds with no additional stamina charge.
