faction-page-tooltip=Administrators control whether ordinary surfaces are hidden.\n\nCurrently hidden from foreign factions: __3__.\n\nCurrently hidden from the home faction: __4__.\n\nShip owners still control space-platform visibility.\n\nFriendly countries additionally share explored chart data and observe a ceasefire.\n\nHostile countries do not share chart data, and their defences may fire on foreign players.\n\nAfter a country researches [img=technology/space-platform-thruster] Space platform thruster, its diplomacy may change when its home planet shifts.\n\nThe friendly-to-hostile chance is __1__%.\n\nThe hostile-to-friendly chance is __2__%.\n\nThe [img=space-location/aquilo] Aquilo Technocratic Academy remains permanently neutral.
