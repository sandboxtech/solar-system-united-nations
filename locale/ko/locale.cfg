player-social-tooltip=Friend records are one-way, with at most __1__ entries per player.\n\nPlayers in the same faction must add each other before they may enter one another's properties.\n\nTransfer command: /un-transfer <player> <amount>\n\nEach transfer is at least [img=item/coin] __2__.\n\nThe fee is max([img=item/coin] __4__, ceil(amount×__3__%)).\n\nIt is deducted from the recipient's proceeds, while the sender pays only the transfer amount.
