coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=귀하의 개인 연결 상자가 활성화되었습니다(__1__/__2__). 손으로 열 수 없습니다. 삽입기를 사용하십시오.
dropoff-refund-spilled=귀하의 인벤토리가 가득 차서 반환된 연결 상자가 땅에 떨어졌습니다.
dropoff-replaced=가장 오래된 개인 연결 상자가 제거되어 연결 상자로 반환되었습니다.
dropoff-space-forbidden=개인 연결 상자는 우주 플랫폼에 배치할 수 없습니다. 상품이 반품되었습니다.
dropoff-placement-forbidden=개인 연결 상자는 여기에 놓을 수 없습니다. 상품이 반품되었습니다.
dropoff-limit-disabled=현재 개인 연동 상자 한도는 0입니다. 아이템이 반환되었습니다.
science-converted-notification=과학 팩 변환: 경험치 __1__
roboport-limit-ports=[img=entity/roboport] 건설 거부: 연결된 물류 네트워크에는 __2__ 한도를 초과하는 __1__ 로봇 포트가 포함됩니다. 새로 배치된 로보포트가 제거되었습니다.
roboport-limit-robots=[img=entity/logistic-robot] 건설 거부: 연결된 물류 네트워크에 __1__ 물류 로봇이 포함되어 있으며 __2__ 한도를 초과합니다. 새로 배치된 로보포트가 제거되었습니다.
roboport-limit-both=[img=entity/roboport] 구축 거부됨: 연결된 물류 네트워크에는 __1__ 로봇포트(__2__ 제한) 및 __3__ 물류 로봇(__4__ 제한)이 포함됩니다. 새로 배치된 로보포트가 제거되었습니다.
