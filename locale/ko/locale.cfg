scenario-name=태양계 국제연합
description=\n[font=default-large-bold]태양계 국제연합[/font]\n\n다섯 세력이 주기적으로 새로운 세계로 바뀌는 공공 행성에서 발전합니다.\n\n과학 팩을 생산해 개인 경험치로 바꾸고, 임시 거점을 건설해 산업을 다음 세계로 이어 가세요.\n\n[img=virtual-signal/signal-map-marker] 고향 행성으로 이동  →  [img=item/linked-chest] 투입기로 과학을 경험치로 변환  →  [img=item/construction-robot] 첫 부동산 건설 또는 구매\n\n처음부터 모든 규칙을 읽을 필요는 없습니다.\n\n일반적인 공장을 건설하고, 이동 카운트다운을 확인하며 중요한 물자를 캠프나 부동산에 보관하세요.\n\n프로젝트: https://github.com/sandboxtech/solar-system-united-nations\nQQ 그룹: 293280221

