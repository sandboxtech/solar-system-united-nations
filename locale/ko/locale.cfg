property-auto-trade-balance-tooltip=Items in the left iron chest define the target stock.\n\nGoods above that target in the right steel chest are sold; shortages are bought. No trade occurs when both counts match.\n\nTo test selling, leave the left iron chest empty and place goods only in the right steel chest.\n\nThe system handles only normal-quality goods traded by your national market.\n\nWhile the owner is online, it attempts an adjustment every __1__ minute.\n\nTrades use the owner's coins and are limited by market stock, market funds, and steel-chest space.
