faction-current-summary=[img=space-location/solar-system-edge] 현재 세력: __1__
faction-aquilo-neutral=[img=space-location/aquilo] Aquilo Technocratic Academy는 영구적으로 중립적입니다. \n\n다른 모든 국가와 항상 우호 관계를 유지하며 외교 교대에 참여하지 않습니다.
faction-switch=탈주 후 가입
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] 무료로 __1__(으)로 탈주
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=자살하고 __1__에 합류하세요.\n\n스태미나나 코인이 소모되지 않습니다.\n\n캐릭터가 그 자리에서 죽고 시체와 아이템을 남긴 후 Nauvis 난민 캠프에서 다시 생성됩니다. __2__ 초.\n\n귀하의 기존 세력이 귀하의 재산을 압수하고 개인 연결 상자를 파괴합니다. 배는 당신의 것입니다.
faction-already-current=당신은 이미 이 세력에 속해 있습니다.
faction-online-required=다른 팩션에 가입하려면 __1__의 총 온라인 시간을 보유해야 합니다.\n\nAbout __2__가 남아 있습니다.
faction-target-location-required=귀하의 캐릭터는 해당 세력에 합류하기 전에 __1__의 공개 세계에 도달해야 합니다.
faction-switch-cooldown=다시 탈북하려면 __1__를 기다려야 합니다.
faction-switch-broadcast=__2__ [img=entity/character] __1__가 세력에 합류했습니다.
player-joined-foreign=__2__ [img=entity/character] __1__가 온라인 상태가 되었습니다.
player-killed-broadcast=__2__ [img=entity/character] __1__가 __4__ [img=entity/character] __3__를 죽였습니다.
