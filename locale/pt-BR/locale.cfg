faction-aquilo-neutral=[img=space-location/aquilo] A Academia Tecnocrática Aquilo é permanentemente neutra.\n\nEle sempre permanece amigável com todos os outros países e não participa de mudanças diplomáticas.
faction-switch=Desertar e ingressar
faction-switch-confirm=[img=utility/confirm_slot] Defect to __1__ — __2__ stamina + [img=item/coin] __3__
faction-switch-confirm-free=[img=utility/confirm_slot] Desertar gratuitamente para __1__
faction-switch-tooltip=Reach __1__ before defecting. Costs __2__ stamina and [img=item/coin] __3__. Another defection requires __4__ hours.
faction-switch-tooltip-free=Cometa suicídio e junte-se a __1__.\n\nNão custa energia ou moedas.\n\nSeu personagem morre no local, deixando seu cadáver e itens para trás, depois reaparece no Campo de Refugiados de Nauvis __2__ segundos.\n\nSua antiga facção confisca suas propriedades e destrói baús pessoais vinculados; os navios permanecem seus.
faction-already-current=Você já pertence a esta facção.
faction-online-required=Você deve ter __1__ total de horas online antes de ingressar em outra facção.\n\nSobre __2__ permanece.
faction-target-location-required=Seu personagem deve alcançar o mundo público de __1__ antes de ingressar nessa facção.
faction-switch-cooldown=Você deve esperar __1__ antes de desertar novamente.
faction-switch-broadcast=__2__ [img=entity/character] __1__ juntou-se à facção.
player-joined-foreign=__2__ [img=entity/character] __1__ ficou online.
