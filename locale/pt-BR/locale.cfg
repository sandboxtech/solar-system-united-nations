property-renew-tooltip=Only the owner may renew while physically inside the property.\n\nRenewal restores the remaining life to its full original lifetime (__5__ hours); it does not add another full term.\n\nExperience and stamina costs follow the missing lifetime and current area, with an additional fixed cost of 1000 stamina.\n\nCurrent cost: __1__ __2__ __3__ experience and __4__ stamina.
