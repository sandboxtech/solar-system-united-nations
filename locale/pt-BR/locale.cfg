help-shift-card-travel=[img=utility/time_editor_icon] [font=default-bold]Planetas públicos e transições[/font]
help-shift-travel-summary=Use a entrada do acampamento para chegar ao seu planeta público.\n\nQuando a contagem regressiva termina, esse planeta muda para um mundo recém-gerado.
help-shift-travel-detail=Os cinco planetas públicos têm contagens regressivas independentes.\n\nPortais conectam o campo de refugiados, o planeta público e o porão de cada país.\n\nDurante uma transição, os cidadãos são evacuados para seu acampamento.\n\nPersonagens estrangeiros são avisados e mortos __1__ e __2__ minutos antes;\n\num valor de 0 desativa a respectiva evacuação forçada.\n\nO novo mundo gera terrenos, recursos e características planetárias diferentes.
help-shift-card-logistics=[img=item/linked-chest] [font=default-bold]Logística vinculada[/font]
help-shift-logistics-summary=Baús vinculados nacionais transportam suprimentos entre seu planeta público e o Campo de Refugiados.\n\nFazer um baú de madeira à mão produz um baú vinculado pessoal.
help-shift-logistics-detail=Quando um jogador fabrica manualmente um baú de madeira [img=item/wooden-chest], seu resultado se torna um baú pessoal vinculado [img=item/linked-chest].\n\nBaús de madeira colocados diretamente por jogadores ou robôs permanecem baús de madeira comuns.\n\nA pessoal vinculado o baú deve ser colocado à mão e não pode ser usado em uma plataforma espacial.\n\nNão pode ser aberto diretamente; usar insersores.\n\nCada jogador pode atualmente colocar __1__;\n\nmineração ou substituição retorna o próprio baú vinculado.\n\nOs administradores controlam o comum permitido superfícies.\n\nOs baús de logística nacional não são pessoais. Baús correspondentes em cada destino compartilham um inventário.
help-shift-card-advice=[img=virtual-signal/signal-info] [font=default-bold]O que fazer primeiro[/font]
help-shift-advice-summary=Comece construindo como em um jogo normal.\n\nAssista à contagem regressiva no canto superior esquerdo e envie os suprimentos que você mais valoriza de volta ao acampamento.
help-shift-advice-detail=Cada turno traz um mapa diferente.\n\nOs recursos e as condições ambientais também podem mudar.\n\nNão deixe transportes importantes para o último minuto.
help-factory-card-experience=[img=item/automation-science-pack] [font=default-bold]Ciência e experiência[/font]
help-factory-experience-summary=Baús vinculados pessoais transformam pacotes científicos em experiência.\n\nA experiência em todas as categorias científicas contribui para o nível total.
help-factory-card-building=[img=item/construction-robot] [font=default-bold]Construir um interior de fábrica[/font]
help-factory-building-summary=Escolha um pacote científico e um nível de construção na página Construir.\n\nCada pacote cria um layout, vida útil e função diferentes.
help-factory-card-logistics=[img=item/linked-chest] [font=default-bold]Logística de interiores[/font]
help-factory-logistics-summary=Os baús de entrada se conectam ao inventário pessoal vinculado de seu proprietário.\n\nUuse insersores e carregadores para mover suprimentos entre superfícies.
help-factory-card-robots=[img=entity/roboport] [font=default-bold]Redes de robôs[/font]
help-factory-robots-summary=Os interiores das fábricas podem conter redes de robôs.\n\nCada rede logística tem um limite de tamanho.
help-market-card-manual=[img=item/coin] [font=default-bold]Mercado local[/font]
help-market-manual-summary=Enquanto estiver em território nacional, negocie mercadorias diretamente de seu inventário principal.\n\nCada país possui estoque, fundos e preços independentes.
help-market-card-automatic=[img=item/logistic-science-pack] [font=default-bold]Oficina de Mercado[/font]
help-market-automatic-summary=Uma oficina de mercado compara seu baú de ferro com seu baú de aço.\n\nEnquanto o proprietário está on-line, ele negocia em direção às quantidades alvo.
help-market-card-prices=[img=virtual-signal/signal-anything] [font=default-bold]Como os preços se movem[/font]
help-market-prices-summary=A venda adiciona estoque e empurra os preços para baixo.\n\nA compra remove o estoque e empurra os preços para cima.
help-market-prices-detail=Cada mercado nacional calcula os preços separadamente.\n\nVender um item adiciona estoque e reduz o preço desse item;\n\na perda de fundos de mercado também reduz ligeiramente outros itens.\n\nA compra inverte ambos os efeitos.\n\nGrandes negociações integram toda a curva de preços em vez de multiplicar a quantidade pelo preço unitário atual.\n\nItens fora de estoque não podem ser comprados;\n\num mercado subfinanciado não pode continuar comprando de jogadores.
help-property-card-ownership=[img=item/stone-brick] [font=default-bold]Propriedade local[/font]
help-property-ownership-summary=Você pode comprar e administrar propriedades apenas em seu próprio país.\n\nSeu personagem deve estar no acampamento natal antes de entrar na propriedade.
help-property-ownership-detail=A página Propriedades mostra imóveis em todos os cinco países.\n\nPropriedades estrangeiras são somente leitura e normalmente não podem ser compradas ou inseridas.\n\nAcesso público e amizade mútua concedem permissão ao visitante local apenas;\n\nos visitantes ainda devem entrar a partir de seu acampamento de origem.
help-property-card-trading=[img=item/coin] [font=default-bold]Compras e acréscimos[/font]
help-property-trading-summary=Após uma compra, o proprietário anterior recebe o produto após impostos e o próximo preço pedido aumenta.\n\nOs proprietários também podem marcar sua própria propriedade.
help-property-card-lifecycle=[img=utility/time_editor_icon] [font=default-bold]Vida útil e manutenção[/font]
help-property-lifecycle-summary=Os interiores construídos pelo jogador têm sua própria vida útil.\n\nUm proprietário que esteja lá dentro pode renovar, expandir ou recuperar um.
help-property-card-access=[img=entity/character] [font=default-bold]Entrada e acesso público[/font]
help-property-access-summary=A propriedade pode ser limitada ao seu proprietário e amigos em comum ou aberta a todos os cidadãos.\n\nJogadores estrangeiros não podem entrar normalmente.
help-property-access-detail=A configuração de acesso do proprietário se aplica a todas as propriedades que ele possui.\n\nO acesso privado admite o proprietário e amigos em comum;\n\nO acesso público admite todos os cidadãos locais.\n\nA entrada normal ainda deve começar do acampamento de origem.\n\nUm roubo bem-sucedido é uma exceção.
help-card-story=[img=space-location/solar-system-edge] [font=default-bold]Nações Unidas de Sol[/font]
help-card-factions=[img=entity/character] [font=default-bold]Escolhendo uma facção[/font]
help-card-foreign-expedition=[img=item/rocket-silo] [font=default-bold]Expedições a planetas estrangeiros[/font]
help-card-diplomacy=[img=space-location/solar-system-edge] [font=default-bold]Relações diplomáticas[/font]
help-card-faction-switch=[img=utility/danger_icon] [font=default-bold]Troca de facções[/font]
help-story-background=As Nações Unidas do Sol se dividiram em cinco países.\n\nSua moeda comum e campos de refugiados permanecem.
help-story-background-detail=Os cinco planetas já foram governados pelas Nações Unidas do Sol.\n\nDesastres planetários repetidos e conflitos de interesse crescentes eventualmente dividiram a união.\n\nCinco novos países surgiram.\n\nEles ainda partilham uma moeda comum e mantêm Campos de Refugiados das Nações Unidas.\n\nHoje, os países podem construir juntos, fechar as suas fronteiras ou entrar em guerra.
help-story-factions=Sua facção determina seu planeta natal, o progresso da pesquisa e a propriedade de ativos.\n\nSeu acampamento e propriedade são os pontos de evacuação mais confiáveis ​​durante uma mudança planetária.
help-story-factions-detail=Novos jogadores começam na República Popular de Nauvis [img=space-location/nauvis].\n\nCada país tem pesquisas separadas.\n\nEdifícios, propriedades e plataformas espaciais também pertencem a indivíduos países.\n\nNormalmente, você pode construir, comprar e inserir propriedades apenas em seu próprio país.\n\nOs mercados imobiliários estrangeiros são apenas para visualização.\n\nOs cidadãos podem transportar suprimentos para seu acampamento e propriedade antes de um shift.\n\nJogadores estrangeiros não podem usar esses locais para evacuar suprimentos locais.
help-story-foreign=Recursos estrangeiros recompensam expedições, mas planetas públicos estrangeiros também mudam.\n\nConstrua um silo de foguete [img=item/rocket-silo] antecipadamente, lance minérios e produtos para uma plataforma orbital e leve-os para casa.
help-story-foreign-detail=Trate as bases estrangeiras como postos avançados temporários.\n\nVocê não pode usar um acampamento ou propriedade estrangeira para evacuar suprimentos.\n\nQuando o aviso de evacuação soar, mova os suprimentos através de foguetes e plataformas orbitais.\n\nVocê reaparece em seu acampamento após a morte.\n\nSeu cadáver e itens carregados permanecem para trás.
help-story-diplomacy=As superfícies comuns são visíveis para todos os cinco países por padrão; os administradores podem ocultá-los das facções nacionais ou estrangeiras separadamente.\n\nPaíses amigos compartilham dados de gráficos explorados e observam um cessar-fogo.\n\nPaíses hostis não compartilham dados de gráficos e suas defesas podem disparar contra jogadores estrangeiros.
help-story-diplomacy-detail=Os edifícios permanecem como propriedade separada.\n\nAs relações amigáveis não concedem automaticamente o controle dos aliados sobre eles.\n\nIndependentemente da diplomacia, você não pode desconstruir os edifícios de outro país com um planejador.\n\nDepois que um país comum pesquisa o propulsor da plataforma espacial [img=technology/space-platform-thruster], sua diplomacia pode mudar durante uma mudança planetária.\n\nA Academia Tecnocrática [img=space-location/aquilo] Aquilo permanece permanentemente neutro.\n\nEle permanece amigável com todos os países.
help-story-faction-switch=Switching factions forfeits your old property, ship, and personal linked chests.\n\nLeave your affairs in order.
help-story-faction-switch-detail=Switching factions kills your character in place.\n\nIts corpse and carried items remain behind.\n\nProperty in your old faction becomes unowned.\n\nYour ship and personal linked chests are destroyed.\n\nOrdinary buildings remain owned by the old faction.
help-detail-linked-chest=Manually placing a wooden chest on an allowed public planet, camp, or property establishes a personal linked chest.\n\nPersonal linked chests cannot be opened by hand and require inserters.\n\nThe current limit is __1__ per player.\n\nPlacing another at the limit recovers the oldest one as a wooden chest.\n\nA property's four built-in linked chests do not count toward this limit and share the owner's personal linked inventory.
help-detail-science=While you are online, your personal linked chest converts science packs about once every __1__ minutes.\n\nConversion continues for the first __3__ hours offline, checked about once every __2__ minutes.\n\nEach pack adds one point of matching personal experience.\n\nEvery type and quality is accepted.
help-detail-logistics-limits=[img=entity/roboport] A single logistics network may contain at most __1__ roboports.\n\n[img=entity/logistic-robot] A single logistics network may contain at most __2__ logistic robots.\n\nIf placing a roboport exceeds either limit, the newly placed roboport is removed and your faction is notified.
help-detail-experience-effects=Let total level be L.\n\nBuilding permanently spends the selected experience and may lower L.\n\nNew ship width = __1__+L×__2__.\n\nNew ship lifetime = __3__+L hours.\n\nWhen selling property, actual transaction tax rate = current base rate __4__%/(L/100+1).\n\nShip attributes are fixed when built and do not change retroactively.
help-detail-property-basic=After a purchase, the four central chests connect to the new owner's personal linked inventory.\n\nEvery type has four chests; different science packs produce properties with different size, lifetime, terrain, or security.\n\nWhile standing inside their own temporary property, the owner may renew, upgrade, or salvage it.\n\nRenewal restores its full original lifetime and charges for the missing life and current area.\n\nAn upgrade raises the property by one construction level and applies that level's size, total lifetime, and price-decay period.\n\nSalvage immediately evacuates everyone, destroys all contents, and deletes the surface.\n\nPermanent public property cannot be renewed, upgraded, or salvaged.\n\nA property name can only be chosen during construction. Leaving it blank uses the owner name and property number.
help-detail-property-build=Choose a construction level from 0 to your current total level.\n\nHigher levels usually cost more experience and, depending on the type, change dimensions, lifetime, price decay, or opening price.\n\nDifferent science packs produce different property types.\n\nSome property types also modify burglary success; the Crime page shows the resulting chance.\n\nThe Build page shows the actual cost and every resulting attribute.\n\nOnce built, those attributes no longer change with your level.
help-detail-property-build-formula=Let L be the selected construction level.\n\nMatching science-pack experience spent = (__1__+__2__×L)×__6__, plus __3__ stamina.\n\nOpening price = matching science-pack experience spent × that science pack's base market price, up to __5__ coins.\n\nEach planet retains at most __4__ properties.
help-detail-property-price=Each property stores its own price-return period T.\n\nLet P be the previous actual sale price and D the time when the price returns to P.\n\nCurrent price = min(__1__, max(1, ceil(P × a^((D−now)/T))));\n\nthe current price factor is a=__2__.\n\nProperties have no protection period and can be purchased again immediately.
help-detail-property-trade=After every sale, P becomes that sale price and D=now+T, so the immediate new asking price is about aP.\n\nThe current base tax rate is __1__%.\n\nFor seller total level L, actual transaction tax rate = base rate × 1/(L/100+1).\n\nRaising the price of your own property is a normal transaction and updates P and D; its tax rate is multiplied by __3__.\n\nExperience refund = floor(build experience × __2__% × remaining life/original life × current area/original area).\n\nRenewal stamina = 1000 + ceil(build stamina × missing life/original life × current area/original area).
help-detail-world-randomization=Each round uses resource baselines frequency __1__, size __2__, and richness __3__, independently multiplied by 2^U(-__4__,__4__).\n\nWater and native terrain use 2^U(-__5__,__5__).\n\nCliffs use 2^U(-__6__,__6__).\n\nEnemy bases and starting area use 2^U(-__7__,__7__).\n\nMoisture and aux receive centered ±0.5 biases.\n\nTemperature receives a centered ±20 bias.\n\nDaylight occupies 20%–80%.\n\nMinimum brightness is 0–0.2.\n\nThe current technology price multiplier is __8__.\n\nSpoil-time and asteroid-spawning multipliers are __9__ and __10__.
help-detail-tech-leak=Each faction receives a separate technology-leak check every __1__ hour(s).\n\nTechnologies on the immunity list, trigger technologies, and direct prerequisites of current research are protected.\n\nOther technologies granted at startup, including their prerequisites, can still leak.\n\nInfinite research loses only one level when hit.
help-detail-reset-schedule=The next shift is scheduled randomly between __1__ and __2__ hours away.\n\nEach new world changes resources, terrain, enemies, climate, and daylight.\n\nIt also rolls 0–5 planetary traits.\n\nSpecial rules such as a peaceful ecosystem, eternal daylight on Fulgora, or dormant demolisher territories appear as traits too.
help-detail-tech-leak-formula=Each technology-leak round shares one intensity x, uniformly rolled from 0 to __1__.\n\nA completed technology's loss chance is x% times the number of distinct science-pack types it uses.\n\nNormal technology is revoked.\n\nInfinite research loses one level.\n\nEach faction can lose or downgrade at most __2__ technologies per round.\n\nA faction-specific multiplier is then applied.\n\n[img=space-location/aquilo] currently uses ×__3__.\n\nEvery other faction uses ×1.
help-admin-security-heading=[img=virtual-signal/signal-info] [font=default-bold]Permissions and abuse resistance[/font]
help-admin-security=The GUI is display only.\n\nPurchases, entry, construction, crime, travel, and faction switching revalidate the player, faction, physical location, balance, stamina, ownership, and surface existence on click.\n\nA stale GUI cannot bypass these checks.\n\nAn asynchronously deleted property simply becomes unavailable.\n\nTravel and crime use the character's physical surface, not the surface shown in remote view.\n\nCrime is disabled in space.\n\nIts target faction comes from the character's current public planet, United Nations Refugee Camp, or property.\n\nProperties owned by the criminal or opened to all players are excluded.\n\nFaction switching charges first and installs a one-shot death record.\n\nA failed death is refunded.\n\nThat death always takes 60 seconds and cannot trigger the ordinary fast-respawn charge.
help-admin-limits-heading=[img=utility/warning_icon] [font=default-bold]Capacity and cleanup[/font]
help-admin-limits=The current soft property cap is __1__ per planet.\n\nLowering it never deletes existing property;\n\nit only blocks construction, preventing an administrative setting from erasing player assets.\n\nThe Administration page controls personal linked-chest count and allowed surfaces;\n\nbuilt-in property chests are excluded.\n\nLowering the count recovers the oldest excess chests.\n\nAt most one non-admin player continuously offline for __2__ hours is removed per hourly pass.\n\nThe player record, inventory, personal blueprints, account and owned assets are removed;\n\nonly science experience is retained by player name.\n\nA planetary shift closes entry and evacuates characters before the old world is released.
help-admin-starter-resources-heading=[img=item/iron-plate] [font=default-bold]Starting resources for new players[/font]
help-admin-starter-resources=Replace the starting-resource list with one /sc command:\n\n/sc storage.starter_resources={{name="iron-plate",count=500},{name="wood",count=100}}\n\nThe change takes effect immediately and only affects players created afterward.\n\nIt does not grant or remove items retroactively.\n\nEach entry uses an item prototype name and count.\n\nUnknown items and non-positive counts are skipped;\n\noverflow is dropped at the character's feet.\n\nSet it to {} to stop granting the listed resources.\n\nNew players still receive the same starter equipment offered on the Personal page.\n\nRestore the config.lua defaults with:\n\n/sc storage.starter_resources=nil
help-admin-controls-heading=[img=virtual-signal/signal-A] [font=default-bold]Dynamic-setting boundaries[/font]
help-admin-controls=The Administration page is visible only to administrators.\n\nCommon economy, property, planet, diplomacy, technology-leak, and global multipliers can be adjusted live.\n\nThe salvage rate immediately affects player-built property not yet salvaged.\n\nEach property's dimensions, T, lifetime, terrain, and risk follow its configured type.\n\nShift-period bounds and interpolation exponent a apply to the next roll without rewriting an already scheduled countdown.\n\nDiplomacy probabilities apply to the next shift-triggered roll.\n\nTo trigger a planetary shift manually, use /un-reset-planet <nauvis|vulcanus|gleba|fulgora|aquilo>.\n\nIt reuses the normal evacuation and generation path and refuses to run while another planet is shifting.\n\n[font=default-bold]Technology-leak immunity[/font]\n\nThe immunity list is stored directly in storage.tech_leak_immune_technologies.\n\nReplace the whole list with one /sc command;\n\nthe next leak check uses it immediately.\n\nDefault example: /sc storage.tech_leak_immune_technologies={["logistic-robotics"]=true,["space-platform-thruster"]=true,["planet-discovery-vulcanus"]=true,["planet-discovery-gleba"]=true,["planet-discovery-fulgora"]=true,["planet-discovery-aquilo"]=true}\n\n“Administrators may enter any local property” is disabled by default.\n\nWhen enabled, it bypasses visitor permissions for local property only;\n\nadministrators must still stand in their home United Nations Refugee Camp.\n\nChanging settings does not retroactively grant, charge, or recalculate completed transactions, property, or ships.
