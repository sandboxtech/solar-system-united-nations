property-faction-survival-tooltip=Only the public planet corresponding to your current faction is your home planet.\n\nEvery other public planet is foreign.\n\nYou may inspect foreign property markets, but cannot normally buy or enter their property.\n\nThe current foreign-character purge times are __1__ and __2__ minutes before a shift.\n\nEach nonzero time issues a shift warning and kills foreign characters still on that planet.\n\nYou later respawn at your home camp.\n\nCorpses and supplies left on the previous world do not arrive on the new one.
