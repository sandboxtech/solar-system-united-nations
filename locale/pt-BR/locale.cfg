coin-tooltip=Coins are the common currency of all five factions.\n\nClaim UBI, receive transfers, or sell and salvage property to earn coins.\n\nBuying property, transfer fees, and crime remove coins from circulation.
dropoff-created-count=Seu baú vinculado pessoal está ativo (__1__/__2__). Não pode ser aberto manualmente; use insersores.
dropoff-refund-spilled=Seu baú vinculado devolvido caiu no chão porque seu inventário estava cheio.
dropoff-replaced=Seu baú vinculado pessoal mais antigo foi removido e devolvido como um baú vinculado.
dropoff-space-forbidden=Baús vinculados pessoais não podem ser colocados em plataformas espaciais. O item foi devolvido.
dropoff-placement-forbidden=Baús vinculados pessoais não podem ser colocados aqui. O item foi devolvido.
