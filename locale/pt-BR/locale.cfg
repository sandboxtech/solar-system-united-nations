scenario-name=Nações Unidas do Sol
description=\n[font=default-large-bold]Nações Unidas do Sol[/font]\n\nCinco facções desenvolvem planetas públicos que periodicamente saltam para um mundo novo.\n\nProduza pacotes científicos, transforme-os em experiência pessoal e construa propriedades temporárias para levar sua indústria adiante.\n\n[img=virtual-signal/signal-map-marker] Vá para seu planeta natal  →  [img=item/linked-chest] Transforme ciência em experiência com braços insertores  →  [img=item/construction-robot] Construa ou compre sua primeira propriedade\n\nVocê não precisa ler todas as regras antes de começar.\n\nConstrua uma fábrica normal, acompanhe a contagem regressiva e guarde o essencial no acampamento ou na propriedade.\n\nProjeto: https://github.com/sandboxtech/solar-system-united-nations\nGrupo QQ: 293280221

