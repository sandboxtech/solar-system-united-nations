roboport-limit-ports=[img=entity/roboport] Construção rejeitada: a rede logística conectada conteria roboportos __1__, acima do limite de __2__. O roboport recém-colocado foi removido.
roboport-limit-robots=[img=entity/logistic-robot] Construção rejeitada: a rede logística conectada contém robôs logísticos __1__, acima do limite de __2__. O roboport recém-colocado foi removido.
